name: CAMI III LANTERN Toy coverage metadata inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-coverage-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract public coverage metadata
        run: |
          set -euo pipefail
          mkdir -p coverage_head
          curl -fsSL --retry 5 --retry-all-errors 'https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/coverages.tar.gz' -o /tmp/coverages.tar.gz
          tar -xzf /tmp/coverages.tar.gz -C coverage_head coverages/coverage_0.tsv coverages/coverage_1.tsv
          head -30 coverage_head/coverages/coverage_0.tsv | tee coverage_head/coverage_0_head.txt
          head -30 coverage_head/coverages/coverage_1.tsv | tee coverage_head/coverage_1_head.txt
          sha256sum /tmp/coverages.tar.gz > coverage_head/COVERAGES_ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_COVERAGE_METADATA_20260819
          path: coverage_head
          if-no-files-found: error
          retention-days: 90
