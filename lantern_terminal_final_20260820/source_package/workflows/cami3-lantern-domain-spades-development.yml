name: CAMI III LANTERN domain-specific SPAdes development

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-domain-spades-development.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  READ_RUN_ID: '32332720862'
  SEED: '20260819'

jobs:
  domain-assembly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: metaviral
            executable: metaviralspades.py
          - mode: metaplasmid
            executable: metaplasmidspades.py
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable development read artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_TOY_READS_S*_V1
          path: read_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.READ_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-domain-spades
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            spades=4.3.0
            minimap2=2.31
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all

      - name: Freeze longitudinal paired-end inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mode='${{ matrix.mode }}'
          root="domain_${mode}"
          mkdir -p "$root"/{reads,assembly,evaluation,truth_download,truth,provenance,logs,failure_audit}
          for s in 0 1; do
            r1=$(find read_artifacts -type f -name "S${s}_R1.fastq.gz" -print -quit)
            r2=$(find read_artifacts -type f -name "S${s}_R2.fastq.gz" -print -quit)
            test -s "$r1"; test -s "$r2"
            ln -s "$PWD/$r1" "$root/reads/S${s}_R1.fastq.gz"
            ln -s "$PWD/$r2" "$root/reads/S${s}_R2.fastq.gz"
          done
          # Concatenated gzip streams are valid gzip and preserve a single paired library.
          cat "$root/reads/S0_R1.fastq.gz" "$root/reads/S1_R1.fastq.gz" > "$root/reads/pair_R1.fastq.gz"
          cat "$root/reads/S0_R2.fastq.gz" "$root/reads/S1_R2.fastq.gz" > "$root/reads/pair_R2.fastq.gz"
          gzip -t "$root/reads/pair_R1.fastq.gz" "$root/reads/pair_R2.fastq.gz"
          seqkit stats -T "$root/reads/pair_R1.fastq.gz" "$root/reads/pair_R2.fastq.gz" > "$root/provenance/READ_STATS.tsv"
          sha256sum "$root/reads/pair_R1.fastq.gz" "$root/reads/pair_R2.fastq.gz" > "$root/provenance/READ_SHA256.txt"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          python --version > "$root/provenance/PYTHON_VERSION.txt"
          '${{ matrix.executable }}' --version > "$root/provenance/SPADES_VERSION.txt" 2>&1 || true
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'mode=%s\nread_run=%s\nseed=%s\ngold_accessed=false\n' "$mode" "$READ_RUN_ID" "$SEED" > "$root/provenance/FROZEN_INPUTS.txt"

      - name: Run truth-blind domain-specific assembly and freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mode='${{ matrix.mode }}'; exe='${{ matrix.executable }}'; root="domain_${mode}"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=120s 300m \
            "$exe" --only-assembler -1 "$root/reads/pair_R1.fastq.gz" -2 "$root/reads/pair_R2.fastq.gz" \
            -t 4 -m 14 -o "$root/assembly/out" > "$root/logs/ASSEMBLY.log" 2>&1
          rc=$?
          set -e
          printf 'exit_code=%s\ncommand=%s --only-assembler -1 pair_R1 -2 pair_R2 -t 4 -m 14\n' "$rc" "$exe" > "$root/failure_audit/ASSEMBLY.status"
          contigs=$(find "$root/assembly/out" -maxdepth 3 -type f \( -name 'contigs.fasta' -o -name 'scaffolds.fasta' \) -size +0c -print -quit)
          test -n "$contigs"
          cp "$contigs" "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$mode" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); mode=sys.argv[2]; p=root/'assembly/final_assembly.fasta'
          obj={'mode':mode,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'assembly_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'assembly_bytes':p.stat().st_size,'truth_accessed':False,'boundary':'Domain-specific assembly completed and hashed before Toy gold-standard access.'}
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Evaluate only after assembly freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mode='${{ matrix.mode }}'; root="domain_${mode}"
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          sha256sum "$root/truth_download"/*.tar.gz > "$root/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" \
            --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/combined_truth.fasta" "$root/assembly/final_assembly.fasta" \
            > "$root/evaluation/assembly_to_truth.paf" 2> "$root/logs/MINIMAP2.log"
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf "$root/evaluation/assembly_to_truth.paf" \
            --truth-mapping "$root/truth/truth_mapping.tsv" \
            --assembly-fasta "$root/assembly/final_assembly.fasta" \
            --min-identity 0.90 --min-alignment 500 --out "$root/evaluation" \
            > "$root/logs/EVALUATE.log" 2>&1
          test -s "$root/evaluation/GOLD_COVERAGE_SUMMARY.json"

      - name: Compact reproducible evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          mode='${{ matrix.mode }}'; root="domain_${mode}"
          rm -rf "$root/reads" "$root/assembly/out" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/evaluation/assembly_to_truth.paf"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_DOMAIN_${{ matrix.mode }}_DEVELOPMENT_20260820
          path: domain_${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
