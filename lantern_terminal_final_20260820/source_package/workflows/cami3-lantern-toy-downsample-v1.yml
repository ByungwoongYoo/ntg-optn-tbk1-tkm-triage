name: CAMI III LANTERN Toy pair deterministic downsample v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-toy-downsample-v1.yml'
      - 'lantern_cami3/scripts/stream_downsample_cami_tar.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downsample:
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stream and deterministically downsample short and long reads
        shell: bash
        run: |
          set -euo pipefail
          s='${{ matrix.sample }}'
          out="toy_reads/S${s}"
          mkdir -p "$out/provenance"
          short_url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz"
          long_url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz"
          python lantern_cami3/scripts/stream_downsample_cami_tar.py \
            --url "$short_url" --sample-id "S${s}" --mode short \
            --fraction 0.08 --seed 20260819 --min-kept 100000 --out-dir "$out" \
            2>&1 | tee "$out/SHORT_DOWNSAMPLE_CONSOLE.log"
          python lantern_cami3/scripts/stream_downsample_cami_tar.py \
            --url "$long_url" --sample-id "S${s}" --mode long \
            --fraction 0.04 --seed 20260819 --min-kept 1000 --out-dir "$out" \
            2>&1 | tee "$out/LONG_DOWNSAMPLE_CONSOLE.log"
          gzip -t "$out/S${s}_R1.fastq.gz" "$out/S${s}_R2.fastq.gz" "$out/S${s}_long.fastq.gz"
          python - "$out" <<'PY'
          import gzip, hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          result={}
          for p in sorted(root.glob('*.fastq.gz')):
              n=0; bases=0; minlen=None; maxlen=0; qsum=0; qn=0
              with gzip.open(p,'rt',encoding='utf-8',errors='strict') as f:
                  while True:
                      h=f.readline()
                      if not h: break
                      seq=f.readline().rstrip('\n'); plus=f.readline(); qual=f.readline().rstrip('\n')
                      if not (seq and plus and qual) or not h.startswith('@') or not plus.startswith('+') or len(seq)!=len(qual):
                          raise SystemExit(f'FASTQ integrity failure in {p} at record {n+1}')
                      n+=1; bases+=len(seq); minlen=len(seq) if minlen is None else min(minlen,len(seq)); maxlen=max(maxlen,len(seq))
                      qsum+=sum(ord(c)-33 for c in qual); qn+=len(qual)
              result[p.name]={'records':n,'bases':bases,'min_length':minlen,'max_length':maxlen,'mean_length':bases/n if n else 0,'mean_phred':qsum/qn if qn else 0,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          r1=result[f'{root.name}_R1.fastq.gz']; r2=result[f'{root.name}_R2.fastq.gz']
          if (r1['records'],r1['bases'])!=(r2['records'],r2['bases']): raise SystemExit('R1/R2 final-count mismatch')
          (root/'READ_STATS.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          uname -a > "$out/provenance/UNAME.txt"
          python --version > "$out/provenance/PYTHON_VERSION.txt"
          git rev-parse HEAD > "$out/provenance/GIT_HEAD.txt"
          printf 'short_fraction=0.08\nlong_fraction=0.04\nseed=20260819\nshort_url=%s\nlong_url=%s\n' "$short_url" "$long_url" > "$out/provenance/FROZEN_INPUTS.txt"
          find "$out" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
          du -ah "$out" | sort -h | tail -30
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_READS_S${{ matrix.sample }}_V1
          path: toy_reads/S${{ matrix.sample }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
