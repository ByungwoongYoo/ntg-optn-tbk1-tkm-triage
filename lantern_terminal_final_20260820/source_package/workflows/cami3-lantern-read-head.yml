name: CAMI III LANTERN Toy FASTQ header inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-read-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stream first FASTQ records
        run: |
          set -euo pipefail
          mkdir -p read_head
          for mode in short long; do
            if [[ "$mode" == short ]]; then url='https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_0_reads.tar.gz'; else url='https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_0_reads.tar.gz'; fi
            set +o pipefail
            curl -fsSL --retry 5 --retry-all-errors "$url" | tar -xzOf - sample_0_reads/anonymous_reads.fq.gz | gzip -dc | head -24 > "read_head/${mode}_first_records.txt"
            set -o pipefail
            cat "read_head/${mode}_first_records.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_FASTQ_HEADERS_20260819
          path: read_head
          if-no-files-found: error
          retention-days: 90
