name: B2 Z100 independent SAT hard-gap attack v4
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/b2_gap_sat_v4.py'
      - '.github/workflows/b2-gap-sat-v4.yml'
jobs:
  sat:
    strategy:
      fail-fast: false
      matrix:
        gap: [1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'python-sat'
      - name: Solve hard gap case with independent CaDiCaL CNF encoding
        run: |
          mkdir -p artifact/b2_gap_sat_${{ matrix.gap }}
          python crossdomain/b2_gap_sat_v4.py --gap ${{ matrix.gap }} --out-dir artifact/b2_gap_sat_${{ matrix.gap }}
          cp crossdomain/b2_gap_sat_v4.py artifact/b2_gap_sat_${{ matrix.gap }}/
          find artifact/b2_gap_sat_${{ matrix.gap }} -type f -print0 | sort -z | xargs -0 sha256sum > artifact/b2_gap_sat_${{ matrix.gap }}/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap-sat-${{ matrix.gap }}-v4
          path: artifact/b2_gap_sat_${{ matrix.gap }}
          retention-days: 30
          if-no-files-found: error
