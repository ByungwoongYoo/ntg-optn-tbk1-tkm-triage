name: Focused Klebsiella-colistin portal mechanism audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'amr_discovery/audit_kp_colistin_portal.py'
      - '.github/workflows/amr-kp-colistin-portal-audit.yml'
  push:
    branches: [amr-unexplained-marker-discovery-20260819]
    paths:
      - 'amr_discovery/audit_kp_colistin_portal.py'
      - '.github/workflows/amr-kp-colistin-portal-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            duckdb==1.3.2 pandas==2.3.1 pyarrow==21.0.0 \
            requests==2.32.5 tabulate==0.9.0
      - name: Record provenance
        run: |
          mkdir -p kp_colistin_portal_audit
          uname -a > kp_colistin_portal_audit/UNAME.txt
          python --version > kp_colistin_portal_audit/PYTHON_VERSION.txt
          python -m pip freeze | sort > kp_colistin_portal_audit/PIP_FREEZE.txt
          git rev-parse HEAD > kp_colistin_portal_audit/GIT_HEAD.txt
      - name: Run target and known-mechanism portal audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python amr_discovery/audit_kp_colistin_portal.py \
            --out kp_colistin_portal_audit --per-class 358 \
            2>&1 | tee kp_colistin_portal_audit/console.log
      - name: Refresh hashes
        if: always()
        run: |
          find kp_colistin_portal_audit -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > kp_colistin_portal_audit/SHA256SUMS.txt || true
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KP_COLISTIN_PORTAL_AUDIT_20260819
          path: kp_colistin_portal_audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
