name: AMR mechanistically filtered target ranking

on:
  pull_request:
    branches: [amr-audit-observer-base]
    paths:
      - 'amr_discovery/rank_mechanistically_unexplained.py'
      - '.github/workflows/amr-target-ranking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install duckdb==1.3.2 pandas==2.3.1 pyarrow==21.0.0 tabulate==0.9.0
      - run: python amr_discovery/rank_mechanistically_unexplained.py
      - name: Record provenance
        run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            uname -a
            python --version
            pip freeze
          } > amr_target_ranking/PROVENANCE.txt
          sha256sum amr_target_ranking/* | sort > amr_target_ranking/ALL_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AMR_MECHANISTIC_TARGET_RANKING_2026_07
          path: amr_target_ranking
          retention-days: 90
          compression-level: 9
