name: CAMI III LANTERN v7 short-backbone precision extension development

on:
  pull_request:
    branches: [lantern-v6-isolated-20260820]
    paths:
      - '.github/workflows/cami3-lantern-v7-short-backbone-development.yml'
      - 'lantern_v6/prepare_extension_candidates.py'
      - 'lantern_v6/extension_union.py'
      - 'lantern_cami3/scripts/summarize_abundance_recovery.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '32312941523'
  V4_RUN_ID: '32332720793'
  V4_ARTIFACT: 'LANTERN_CAMI3_HYBRID_V4_DEVELOPMENT_20260820'
  SEED: '20260820'

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable multimodal source assemblies
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_MULTIMODAL_*_20260820
          path: source_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download post-freeze abundance metadata from v4 development
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V4_ARTIFACT }}
          path: v4_metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V4_RUN_ID }}
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v7-short-backbone
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            mash=2.3
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all

      - name: Isolate source assemblies without opening performance outputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          mkdir -p "$root"/{inputs,candidates,alignments,variants,evaluation,truth_download,truth,pseudo,abundance,decision,provenance,logs}
          hybrid=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_metaspades_hybrid_pair_20260820 -type f -path '*/assembly/out/contigs.fasta' -print -quit)
          short=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_metaspades_short_pair_20260820 -type f -path '*/assembly/out/contigs.fasta' -print -quit)
          megahit=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_megahit_short_pair_20260820 -type f -path '*/assembly/out/final.contigs.fa' -print -quit)
          flye=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_flye_long_pair_20260820 -type f -path '*/assembly/out/assembly.fasta' -print -quit)
          for f in "$hybrid" "$short" "$megahit" "$flye"; do test -s "$f"; done
          cp "$short" "$root/inputs/metaspades_short_pair.fasta"
          cp "$hybrid" "$root/inputs/metaspades_hybrid_pair.fasta"
          cp "$megahit" "$root/inputs/megahit_short_pair.fasta"
          cp "$flye" "$root/inputs/flye_long_pair.fasta"
          sha256sum "$root"/inputs/*.fasta > "$root/provenance/SOURCE_ASSEMBLY_SHA256.txt"
          seqkit stats -T "$root"/inputs/*.fasta > "$root/provenance/SOURCE_ASSEMBLY_STATS.tsv"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'source_run=%s\ndevelopment_samples=0,1\nbackbone=metaspades_short_pair\ngold_accessed=false\n' "$SOURCE_RUN_ID" > "$root/provenance/CONSTRUCTION_BOUNDARY.txt"
          rm -rf source_artifacts

      - name: Build exact-deduplicated auxiliary candidate set and backbone alignments
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          python lantern_v6/prepare_extension_candidates.py \
            --source "metaspades_hybrid=$root/inputs/metaspades_hybrid_pair.fasta" \
            --source "megahit_short=$root/inputs/megahit_short_pair.fasta" \
            --source "flye_long=$root/inputs/flye_long_pair.fasta" \
            --min-length 500 --max-n-fraction 0.05 --out "$root/candidates" \
            > "$root/logs/PREPARE_CANDIDATES.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 \
            "$root/inputs/metaspades_short_pair.fasta" "$root/candidates/extension_candidates.fasta" \
            > "$root/alignments/candidate_to_short_backbone.paf" \
            2> "$root/logs/CANDIDATE_TO_BACKBONE.log"
          test -s "$root/alignments/candidate_to_short_backbone.paf"

      - name: Construct a predeclared precision-first grid before Toy gold access
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          cat > "$root/provenance/PREDECLARED_GRID.tsv" <<'EOF'
          variant	mode	min_length	min_terminal	whole_max	containment	min_sources	single_terminal
          short_terminal_500_s1	terminal	500	500	0.30	0.98	1	true
          short_terminal_1000_s1	terminal	1000	1000	0.30	0.98	1	true
          short_terminal_500_s2	terminal	500	500	0.30	0.98	2	true
          short_whole_1000_s1	whole	1000	750	0.30	0.98	1	false
          short_whole_1500_s1	whole	1500	1000	0.20	0.99	1	false
          short_whole_1000_s2	whole	1000	750	0.40	0.98	2	false
          short_hybrid_750_s1	hybrid	750	750	0.35	0.98	1	true
          short_hybrid_1000_s2	hybrid	1000	1000	0.40	0.98	2	true
          EOF
          tail -n +2 "$root/provenance/PREDECLARED_GRID.tsv" | while IFS=$'\t' read -r name mode minlen minterm wholemax contain minsources single; do
            dir="$root/variants/$name"
            extra=(); test "$single" = true && extra+=(--single-target-terminal)
            python lantern_v6/extension_union.py \
              --backbone "$root/inputs/metaspades_short_pair.fasta" \
              --candidates "$root/candidates/extension_candidates.fasta" \
              --metadata "$root/candidates/extension_candidate_metadata.tsv" \
              --candidate-to-backbone-paf "$root/alignments/candidate_to_short_backbone.paf" \
              --mode "$mode" --min-candidate-length "$minlen" --min-terminal-bp "$minterm" \
              --alignment-identity 0.97 --alignment-min-bp 500 \
              --whole-max-aligned-fraction "$wholemax" --containment-fraction "$contain" \
              --min-source-count "$minsources" "${extra[@]}" --out "$dir" \
              > "$root/logs/CONSTRUCT_${name}.log" 2>&1
            python lantern_cami3/scripts/verify_cami_assembly.py \
              "$dir/LANTERN_V6_EXTENSION_UNION.fasta" --out "$dir/VALIDATION.json"
          done
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          root=Path('v7_short_backbone_dev')
          files=[]
          for p in sorted((root/'variants').glob('*/LANTERN_V6_EXTENSION_UNION.fasta')):
              files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          if len(files)!=8: raise SystemExit(f'unexpected frozen variant count {len(files)}')
          freeze={'status':'V7_SHORT_BACKBONE_GRID_FROZEN_BEFORE_GOLD','development_samples':[0,1],'variant_count':len(files),'variants':files,'truth_accessed':False,'boundary':'All candidate preparation, alignments, parameters and assemblies were completed and hashed before public Toy gold access.'}
          (root/'provenance/TRUTH_BLIND_GRID_FREEZE.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum "$root/provenance/TRUTH_BLIND_GRID_FREEZE.json" > "$root/provenance/TRUTH_BLIND_GRID_FREEZE_SHA256.txt"

      - name: Open public development gold only after the grid freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          sha256sum "$root"/truth_download/*.tar.gz > "$root/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" \
            --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1

      - name: Evaluate frozen baselines and variants
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          cat > "$root/provenance/EVALUATED_METHODS.tsv" <<EOF
          method	fasta	role
          metaspades_short_pair	$root/inputs/metaspades_short_pair.fasta	baseline
          metaspades_hybrid_pair	$root/inputs/metaspades_hybrid_pair.fasta	baseline
          megahit_short_pair	$root/inputs/megahit_short_pair.fasta	baseline
          flye_long_pair	$root/inputs/flye_long_pair.fasta	baseline
          EOF
          for dir in "$root"/variants/*; do printf '%s\t%s\tvariant\n' "$(basename "$dir")" "$dir/LANTERN_V6_EXTENSION_UNION.fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"; done
          tail -n +2 "$root/provenance/EVALUATED_METHODS.tsv" | while IFS=$'\t' read -r name fasta role; do
            dir="$root/evaluation/$name"; mkdir -p "$dir"
            minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/combined_truth.fasta" "$fasta" \
              > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py \
              --paf "$dir/assembly_to_truth.paf" --truth-mapping "$root/truth/truth_mapping.tsv" \
              --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" \
              > "$dir/evaluate.log" 2>&1
            rm -f "$dir/assembly_to_truth.paf"
          done

      - name: Build abundance and pseudo-novel development audits
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_short_backbone_dev
          a0=$(find v4_metadata -type f -name sample0_abundance.tsv -print -quit)
          a1=$(find v4_metadata -type f -name sample1_abundance.tsv -print -quit)
          test -s "$a0"; test -s "$a1"
          recovery_args=()
          while IFS=$'\t' read -r name fasta role; do
            test "$name" = method && continue
            recovery_args+=(--recovery "$name=$root/evaluation/$name/per_genome_recovery.tsv")
          done < "$root/provenance/EVALUATED_METHODS.tsv"
          python lantern_cami3/scripts/summarize_abundance_recovery.py \
            --abundance "$a0" --abundance "$a1" "${recovery_args[@]}" \
            --low-percent 0.01 --high-percent 0.1 --out "$root/abundance/results" \
            > "$root/logs/ABUNDANCE.log" 2>&1
          python - "$root" <<'PY'
          import csv,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=list(csv.DictReader(open(root/'truth/genome_reference_manifest.tsv'),delimiter='\t'))
          paths=[]
          for row in rows:
              if int(row['truth_bp'])<50000: continue
              p=root/'truth/references'/Path(row['reference_path']).name
              if p.is_file(): paths.append(str(p))
          (root/'pseudo/mash_reference_files.txt').write_text('\n'.join(paths)+'\n')
          PY
          mash sketch -k 21 -s 1000 -l "$root/pseudo/mash_reference_files.txt" -o "$root/pseudo/truth_genomes" > "$root/logs/MASH_SKETCH.log" 2>&1
          mash dist "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genomes.msh" > "$root/pseudo/truth_genome_distances.tsv"
          python lantern_cami3/scripts/build_pseudo_novel_audit.py \
            --manifest "$root/truth/genome_reference_manifest.tsv" --mash "$root/pseudo/truth_genome_distances.tsv" \
            "${recovery_args[@]}" --min-truth-bp 50000 --out "$root/pseudo/results" \
            > "$root/logs/PSEUDO_NOVEL.log" 2>&1
          rm -rf v4_metadata

      - name: Select one safe development winner without claiming longitudinal success
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('v7_short_backbone_dev')
          methods=list(csv.DictReader(open(root/'provenance/EVALUATED_METHODS.tsv'),delimiter='\t'))
          summaries={r['method']:json.loads((root/'evaluation'/r['method']/'GOLD_COVERAGE_SUMMARY.json').read_text()) for r in methods}
          baselines=[r['method'] for r in methods if r['role']=='baseline']
          strongest=max(baselines,key=lambda m:(summaries[m]['genome_fraction_percent'],summaries[m]['mean_genome_recovery'],-(summaries[m]['cross_binid_chimeric_bp_fraction'] or 0),m))
          abundance={(r['method'],r['stratum']):100*float(r['mean_recovery']) for r in csv.DictReader(open(root/'abundance/results/ABUNDANCE_STRATIFIED_SUMMARY.tsv'),delimiter='\t') if r.get('mean_recovery') not in ('',None,'None')}
          pseudo={(r['method'],r['tier']):100*float(r['mean_recovery']) for r in csv.DictReader(open(root/'pseudo/results/PSEUDO_NOVEL_RECOVERY_SUMMARY.tsv'),delimiter='\t') if r.get('mean_recovery') not in ('',None,'None')}
          tiers=['exact_target_withheld','species_neighbour_withheld','genus_neighbour_withheld','deep_neighbour_withheld']
          b=summaries[strongest]; rows=[]
          for r in methods:
              m=r['method']
              if r['role']!='variant': continue
              s=summaries[m]; gf=s['genome_fraction_percent']-b['genome_fraction_percent']; mean=100*(s['mean_genome_recovery']-b['mean_genome_recovery'])
              bc=b['cross_binid_chimeric_bp_fraction'] or 0; sc=s['cross_binid_chimeric_bp_fraction'] or 0; chim=(sc-bc)/bc if bc else (0 if sc==0 else None)
              low=abundance.get((m,'low'),-1e9)-abundance.get((strongest,'low'),0)
              pg={t:pseudo.get((m,t),-1e9)-pseudo.get((strongest,t),0) for t in tiers}
              safe=gf>0 and mean>0 and chim is not None and chim<=0.10
              rows.append({'variant':m,'safe':safe,'gf_gain_pp':gf,'mean_gain_pp':mean,'low_gain_pp':low,'relative_chimera_change':chim,'pseudo_all_positive':all(v>0 for v in pg.values()),**{f'pseudo_{t}':v for t,v in pg.items()}})
          safe=[r for r in rows if r['safe']]
          pool=safe or rows
          winner=max(pool,key=lambda r:(r['pseudo_all_positive'],r['gf_gain_pp'],r['mean_gain_pp'],r['low_gain_pp'],-(r['relative_chimera_change'] or 999),r['variant']))
          summary=json.loads((root/'variants'/winner['variant']/'EXTENSION_SUMMARY.json').read_text())
          freeze={'status':'V7_SHORT_BACKBONE_RULE_FROZEN_FOR_NEW_UNTOUCHED_PAIR','winner':winner['variant'],'strongest_development_baseline':strongest,'winner_metrics':winner,'construction':summary,'development_samples':[0,1],'strict_success_claimed':False,'selection_rule':'Among predeclared variants, prefer positive GF and mean with <=10% relative chimera increase; then pseudo all-positive, GF, mean, low-abundance, lower chimera.','boundary':'Development-only selection after all variants were truth-blind frozen. Must be applied unchanged to a new read-inferred pair.'}
          (root/'decision/FROZEN_V7_SHORT_BACKBONE_WINNER.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
          fields=list(rows[0]);
          with open(root/'decision/V7_SHORT_BACKBONE_COMPARISON.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(sorted(rows,key=lambda r:(not r['safe'],-r['gf_gain_pp'],r['variant'])))
          (root/'decision/V7_SHORT_BACKBONE_DECISION.md').write_text(f"# V7 short-backbone development\n\n- Winner: `{winner['variant']}`\n- Strongest baseline: `{strongest}`\n- GF gain: **{winner['gf_gain_pp']:.6f} pp**\n- Mean gain: **{winner['mean_gain_pp']:.6f} pp**\n- Low-abundance gain: **{winner['low_gain_pp']:.6f} pp**\n- Relative chimera change: **{winner['relative_chimera_change']}**\n\n{freeze['boundary']}\n")
          print(json.dumps(freeze,indent=2,sort_keys=True))
          PY

      - name: Compact and hash the development evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          root=v7_short_backbone_dev
          rm -rf "$root/inputs" "$root/candidates" "$root/alignments" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genome_distances.tsv"
          rm -f "$root/evaluation"/*/per_truth_contig.tsv
          rm -f "$root/variants"/*/EXTENSION_DECISIONS.tsv
          find "$root" -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS_ALL.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V7_SHORT_BACKBONE_DEVELOPMENT_20260820
          path: v7_short_backbone_dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
