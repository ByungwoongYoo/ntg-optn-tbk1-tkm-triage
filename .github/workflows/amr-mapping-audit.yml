name: AMR phenotype-genotype mapping audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'amr_discovery/audit_genotype_mapping.py'
      - '.github/workflows/amr-mapping-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install duckdb==1.3.2 pandas==2.3.1 pyarrow==21.0.0
      - run: python amr_discovery/audit_genotype_mapping.py
      - run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            uname -a
            python --version
            pip freeze
          } > amr_mapping_audit/PROVENANCE.txt
          sha256sum amr_mapping_audit/* | sort > amr_mapping_audit/ALL_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AMR_GENOTYPE_MAPPING_AUDIT_2026_07
          path: amr_mapping_audit
          retention-days: 90
          compression-level: 9
