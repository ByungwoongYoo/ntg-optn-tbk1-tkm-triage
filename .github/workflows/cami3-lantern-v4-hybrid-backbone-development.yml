name: CAMI III LANTERN v4 hybrid-backbone development

on:
  pull_request:
    branches: [cami3-lantern-v3-frozen-20260820]
    paths:
      - '.github/workflows/cami3-lantern-v4-hybrid-backbone-development.yml'
      - 'lantern_cami3/config/lantern_hybrid_backbone_v4_grid_predeclared_20260820.json'
      - 'lantern_cami3/scripts/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MULTIMODAL_RUN_ID: '32312941523'
  FLYE_RAW_RUN_ID: '32313469907'
  READ_RUN_ID: '32285680342'
  SAMPLE0_URL: 'https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_0_reads.tar.gz'
  SAMPLE1_URL: 'https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_1_reads.tar.gz'

jobs:
  v4-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Initialize isolated workspace
        run: |
          set -euo pipefail
          mkdir -p v4_hybrid/{inputs/assemblies,inputs/freezes,inputs/reads,truth_blind,truth_download,truth,evaluation,abundance,pseudo_novel,decision,logs,provenance,failure_audit,submission}
          git rev-parse HEAD > v4_hybrid/provenance/GIT_HEAD.txt
          uname -a > v4_hybrid/provenance/UNAME.txt
          cp lantern_cami3/config/lantern_hybrid_backbone_v4_grid_predeclared_20260820.json v4_hybrid/provenance/
          cp lantern_cami3/config/lantern_frozen_v1.json v4_hybrid/provenance/
          cp lantern_cami3/config/decision_gate_v1.json v4_hybrid/provenance/
          sha256sum v4_hybrid/provenance/*.json > v4_hybrid/provenance/CONFIG_SHA256.txt

      - name: Download frozen metaSPAdes hybrid backbone artifact
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_MULTIMODAL_metaspades_hybrid_pair_20260820
          path: artifact_hybrid
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MULTIMODAL_RUN_ID }}

      - name: Extract and verify hybrid backbone then discard artifact payload
        run: |
          set -euo pipefail
          fasta=$(find artifact_hybrid -type f -path '*/assembly/out/contigs.fasta' | head -1)
          freeze=$(find artifact_hybrid -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/hybrid_backbone.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/hybrid_backbone_freeze.json
          python - "$fasta" "$freeze" <<'PY'
          import hashlib,json,sys
          fa,fr=sys.argv[1:]
          observed=hashlib.sha256(open(fa,'rb').read()).hexdigest()
          frozen=json.load(open(fr))
          if frozen.get('sha256') and frozen['sha256']!=observed: raise SystemExit('hybrid backbone freeze hash mismatch')
          print(observed)
          PY
          rm -rf artifact_hybrid

      - name: Download frozen metaSPAdes short candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_MULTIMODAL_metaspades_short_pair_20260820
          path: artifact_meta_short
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MULTIMODAL_RUN_ID }}

      - name: Extract metaSPAdes short candidates then discard artifact payload
        run: |
          set -euo pipefail
          fasta=$(find artifact_meta_short -type f -path '*/assembly/out/contigs.fasta' | head -1)
          freeze=$(find artifact_meta_short -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/metaspades_short_pair.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/metaspades_short_pair_freeze.json
          rm -rf artifact_meta_short

      - name: Download frozen MEGAHIT short candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_MULTIMODAL_megahit_short_pair_20260820
          path: artifact_megahit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MULTIMODAL_RUN_ID }}

      - name: Extract MEGAHIT candidates then discard artifact payload
        run: |
          set -euo pipefail
          fasta=$(find artifact_megahit -type f -path '*/assembly/out/final.contigs.fa' | head -1)
          freeze=$(find artifact_megahit -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/megahit_short_pair.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/megahit_short_pair_freeze.json
          rm -rf artifact_megahit

      - name: Download frozen Flye nano-raw pair candidates
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_flye_raw_pair_20260820
          path: artifact_flye_pair
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLYE_RAW_RUN_ID }}

      - name: Extract Flye pair candidates
        run: |
          set -euo pipefail
          fasta=$(find artifact_flye_pair -type f -path '*/assembly/out/assembly.fasta' | head -1)
          freeze=$(find artifact_flye_pair -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/flye_raw_pair.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/flye_raw_pair_freeze.json
          rm -rf artifact_flye_pair

      - name: Download frozen Flye nano-raw sample-0 candidates
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_flye_raw_s0_20260820
          path: artifact_flye_s0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLYE_RAW_RUN_ID }}

      - name: Extract Flye sample-0 candidates
        run: |
          set -euo pipefail
          fasta=$(find artifact_flye_s0 -type f -path '*/assembly/out/assembly.fasta' | head -1)
          freeze=$(find artifact_flye_s0 -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/flye_raw_s0.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/flye_raw_s0_freeze.json
          rm -rf artifact_flye_s0

      - name: Download frozen Flye nano-raw sample-1 candidates
        uses: actions/download-artifact@v4
        with:
          name: LANTERN_CAMI3_flye_raw_s1_20260820
          path: artifact_flye_s1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLYE_RAW_RUN_ID }}

      - name: Extract Flye sample-1 candidates
        run: |
          set -euo pipefail
          fasta=$(find artifact_flye_s1 -type f -path '*/assembly/out/assembly.fasta' | head -1)
          freeze=$(find artifact_flye_s1 -type f -path '*/truth_blind/TRUTH_BLIND_FREEZE.json' | head -1)
          test -s "$fasta"; test -s "$freeze"
          cp "$fasta" v4_hybrid/inputs/assemblies/flye_raw_s1.fasta
          cp "$freeze" v4_hybrid/inputs/freezes/flye_raw_s1_freeze.json
          rm -rf artifact_flye_s1

      - name: Download frozen S0 and S1 short/long reads
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_TOY_READS_S*_V1
          path: artifact_reads
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.READ_RUN_ID }}

      - name: Copy exact reads and discard artifact wrappers
        run: |
          set -euo pipefail
          for sample in S0 S1; do
            for kind in R1 R2 long; do
              src=$(find artifact_reads -type f -name "${sample}_${kind}.fastq.gz" | head -1)
              test -s "$src"
              cp "$src" "v4_hybrid/inputs/reads/${sample}_${kind}.fastq.gz"
            done
          done
          gzip -t v4_hybrid/inputs/reads/*.fastq.gz
          sha256sum v4_hybrid/inputs/reads/*.fastq.gz > v4_hybrid/provenance/READ_SHA256.txt
          sha256sum v4_hybrid/inputs/assemblies/* > v4_hybrid/provenance/ASSEMBLY_SHA256.txt
          rm -rf artifact_reads
          df -h > v4_hybrid/provenance/DISK_AFTER_INPUT_EXTRACTION.txt

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v4
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            samtools
            mash
            seqkit
            tabulate
          cache-downloads: true
          post-cleanup: all

      - name: Record exact execution environment
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python --version > v4_hybrid/provenance/PYTHON_VERSION.txt
          minimap2 --version > v4_hybrid/provenance/MINIMAP2_VERSION.txt
          samtools --version > v4_hybrid/provenance/SAMTOOLS_VERSION.txt
          mash --version > v4_hybrid/provenance/MASH_VERSION.txt
          seqkit version > v4_hybrid/provenance/SEQKIT_VERSION.txt 2>&1 || true
          micromamba list > v4_hybrid/provenance/MICROMAMBA_LIST.txt
          seqkit stats -T v4_hybrid/inputs/assemblies/* v4_hybrid/inputs/reads/* > v4_hybrid/provenance/INPUT_STATS.tsv

      - name: Build truth-blind multimodal candidate evidence
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          SCRIPTS=lantern_cami3/scripts
          export PYTHONPATH="$PWD/$SCRIPTS"
          mkdir -p "$ROOT/truth_blind"/{prepared,clusters,evidence,selection,configs,outputs}
          cat > "$ROOT/truth_blind/source_manifest.tsv" <<'EOF'
          source_id	assembler	scope	mode
          metaspades_short	metaspades	longitudinal	short
          megahit_short	megahit	longitudinal	short
          flye_pair	metaflye	longitudinal	long
          flye_s0	metaflye	single	long
          flye_s1	metaflye	single	long
          EOF
          python "$SCRIPTS/prepare_candidates.py" \
            --assembly "metaspades_short=$ROOT/inputs/assemblies/metaspades_short_pair.fasta" \
            --assembly "megahit_short=$ROOT/inputs/assemblies/megahit_short_pair.fasta" \
            --assembly "flye_pair=$ROOT/inputs/assemblies/flye_raw_pair.fasta" \
            --assembly "flye_s0=$ROOT/inputs/assemblies/flye_raw_s0.fasta" \
            --assembly "flye_s1=$ROOT/inputs/assemblies/flye_raw_s1.fasta" \
            --source-manifest "$ROOT/truth_blind/source_manifest.tsv" \
            --min-length 1000 --out "$ROOT/truth_blind/prepared" \
            > "$ROOT/logs/PREPARE_CANDIDATES.log" 2>&1
          /usr/bin/time -v minimap2 -I 256M -x asm5 -c -N 100 -t 4 \
            "$ROOT/truth_blind/prepared/combined_candidates.fasta" \
            "$ROOT/truth_blind/prepared/combined_candidates.fasta" \
            > "$ROOT/truth_blind/all_vs_all.paf" 2> "$ROOT/logs/ALL_VS_ALL_MINIMAP2.log"
          python "$SCRIPTS/cluster_candidates.py" \
            --fasta "$ROOT/truth_blind/prepared/combined_candidates.fasta" \
            --metadata "$ROOT/truth_blind/prepared/candidates.tsv" \
            --paf "$ROOT/truth_blind/all_vs_all.paf" \
            --min-identity 0.97 --min-shorter-coverage 0.85 \
            --out "$ROOT/truth_blind/clusters" > "$ROOT/logs/CLUSTER.log" 2>&1

          for sample in S0 S1; do
            R1="$ROOT/inputs/reads/${sample}_R1.fastq.gz"
            R2="$ROOT/inputs/reads/${sample}_R2.fastq.gz"
            LR="$ROOT/inputs/reads/${sample}_long.fastq.gz"
            minimap2 -t 4 -ax sr "$ROOT/truth_blind/clusters/cluster_representatives.fasta" "$R1" "$R2" \
              2> "$ROOT/logs/MAP_${sample}_SHORT.log" | samtools sort -@ 2 -o "$ROOT/truth_blind/evidence/${sample}_short.bam" -
            samtools index "$ROOT/truth_blind/evidence/${sample}_short.bam"
            samtools coverage "$ROOT/truth_blind/evidence/${sample}_short.bam" > "$ROOT/truth_blind/evidence/${sample}_short_coverage.tsv"
            minimap2 -t 4 -ax map-ont "$ROOT/truth_blind/clusters/cluster_representatives.fasta" "$LR" \
              2> "$ROOT/logs/MAP_${sample}_LONG_SAM.log" | samtools sort -@ 2 -o "$ROOT/truth_blind/evidence/${sample}_long.bam" -
            samtools index "$ROOT/truth_blind/evidence/${sample}_long.bam"
            samtools coverage "$ROOT/truth_blind/evidence/${sample}_long.bam" > "$ROOT/truth_blind/evidence/${sample}_long_coverage.tsv"
            minimap2 -t 4 -x map-ont -c "$ROOT/truth_blind/clusters/cluster_representatives.fasta" "$LR" \
              > "$ROOT/truth_blind/evidence/${sample}_long.paf" 2> "$ROOT/logs/MAP_${sample}_LONG_PAF.log"
          done
          python "$SCRIPTS/merge_mapping_evidence.py" \
            --short-coverage "S0=$ROOT/truth_blind/evidence/S0_short_coverage.tsv" \
            --short-coverage "S1=$ROOT/truth_blind/evidence/S1_short_coverage.tsv" \
            --long-coverage "S0=$ROOT/truth_blind/evidence/S0_long_coverage.tsv" \
            --long-coverage "S1=$ROOT/truth_blind/evidence/S1_long_coverage.tsv" \
            --long-paf "S0=$ROOT/truth_blind/evidence/S0_long.paf" \
            --long-paf "S1=$ROOT/truth_blind/evidence/S1_long.paf" \
            --out "$ROOT/truth_blind/evidence/merged" > "$ROOT/logs/MERGE_EVIDENCE.log" 2>&1
          for ablation in full no_longitudinal no_long no_consensus; do
            python "$SCRIPTS/lantern_select.py" \
              --fasta "$ROOT/truth_blind/clusters/cluster_representatives.fasta" \
              --metadata "$ROOT/truth_blind/clusters/representative_metadata.tsv" \
              --evidence "$ROOT/truth_blind/evidence/merged/mapping_evidence.tsv" \
              --config lantern_cami3/config/lantern_frozen_v1.json \
              --ablation "$ablation" --out "$ROOT/truth_blind/selection/$ablation" \
              > "$ROOT/logs/SELECT_${ablation}.log" 2>&1
          done
          minimap2 -I 256M -x asm5 -c -N 100 -t 4 \
            "$ROOT/inputs/assemblies/hybrid_backbone.fasta" \
            "$ROOT/truth_blind/clusters/cluster_representatives.fasta" \
            > "$ROOT/truth_blind/candidate_to_backbone.paf" 2> "$ROOT/logs/CANDIDATE_TO_BACKBONE.log"

      - name: Materialize every predeclared v4 configuration and ablation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          SCRIPTS=lantern_cami3/scripts
          export PYTHONPATH="$PWD/$SCRIPTS"
          python - <<'PY'
          import json
          from pathlib import Path
          grid=json.loads(Path('lantern_cami3/config/lantern_hybrid_backbone_v4_grid_predeclared_20260820.json').read_text())
          out=Path('v4_hybrid/truth_blind/configs'); out.mkdir(parents=True,exist_ok=True)
          for item in grid['configurations']:
              config=dict(grid['common']); config.update(item)
              config['version']=f"{grid['version']}::{item['config_id']}"
              config['method']=f"LANTERN-hybrid-backbone-rescue-v4::{item['config_id']}"
              config['predeclared_grid_version']=grid['version']
              (out/f"{item['config_id']}.json").write_text(json.dumps(config,indent=2,sort_keys=True)+'\n')
          PY
          for cfg in "$ROOT"/truth_blind/configs/*.json; do
            id=$(basename "$cfg" .json)
            for ablation in full no_longitudinal no_long no_consensus; do
              out="$ROOT/truth_blind/outputs/${id}_${ablation}"
              python "$SCRIPTS/lantern_backbone_rescue.py" \
                --backbone "$ROOT/inputs/assemblies/hybrid_backbone.fasta" \
                --candidate-fasta "$ROOT/truth_blind/clusters/cluster_representatives.fasta" \
                --selection "$ROOT/truth_blind/selection/$ablation/LANTERN_SELECTION.tsv" \
                --metadata "$ROOT/truth_blind/clusters/representative_metadata.tsv" \
                --candidate-to-backbone-paf "$ROOT/truth_blind/candidate_to_backbone.paf" \
                --config "$cfg" --out "$out" > "$ROOT/logs/RESCUE_${id}_${ablation}.log" 2>&1
              python "$SCRIPTS/verify_cami_assembly.py" "$out/LANTERN_BACKBONE_RESCUE.fasta" \
                --out "$out/VALIDATION.json"
            done
          done

      - name: Freeze every assembly and selection before gold access
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          root=Path('v4_hybrid')
          files=[]
          bases=[root/'inputs/assemblies/hybrid_backbone.fasta',root/'truth_blind/configs',root/'truth_blind/selection',root/'truth_blind/outputs',Path('lantern_cami3/config/decision_gate_v1.json'),Path('lantern_cami3/config/lantern_hybrid_backbone_v4_grid_predeclared_20260820.json')]
          for base in bases:
              paths=[base] if base.is_file() else sorted(base.rglob('*'))
              for p in paths:
                  if p.is_file(): files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          obj={'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'truth_accessed':False,'n_files':len(files),'files':files,'boundary':'Hybrid backbone, candidate evidence, the four predeclared configurations, and all ablations were frozen before public Toy gold access.'}
          (root/'truth_blind/TRUTH_BLIND_FREEZE_V4.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
          sha256sum "$ROOT/truth_blind/TRUTH_BLIND_FREEZE_V4.json" > "$ROOT/provenance/TRUTH_BLIND_FREEZE_V4_SHA256.txt"
          rm -f "$ROOT/truth_blind/all_vs_all.paf" "$ROOT/truth_blind/candidate_to_backbone.paf"
          find "$ROOT/truth_blind/evidence" -type f \( -name '*.bam' -o -name '*.bai' -o -name '*.paf' \) -delete
          df -h > "$ROOT/provenance/DISK_BEFORE_TRUTH.txt"

      - name: Download public Toy gold standards only after freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          for sample in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${sample}_gsa.tar.gz" \
              -o "$ROOT/truth_download/sample_${sample}_gsa.tar.gz"
          done
          sha256sum "$ROOT/truth_download"/*.tar.gz > "$ROOT/provenance/GSA_SHA256.txt"
          PYTHONPATH="$PWD/lantern_cami3/scripts" python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "S0=$ROOT/truth_download/sample_0_gsa.tar.gz" \
            --gsa-tar "S1=$ROOT/truth_download/sample_1_gsa.tar.gz" \
            --out "$ROOT/truth" > "$ROOT/logs/EXTRACT_TRUTH.log" 2>&1
          test -s "$ROOT/truth/combined_truth.fasta"
          test -s "$ROOT/truth/truth_mapping.tsv"
          test -s "$ROOT/truth/genome_reference_manifest.tsv"

      - name: Evaluate hybrid backbone and all full/longitudinal-ablation candidates
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          SCRIPTS=lantern_cami3/scripts
          export PYTHONPATH="$PWD/$SCRIPTS"
          : > "$ROOT/failure_audit/EVALUATION_STATUS.tsv"
          evaluate() {
            local name="$1" fasta="$2" dir="$ROOT/evaluation/$1"
            mkdir -p "$dir"
            if [[ ! -s "$fasta" ]]; then printf '%s\tMISSING_FASTA\n' "$name" >> "$ROOT/failure_audit/EVALUATION_STATUS.tsv"; return; fi
            sha256sum "$fasta" > "$dir/ASSEMBLY_SHA256.txt"
            set +e
            /usr/bin/time -v minimap2 -I 128M -x asm5 -c -N 100 -t 4 \
              "$ROOT/truth/combined_truth.fasta" "$fasta" \
              > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            rc=$?
            set -e
            if [[ "$rc" -ne 0 || ! -s "$dir/assembly_to_truth.paf" ]]; then printf '%s\tMINIMAP2_FAILED\t%s\n' "$name" "$rc" >> "$ROOT/failure_audit/EVALUATION_STATUS.tsv"; return; fi
            set +e
            python "$SCRIPTS/evaluate_gold_coverage.py" \
              --paf "$dir/assembly_to_truth.paf" --truth-mapping "$ROOT/truth/truth_mapping.tsv" \
              --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" \
              > "$dir/evaluate_console.log" 2> "$dir/evaluate_error.log"
            rc=$?
            set -e
            rm -f "$dir/assembly_to_truth.paf"
            if [[ "$rc" -ne 0 || ! -s "$dir/GOLD_COVERAGE_SUMMARY.json" ]]; then printf '%s\tEVALUATOR_FAILED\t%s\n' "$name" "$rc" >> "$ROOT/failure_audit/EVALUATION_STATUS.tsv"; return; fi
            printf '%s\tPASS\n' "$name" >> "$ROOT/failure_audit/EVALUATION_STATUS.tsv"
          }
          evaluate hybrid_backbone "$ROOT/inputs/assemblies/hybrid_backbone.fasta"
          for cfg in "$ROOT"/truth_blind/configs/*.json; do
            id=$(basename "$cfg" .json)
            evaluate "${id}_full" "$ROOT/truth_blind/outputs/${id}_full/LANTERN_BACKBONE_RESCUE.fasta"
            evaluate "${id}_no_longitudinal" "$ROOT/truth_blind/outputs/${id}_no_longitudinal/LANTERN_BACKBONE_RESCUE.fasta"
          done
          n=$(awk -F '\t' '$2=="PASS"{x++}END{print x+0}' "$ROOT/failure_audit/EVALUATION_STATUS.tsv")
          test "$n" -eq 9

      - name: Select best predeclared development configuration and evaluate remaining ablations
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('v4_hybrid')
          baseline=json.loads((root/'evaluation/hybrid_backbone/GOLD_COVERAGE_SUMMARY.json').read_text())
          grid=json.loads(Path('lantern_cami3/config/lantern_hybrid_backbone_v4_grid_predeclared_20260820.json').read_text())
          candidates=[]
          for item in grid['configurations']:
              cid=item['config_id']
              full=json.loads((root/f'evaluation/{cid}_full/GOLD_COVERAGE_SUMMARY.json').read_text())
              ab=json.loads((root/f'evaluation/{cid}_no_longitudinal/GOLD_COVERAGE_SUMMARY.json').read_text())
              rel=(full['cross_binid_chimeric_bp_fraction']/baseline['cross_binid_chimeric_bp_fraction']-1) if baseline['cross_binid_chimeric_bp_fraction'] else (0 if full['cross_binid_chimeric_bp_fraction']==0 else 999)
              gf=full['genome_fraction_percent']-baseline['genome_fraction_percent']
              mean=100*(full['mean_genome_recovery']-baseline['mean_genome_recovery'])
              abl=full['genome_fraction_percent']-ab['genome_fraction_percent']
              assembly_ratio=full['assembly_total_bp']/baseline['assembly_total_bp']
              feasible=((rel<=0.10 or gf>=2.0) and full['genomes_recovered_90']>=baseline['genomes_recovered_90'] and assembly_ratio<=1.50)
              summary=json.loads((root/f'truth_blind/outputs/{cid}_full/LANTERN_BACKBONE_RESCUE_SUMMARY.json').read_text())
              candidates.append({'config_id':cid,'feasible':feasible,'genome_fraction_gain_percentage_points':gf,'mean_recovery_gain_percentage_points':mean,'longitudinal_ablation_drop_percentage_points':abl,'relative_chimera_change':rel,'assembly_ratio':assembly_ratio,'rescue_contigs':summary['rescue_contigs'],'full_summary':full,'ablation_summary':ab})
          feasible=[x for x in candidates if x['feasible']]
          pool=feasible or candidates
          selected=sorted(pool,key=lambda x:(-x['genome_fraction_gain_percentage_points'],-x['mean_recovery_gain_percentage_points'],-x['longitudinal_ablation_drop_percentage_points'],x['relative_chimera_change'],x['rescue_contigs'],x['config_id']))[0]
          out={'selection_rule':grid['training_selection_rule'],'baseline_summary':baseline,'candidates':candidates,'selected_config_id':selected['config_id'],'selected':selected,'claim_boundary':'Configuration selected on public Toy samples 0 and 1 only; official corrected holdout validation remains required.'}
          (root/'decision/SELECTED_V4_CONFIG_TRAINING.json').write_text(json.dumps(out,indent=2)+'\n')
          Path('/tmp/selected_config').write_text(selected['config_id'])
          print(json.dumps(out,indent=2))
          PY
          id=$(cat /tmp/selected_config)
          SCRIPTS=lantern_cami3/scripts
          export PYTHONPATH="$PWD/$SCRIPTS"
          evaluate_extra() {
            local name="$1" fasta="$2" dir="$ROOT/evaluation/$1"
            mkdir -p "$dir"
            minimap2 -I 128M -x asm5 -c -N 100 -t 4 "$ROOT/truth/combined_truth.fasta" "$fasta" > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            python "$SCRIPTS/evaluate_gold_coverage.py" --paf "$dir/assembly_to_truth.paf" --truth-mapping "$ROOT/truth/truth_mapping.tsv" --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" > "$dir/evaluate_console.log"
            rm -f "$dir/assembly_to_truth.paf"
          }
          evaluate_extra "${id}_no_long" "$ROOT/truth_blind/outputs/${id}_no_long/LANTERN_BACKBONE_RESCUE.fasta"
          evaluate_extra "${id}_no_consensus" "$ROOT/truth_blind/outputs/${id}_no_consensus/LANTERN_BACKBONE_RESCUE.fasta"
          cp "$ROOT/truth_blind/configs/${id}.json" "$ROOT/decision/SELECTED_V4_CONFIG.json"
          sha256sum "$ROOT/decision/SELECTED_V4_CONFIG.json" > "$ROOT/decision/SELECTED_V4_CONFIG_SHA256.txt"

      - name: Run exact abundance and pseudo-novel audits for selected v4
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=v4_hybrid
          id=$(cat /tmp/selected_config)
          SCRIPTS=lantern_cami3/scripts
          export PYTHONPATH="$PWD/$SCRIPTS"
          python "$SCRIPTS/extract_read_abundance.py" --url "$SAMPLE0_URL" --sample-id sample0 --paired --out "$ROOT/abundance/sample0_abundance.tsv" > "$ROOT/logs/ABUNDANCE_S0.log" 2>&1
          python "$SCRIPTS/extract_read_abundance.py" --url "$SAMPLE1_URL" --sample-id sample1 --paired --out "$ROOT/abundance/sample1_abundance.tsv" > "$ROOT/logs/ABUNDANCE_S1.log" 2>&1
          python "$SCRIPTS/summarize_abundance_recovery.py" \
            --abundance "$ROOT/abundance/sample0_abundance.tsv" --abundance "$ROOT/abundance/sample1_abundance.tsv" \
            --recovery "hybrid_backbone=$ROOT/evaluation/hybrid_backbone/per_genome_recovery.tsv" \
            --recovery "v4_full=$ROOT/evaluation/${id}_full/per_genome_recovery.tsv" \
            --recovery "v4_no_longitudinal=$ROOT/evaluation/${id}_no_longitudinal/per_genome_recovery.tsv" \
            --recovery "v4_no_long=$ROOT/evaluation/${id}_no_long/per_genome_recovery.tsv" \
            --recovery "v4_no_consensus=$ROOT/evaluation/${id}_no_consensus/per_genome_recovery.tsv" \
            --low-percent 0.01 --high-percent 0.1 --out "$ROOT/abundance/results" > "$ROOT/logs/ABUNDANCE_JOIN.log" 2>&1

          awk -F '\t' 'NR>1 && $3>=50000 {print $2}' "$ROOT/truth/genome_reference_manifest.tsv" > "$ROOT/pseudo_novel/mash_reference_files.txt"
          test $(wc -l < "$ROOT/pseudo_novel/mash_reference_files.txt") -ge 2
          mash sketch -k 21 -s 1000 -l "$ROOT/pseudo_novel/mash_reference_files.txt" -o "$ROOT/pseudo_novel/truth_genomes" > "$ROOT/logs/MASH_SKETCH.log" 2>&1
          mash dist "$ROOT/pseudo_novel/truth_genomes.msh" "$ROOT/pseudo_novel/truth_genomes.msh" > "$ROOT/pseudo_novel/truth_genome_distances.tsv"
          python "$SCRIPTS/build_pseudo_novel_audit.py" \
            --manifest "$ROOT/truth/genome_reference_manifest.tsv" --mash "$ROOT/pseudo_novel/truth_genome_distances.tsv" \
            --recovery "hybrid_backbone=$ROOT/evaluation/hybrid_backbone/per_genome_recovery.tsv" \
            --recovery "v4_full=$ROOT/evaluation/${id}_full/per_genome_recovery.tsv" \
            --recovery "v4_no_longitudinal=$ROOT/evaluation/${id}_no_longitudinal/per_genome_recovery.tsv" \
            --min-truth-bp 50000 --out "$ROOT/pseudo_novel/results" > "$ROOT/logs/PSEUDO_NOVEL.log" 2>&1
          rm -f "$ROOT/pseudo_novel/truth_genomes.msh"

      - name: Apply strict frozen success gates and paired bootstrap
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,random,statistics
          from pathlib import Path
          root=Path('v4_hybrid'); selected=json.loads((root/'decision/SELECTED_V4_CONFIG_TRAINING.json').read_text()); cid=selected['selected_config_id']
          cfg=json.loads(Path('lantern_cami3/config/decision_gate_v1.json').read_text())
          baseline=json.loads((root/'evaluation/hybrid_backbone/GOLD_COVERAGE_SUMMARY.json').read_text())
          full=json.loads((root/f'evaluation/{cid}_full/GOLD_COVERAGE_SUMMARY.json').read_text())
          no_longitudinal=json.loads((root/f'evaluation/{cid}_no_longitudinal/GOLD_COVERAGE_SUMMARY.json').read_text())
          def recovery(path): return {r['genome_id']:float(r['recovery_fraction']) for r in csv.DictReader(open(path),delimiter='\t')}
          rb=recovery(root/'evaluation/hybrid_backbone/per_genome_recovery.tsv'); rf=recovery(root/f'evaluation/{cid}_full/per_genome_recovery.tsv')
          common=sorted(set(rb)&set(rf)); diffs=[100*(rf[g]-rb[g]) for g in common]
          rng=random.Random(20260820); means=[]
          for _ in range(5000): means.append(statistics.mean(diffs[rng.randrange(len(diffs))] for _ in diffs))
          means.sort(); ci=[means[int(.025*len(means))],means[min(len(means)-1,int(.975*len(means)))]]
          abundance=list(csv.DictReader(open(root/'abundance/results/ABUNDANCE_STRATIFIED_SUMMARY.tsv'),delimiter='\t'))
          ab={(r['method'],r['stratum']):r for r in abundance}
          low_gain=100*(float(ab[('v4_full','low')]['mean_recovery'])-float(ab[('hybrid_backbone','low')]['mean_recovery']))
          pseudo=list(csv.DictReader(open(root/'pseudo_novel/results/PSEUDO_NOVEL_RECOVERY_SUMMARY.tsv'),delimiter='\t'))
          tiers=[]
          for r in pseudo:
              if r['method']!='v4_full': continue
              base=next(x for x in pseudo if x['method']=='hybrid_backbone' and x['tier']==r['tier'])
              tiers.append({'tier':r['tier'],'n_targets':int(float(r['n_targets'])),'gain_percentage_points':100*(float(r['mean_recovery'])-float(base['mean_recovery']))})
          gf=full['genome_fraction_percent']-baseline['genome_fraction_percent']; mean=100*(full['mean_genome_recovery']-baseline['mean_genome_recovery']); abl=full['genome_fraction_percent']-no_longitudinal['genome_fraction_percent']; rel=(full['cross_binid_chimeric_bp_fraction']/baseline['cross_binid_chimeric_bp_fraction']-1) if baseline['cross_binid_chimeric_bp_fraction'] else (0 if full['cross_binid_chimeric_bp_fraction']==0 else 999)
          gates={
            'genome_fraction_gain':gf>=cfg['minimum_genome_fraction_gain_percentage_points'],
            'mean_genome_recovery_gain':mean>=cfg['minimum_mean_genome_recovery_gain_percentage_points'],
            'low_abundance_gain':low_gain>=cfg['minimum_low_abundance_gain_percentage_points'],
            'chimera_tradeoff':rel<=cfg['maximum_relative_chimera_increase'] or gf>=cfg['acceptable_tradeoff_genome_fraction_gain_percentage_points'],
            'longitudinal_ablation_contribution':abl>=cfg['minimum_longitudinal_ablation_drop_percentage_points'],
            'pseudo_novel_consistent':bool(tiers) and all(x['gain_percentage_points']>0 for x in tiers),
            'recovered_90_not_lower':full['genomes_recovered_90']>=baseline['genomes_recovered_90'],
          }
          success=all(gates.values()); status='SUCCESS' if success else ('PARTIAL' if gates['longitudinal_ablation_contribution'] and (gf>0 or mean>0) else 'NEGATIVE')
          out={'status':status,'success':success,'selected_config_id':cid,'baseline':'hybrid_backbone','genome_fraction_gain_percentage_points':gf,'mean_recovery_gain_percentage_points':mean,'paired_bootstrap_95_ci_percentage_points':ci,'low_abundance_gain_percentage_points':low_gain,'longitudinal_ablation_drop_percentage_points':abl,'relative_chimera_change':rel,'pseudo_novel_tiers':tiers,'gates':gates,'decision_config':cfg,'claim_boundary':'Public CAMI Toy development pair only; official corrected held-out-pair validation is required before any generalization or active challenge claim.'}
          (root/'decision/FINAL_V4_DEVELOPMENT_DECISION.json').write_text(json.dumps(out,indent=2)+'\n')
          lines=['# LANTERN v4 public-Toy development decision','',f"- Status: **{status}**",f"- Selected config: `{cid}`",f"- Genome-fraction gain: **{gf:.6f} pp**",f"- Mean-recovery gain: **{mean:.6f} pp**",f"- Paired bootstrap 95% CI: **[{ci[0]:.6f}, {ci[1]:.6f}] pp**",f"- Low-abundance gain: **{low_gain:.6f} pp**",f"- Longitudinal ablation drop: **{abl:.6f} pp**",'', '## Frozen gates','']+[f"- {k}: **{'PASS' if v else 'FAIL'}**" for k,v in gates.items()]+['','## Claim boundary','',out['claim_boundary'],'']
          (root/'decision/FINAL_V4_DEVELOPMENT_DECISION.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(out,indent=2))
          PY
          test -s v4_hybrid/decision/FINAL_V4_DEVELOPMENT_DECISION.json

      - name: Build compact submission-ready development artifact
        if: always()
        shell: micromamba-shell {0}
        run: |
          ROOT=v4_hybrid
          if [[ -s "$ROOT/decision/SELECTED_V4_CONFIG_TRAINING.json" ]]; then id=$(python -c "import json;print(json.load(open('$ROOT/decision/SELECTED_V4_CONFIG_TRAINING.json'))['selected_config_id'])"); cp "$ROOT/truth_blind/outputs/${id}_full/LANTERN_BACKBONE_RESCUE.fasta" "$ROOT/submission/LANTERN_V4_TOY_DEVELOPMENT.fasta"; python lantern_cami3/scripts/verify_cami_assembly.py "$ROOT/submission/LANTERN_V4_TOY_DEVELOPMENT.fasta" --out "$ROOT/submission/VALIDATION.json"; fi
          rm -rf "$ROOT/inputs/reads" "$ROOT/truth_download" "$ROOT/truth/references"
          rm -f "$ROOT/truth/combined_truth.fasta" "$ROOT/pseudo_novel/truth_genome_distances.tsv"
          find "$ROOT" -type f \( -name '*.bam' -o -name '*.bai' -o -name '*.paf' \) -delete 2>/dev/null || true
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('v4_hybrid'); decision=root/'decision/FINAL_V4_DEVELOPMENT_DECISION.json'
          audit={'decision_present':decision.is_file(),'decision':json.loads(decision.read_text()) if decision.is_file() else None,'truth_blind_freeze_present':(root/'truth_blind/TRUTH_BLIND_FREEZE_V4.json').is_file(),'submission_validation_present':(root/'submission/VALIDATION.json').is_file(),'boundary':'Public Toy development only; not active CAMI III challenge performance.'}
          (root/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n')
          lines=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS_ALL.txt': lines.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}')
          (root/'SHA256SUMS_ALL.txt').write_text('\n'.join(lines)+'\n')
          PY
          find "$ROOT" -type f -printf '%P\t%s\n' | sort > "$ROOT/CONTENTS.tsv" || true
          du -ah "$ROOT" | sort -h > "$ROOT/FILE_SIZES.txt" || true
          df -h > "$ROOT/provenance/DISK_FINAL.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V4_HYBRID_BACKBONE_DEVELOPMENT_20260820
          path: v4_hybrid
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
