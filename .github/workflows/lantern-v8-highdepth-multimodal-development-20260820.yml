name: LANTERN v8 high-depth multimodal development

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lantern-v8-highdepth-multimodal-development-20260820.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RESEARCH_REF: 'lantern-v7-multi-angle-20260820'
  FRACTION: '0.25'
  SEED: '20260821'

jobs:
  downsample:
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stream 25-percent short and long development reads
        run: |
          set -euo pipefail
          s='${{ matrix.sample }}';root="highdepth_reads/S${s}"
          mkdir -p "$root"/{reads,provenance,logs}
          python lantern_cami3/scripts/stream_downsample_cami_tar.py --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz" --sample-id "S${s}" --mode short --fraction "$FRACTION" --seed "$SEED" --min-kept 10000 --out-dir "$root/reads" > "$root/logs/SHORT.log" 2>&1
          python lantern_cami3/scripts/stream_downsample_cami_tar.py --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz" --sample-id "S${s}" --mode long --fraction "$FRACTION" --seed "$SEED" --min-kept 1000 --out-dir "$root/reads" > "$root/logs/LONG.log" 2>&1
          gzip -t "$root/reads"/*.fastq.gz
          sha256sum "$root/reads"/*.fastq.gz "$root/reads"/*_downsample.json > "$root/provenance/READ_SHA256SUMS.txt"
          python - "$root" "$s" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);files=[]
          for p in sorted((root/'reads').glob('*')):
              if p.is_file():files.append({'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'provenance/READ_FREEZE.json').write_text(json.dumps({'sample':int(sys.argv[2]),'short_fraction':0.25,'long_fraction':0.25,'seed':20260821,'truth_accessed':False,'files':files,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'boundary':'High-depth deterministic read subsets frozen without gold access.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V8_HIGHDEPTH_READS_S${{ matrix.sample }}_20260820
          path: highdepth_reads/S${{ matrix.sample }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  baseline:
    needs: downsample
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - method: metaspades_short_pair
            assembler: metaspades
            mode: short
          - method: metaspades_hybrid_pair
            assembler: metaspades
            mode: hybrid
          - method: megahit_short_pair
            assembler: megahit
            mode: short
          - method: flye_long_pair
            assembler: flye
            mode: long
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V8_HIGHDEPTH_READS_S*_20260820
          path: incoming
          merge-multiple: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v8-highdepth
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            megahit=1.2.9
            spades=4.3.0
            flye
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Build one equal-depth multimodal baseline
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          method='${{ matrix.method }}';assembler='${{ matrix.assembler }}';mode='${{ matrix.mode }}';root="v8_baseline_${method}"
          mkdir -p "$root"/{reads,assembly/run,provenance,logs,failure_audit}
          for s in 0 1;do
            for kind in R1 R2 long;do src=$(find incoming -type f -name "S${s}_${kind}.fastq.gz" -print -quit);test -s "$src";cp "$src" "$root/reads/S${s}_${kind}.fastq.gz";done
          done
          rm -rf incoming
          cat "$root/reads/S0_R1.fastq.gz" "$root/reads/S1_R1.fastq.gz" > "$root/reads/input_R1.fastq.gz"
          cat "$root/reads/S0_R2.fastq.gz" "$root/reads/S1_R2.fastq.gz" > "$root/reads/input_R2.fastq.gz"
          cat "$root/reads/S0_long.fastq.gz" "$root/reads/S1_long.fastq.gz" > "$root/reads/input_long.fastq.gz"
          gzip -t "$root/reads"/input_*.fastq.gz
          sha256sum "$root/reads"/input_*.fastq.gz > "$root/provenance/INPUT_SHA256SUMS.txt"
          seqkit stats -T "$root/reads"/input_*.fastq.gz > "$root/provenance/INPUT_STATS.tsv"
          git rev-parse HEAD > "$root/provenance/RESEARCH_HEAD.txt"
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'method=%s\nfraction=0.25\nsamples=0,1\ngold_accessed=false\n' "$method" > "$root/provenance/BOUNDARY.txt"
          set +e
          case "$assembler:$mode" in
            metaspades:short) /usr/bin/time -v timeout --signal=TERM --kill-after=120s 330m metaspades.py --only-assembler -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" -t 4 -m 13 -o "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            metaspades:hybrid) /usr/bin/time -v timeout --signal=TERM --kill-after=120s 330m metaspades.py --only-assembler -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" --nanopore "$root/reads/input_long.fastq.gz" -t 4 -m 13 -o "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            megahit:short) /usr/bin/time -v timeout --signal=TERM --kill-after=120s 330m megahit -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" -o "$root/assembly/run" --min-contig-len 500 -t 4 --memory 0.8 > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            flye:long) /usr/bin/time -v timeout --signal=TERM --kill-after=120s 330m flye --nano-raw "$root/reads/input_long.fastq.gz" --meta --threads 4 --out-dir "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
          esac
          rc=$?;set -e;printf 'exit_code=%s\n' "$rc" > "$root/failure_audit/ASSEMBLY.status";test "$rc" -eq 0
          case "$assembler" in metaspades) fasta="$root/assembly/run/contigs.fasta";;megahit) fasta="$root/assembly/run/final.contigs.fa";;flye) fasta="$root/assembly/run/assembly.fasta";;esac
          test -s "$fasta";cp "$fasta" "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$method" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);p=root/'assembly/final_assembly.fasta'
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps({'method':sys.argv[2],'fraction':0.25,'assembly_bytes':p.stat().st_size,'assembly_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'truth_accessed':False,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'boundary':'Equal-depth baseline frozen before gold.'},indent=2)+'\n')
          PY
          rm -rf "$root/reads" "$root/assembly/run"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V8_HIGHDEPTH_BASELINE_${{ matrix.method }}_20260820
          path: v8_baseline_${{ matrix.method }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  develop:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V8_HIGHDEPTH_BASELINE_*_20260820
          path: incoming
          merge-multiple: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v8-develop
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            mash=2.3
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Isolate baselines and build truth-blind extension grid
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v8_highdepth_development
          mkdir -p "$root"/{inputs,candidates,alignments,variants,evaluation,pseudo,abundance,decision,truth_download,truth,provenance,logs,failure_audit}
          for d in incoming/LANTERN_CAMI3_V8_HIGHDEPTH_BASELINE_*_20260820;do method=${d##*BASELINE_};method=${method%_20260820};fasta=$(find "$d" -type f -name final_assembly.fasta -size +0c -print -quit);test -s "$fasta";cp "$fasta" "$root/inputs/${method}.fasta";done
          rm -rf incoming
          test $(find "$root/inputs" -name '*.fasta' | wc -l) -eq 4
          seqkit stats -T "$root/inputs"/*.fasta > "$root/provenance/INPUT_STATS.tsv"
          sha256sum "$root/inputs"/*.fasta > "$root/provenance/INPUT_SHA256SUMS.txt"
          python lantern_v6/prepare_extension_candidates.py --source "hybrid=$root/inputs/metaspades_hybrid_pair.fasta" --source "megahit=$root/inputs/megahit_short_pair.fasta" --source "flye=$root/inputs/flye_long_pair.fasta" --min-length 500 --max-n-fraction 0.05 --out "$root/candidates/short" > "$root/logs/PREPARE_SHORT.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/inputs/metaspades_short_pair.fasta" "$root/candidates/short/extension_candidates.fasta" > "$root/alignments/short.paf" 2> "$root/logs/ALIGN_SHORT.log"
          python lantern_v6/prepare_extension_candidates.py --source "short=$root/inputs/metaspades_short_pair.fasta" --source "megahit=$root/inputs/megahit_short_pair.fasta" --source "flye=$root/inputs/flye_long_pair.fasta" --min-length 500 --max-n-fraction 0.05 --out "$root/candidates/hybrid" > "$root/logs/PREPARE_HYBRID.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/inputs/metaspades_hybrid_pair.fasta" "$root/candidates/hybrid/extension_candidates.fasta" > "$root/alignments/hybrid.paf" 2> "$root/logs/ALIGN_HYBRID.log"
          construct() {
            local name="$1" backbone="$2" setname="$3" mode="$4" minlen="$5" term="$6" maxfrac="$7" single="$8"
            local args=();test "$single" = true && args+=(--single-target-terminal)
            python lantern_v6/extension_union.py --backbone "$root/inputs/${backbone}.fasta" --candidates "$root/candidates/$setname/extension_candidates.fasta" --metadata "$root/candidates/$setname/extension_candidate_metadata.tsv" --candidate-to-backbone-paf "$root/alignments/${setname}.paf" --mode "$mode" --min-candidate-length "$minlen" --min-terminal-bp "$term" --alignment-identity 0.97 --alignment-min-bp 500 --whole-max-aligned-fraction "$maxfrac" --containment-fraction 0.98 --min-source-count 1 "${args[@]}" --out "$root/variants/$name" > "$root/logs/CONSTRUCT_${name}.log" 2>&1
            python lantern_cami3/scripts/verify_cami_assembly.py "$root/variants/$name/LANTERN_V6_EXTENSION_UNION.fasta" --out "$root/variants/$name/VALIDATION.json"
          }
          construct short_terminal500 metaspades_short_pair short terminal 500 500 0.30 true
          construct short_hybrid750 metaspades_short_pair short hybrid 750 500 0.30 true
          construct short_whole1000 metaspades_short_pair short whole 1000 500 0.30 false
          construct short_whole1500 metaspades_short_pair short whole 1500 500 0.30 false
          construct hybrid_terminal500 metaspades_hybrid_pair hybrid terminal 500 500 0.30 true
          construct hybrid_hybrid500 metaspades_hybrid_pair hybrid hybrid 500 500 0.70 true
          python - "$root" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);paths=list(root.glob('inputs/*.fasta'))+list(root.glob('variants/*/LANTERN_V6_EXTENSION_UNION.fasta'));files=[]
          for p in sorted(paths):files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'provenance/PRE_GOLD_GRID_FREEZE.json').write_text(json.dumps({'status':'V8_HIGHDEPTH_GRID_FROZEN','fraction':0.25,'truth_accessed':False,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'files':files,'boundary':'All high-depth baselines and predeclared extension variants frozen before development gold access.'},indent=2)+'\n')
          PY

      - name: Open development gold and evaluate all methods
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v8_highdepth_development
          for s in 0 1;do curl -fsSL --retry 8 --retry-all-errors "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" -o "$root/truth_download/sample_${s}_gsa.tar.gz";done
          python lantern_cami3/scripts/extract_gsa_truth.py --gsa-tar "S0=$root/truth_download/sample_0_gsa.tar.gz" --gsa-tar "S1=$root/truth_download/sample_1_gsa.tar.gz" --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -I 4G -d "$root/truth/toy_truth.mmi" "$root/truth/combined_truth.fasta" > "$root/logs/TRUTH_INDEX.stdout" 2> "$root/logs/TRUTH_INDEX.log"
          printf 'method\tfasta\n' > "$root/provenance/EVALUATED_METHODS.tsv"
          for fasta in "$root/inputs"/*.fasta;do printf '%s\t%s\n' "$(basename "$fasta" .fasta)" "$fasta" >> "$root/provenance/EVALUATED_METHODS.tsv";done
          for fasta in "$root"/variants/*/LANTERN_V6_EXTENSION_UNION.fasta;do printf '%s\t%s\n' "$(basename "$(dirname "$fasta")")" "$fasta" >> "$root/provenance/EVALUATED_METHODS.tsv";done
          tail -n +2 "$root/provenance/EVALUATED_METHODS.tsv" | while IFS=$'\t' read -r method fasta;do dir="$root/evaluation/$method";mkdir -p "$dir";minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/toy_truth.mmi" "$fasta" > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log";python lantern_cami3/scripts/evaluate_gold_coverage.py --paf "$dir/assembly_to_truth.paf" --truth-mapping "$root/truth/truth_mapping.tsv" --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" > "$dir/evaluate.log" 2>&1;rm -f "$dir/assembly_to_truth.paf";done

      - name: Build pseudo-novel and abundance tables and freeze development winner
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v8_highdepth_development
          python - "$root" <<'PY'
          import csv,sys
          from pathlib import Path
          root=Path(sys.argv[1]);rows=list(csv.DictReader(open(root/'truth/genome_reference_manifest.tsv'),delimiter='\t'));paths=[]
          for r in rows:
              if int(r['truth_bp'])>=50000:
                  p=root/'truth/references'/Path(r['reference_path']).name
                  if p.is_file():paths.append(str(p))
          (root/'pseudo/mash_reference_files.txt').write_text('\n'.join(paths)+'\n')
          PY
          mash sketch -k 21 -s 1000 -l "$root/pseudo/mash_reference_files.txt" -o "$root/pseudo/truth_genomes" > "$root/logs/MASH_SKETCH.log" 2>&1
          mash dist "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genomes.msh" > "$root/pseudo/truth_genome_distances.tsv"
          recovery_args=();while IFS=$'\t' read -r method fasta;do test "$method" = method && continue;recovery_args+=(--recovery "$method=$root/evaluation/$method/per_genome_recovery.tsv");done < "$root/provenance/EVALUATED_METHODS.tsv"
          python lantern_cami3/scripts/build_pseudo_novel_audit.py --manifest "$root/truth/genome_reference_manifest.tsv" --mash "$root/pseudo/truth_genome_distances.tsv" "${recovery_args[@]}" --min-truth-bp 50000 --out "$root/pseudo/results" > "$root/logs/PSEUDO_NOVEL.log" 2>&1
          for s in 0 1;do python lantern_cami3/scripts/extract_read_abundance.py --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz" --sample-id "sample${s}" --paired --out "$root/abundance/sample${s}_abundance.tsv" > "$root/logs/ABUNDANCE_S${s}.log" 2>&1;done
          python lantern_cami3/scripts/summarize_abundance_recovery.py --abundance "$root/abundance/sample0_abundance.tsv" --abundance "$root/abundance/sample1_abundance.tsv" "${recovery_args[@]}" --low-percent 0.01 --high-percent 0.1 --out "$root/abundance/results" > "$root/logs/ABUNDANCE_SUMMARY.log" 2>&1
          python - "$root" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);baselines=['metaspades_short_pair','metaspades_hybrid_pair','megahit_short_pair','flye_long_pair'];summaries={m:json.loads((root/f'evaluation/{m}/GOLD_COVERAGE_SUMMARY.json').read_text()) for m in baselines};strong=max(baselines,key=lambda m:(summaries[m]['genome_fraction_percent'],summaries[m]['mean_genome_recovery']))
          b=summaries[strong];ab=list(csv.DictReader(open(root/'abundance/results/ABUNDANCE_STRATIFIED_SUMMARY.tsv'),delimiter='\t'));pseudo=list(csv.DictReader(open(root/'pseudo/results/PSEUDO_NOVEL_RECOVERY_SUMMARY.tsv'),delimiter='\t'))
          def av(m,stratum):
              r=next((x for x in ab if x['method']==m and x['stratum']==stratum),None);return 100*float(r['mean_recovery']) if r and r['mean_recovery'] not in ('','None') else None
          def pv(m,tier):
              r=next((x for x in pseudo if x['method']==m and x['tier']==tier),None);return 100*float(r['mean_recovery']) if r and r['mean_recovery'] not in ('','None') else None
          tiers=['exact_target_withheld','species_neighbour_withheld','genus_neighbour_withheld','deep_neighbour_withheld'];rows=[]
          for p in sorted((root/'variants').glob('*/EXTENSION_SUMMARY.json')):
              m=p.parent.name;s=json.loads((root/f'evaluation/{m}/GOLD_COVERAGE_SUMMARY.json').read_text());bchim=float(b['cross_binid_chimeric_bp_fraction'] or 0);xchim=float(s['cross_binid_chimeric_bp_fraction'] or 0);rel=(xchim-bchim)/bchim if bchim else (0 if xchim==0 else None);pg={t:pv(m,t)-pv(strong,t) for t in tiers};row={'variant':m,'gf_gain_pp':s['genome_fraction_percent']-b['genome_fraction_percent'],'mean_gain_pp':100*(s['mean_genome_recovery']-b['mean_genome_recovery']),'low_gain_pp':av(m,'low')-av(strong,'low'),'relative_chimera_change':rel,'pseudo_all_positive':all(v>0 for v in pg.values()),**{f'pseudo_{k}':v for k,v in pg.items()},**json.loads(p.read_text())};row['safe']=row['gf_gain_pp']>0 and rel is not None and rel<=0.10;rows.append(row)
          safe=[r for r in rows if r['safe']];winner=max(safe,key=lambda r:(r['low_gain_pp'],r['gf_gain_pp'],r['mean_gain_pp'],-r['relative_chimera_change'])) if safe else None
          fields=[]
          for r in rows:
              for k in r:
                  if k not in fields:fields.append(k)
          with (root/'decision/DEVELOPMENT_COMPARISON.csv').open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          strict={'gf':winner is not None and winner['gf_gain_pp']>=0.5,'mean':winner is not None and winner['mean_gain_pp']>=1.0,'low':winner is not None and winner['low_gain_pp']>=2.0,'chimera':winner is not None and winner['relative_chimera_change']<=0.10,'pseudo':winner is not None and winner['pseudo_all_positive']}
          freeze={'status':'WINNER_FROZEN_FOR_HIGHDEPTH_HOLDOUT' if winner else 'NO_SAFE_WINNER','fraction':0.25,'strongest_baseline':strong,'winner':winner,'pre_longitudinal_strict_gates':strict,'all_nonlongitudinal_gates_pass':all(strict.values()),'claim_boundary':'Development-only high-depth grid. Longitudinal ablation and independent holdout remain mandatory.'}
          (root/'decision/FROZEN_V8_HIGHDEPTH_WINNER.json').write_text(json.dumps(freeze,indent=2)+'\n');print(json.dumps(freeze,indent=2))
          PY

      - name: Compact and upload development evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          root=v8_highdepth_development
          rm -rf "$root/inputs" "$root/candidates" "$root/alignments" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/truth/toy_truth.mmi" "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genome_distances.tsv"
          for d in "$root"/variants/*;do rm -f "$d/LANTERN_V6_EXTENSION_UNION.fasta";done
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          find "$root" -type f -printf '%P\t%s\n' | sort > "$root/CONTENTS.tsv" || true
          du -sh "$root" > "$root/PACKAGE_SIZE.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V8_HIGHDEPTH_MULTIMODAL_DEVELOPMENT_20260820
          path: v8_highdepth_development
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
