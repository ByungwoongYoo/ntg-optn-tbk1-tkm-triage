name: Corrected herb-drug safety smoke v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'open_problem_tournament/safety_smoke_v2.py'
      - '.github/workflows/safety-smoke-v2.yml'
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Run corrected official openFDA queries
        env:
          OUT_DIR: artifact/safety_v2_output
        run: python open_problem_tournament/safety_smoke_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: safety-smoke-v2
          path: artifact/safety_v2_output
          retention-days: 30
          if-no-files-found: error
