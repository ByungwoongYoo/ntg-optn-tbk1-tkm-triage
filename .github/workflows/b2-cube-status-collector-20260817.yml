name: B2 cube status collector 20260817
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - '.github/workflows/b2-cube-status-collector-20260817.yml'

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SOURCE_RUN_ID: '32028745970'
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Collect exact branch status from ZIP central directories
        shell: python
        run: |
          import csv, json, os, re, struct, urllib.request, zlib
          from pathlib import Path
          from datetime import datetime

          repo=os.environ['REPO']; run_id=int(os.environ['SOURCE_RUN_ID']); token=os.environ['GH_TOKEN']
          api='https://api.github.com'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'b2-status-collector'}
          out=Path('artifact/b2_cube_status'); out.mkdir(parents=True,exist_ok=True)

          def request_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as r:
                  return json.load(r)

          run=request_json(f'{api}/repos/{repo}/actions/runs/{run_id}')
          jobs=[]; page=1
          while True:
              j=request_json(f'{api}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100&page={page}')
              jobs.extend(j.get('jobs',[]))
              if len(j.get('jobs',[]))<100: break
              page+=1
          arts=[]; page=1
          while True:
              a=request_json(f'{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
              arts.extend(a.get('artifacts',[]))
              if len(a.get('artifacts',[]))<100: break
              page+=1
          art_by_name={a['name']:a for a in arts}

          class NoRedirect(urllib.request.HTTPErrorProcessor):
              def http_response(self,request,response): return response
              https_response=http_response
          no_redirect=urllib.request.build_opener(NoRedirect)

          def range_get(url,start=None,end=None,suffix=None):
              h={'User-Agent':'b2-status-collector'}
              if suffix is not None:
                  h['Range']=f'bytes=-{suffix}'
              elif end is None:
                  h['Range']=f'bytes={start}-'
              else:
                  h['Range']=f'bytes={start}-{end}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=240) as r:
                  return r.read(),dict(r.headers),r.status

          def zip_member_via_ranges(archive_url,wanted):
              resp=no_redirect.open(urllib.request.Request(archive_url,headers=headers),timeout=120)
              loc=resp.headers.get('Location')
              if not loc: return None,'no_redirect_location'
              tail,hh,status=range_get(loc,suffix=262144)
              cr=hh.get('Content-Range','')
              m=re.search(r'bytes\s+(\d+)-(\d+)/(\d+)',cr)
              if not m: return None,f'no_content_range:{status}:{cr}'
              tail_start=int(m.group(1)); total=int(m.group(3))
              pos=tail.rfind(b'PK\x05\x06')
              if pos<0: return None,'eocd_not_found'
              eocd=tail[pos:pos+22]
              if len(eocd)<22: return None,'short_eocd'
              _,disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment_len=struct.unpack('<4s4H2LH',eocd)
              if cd_off==0xffffffff or cd_size==0xffffffff: return None,'zip64_not_supported'
              cd,_,_=range_get(loc,cd_off,cd_off+cd_size-1)
              p=0; entry=None
              while p+46<=len(cd):
                  if cd[p:p+4]!=b'PK\x01\x02': break
                  vals=struct.unpack('<4s6H3L5H2L',cd[p:p+46])
                  method=vals[4]; csize=vals[8]; usize=vals[9]; fnlen=vals[10]; extralen=vals[11]; comlen=vals[12]; lhoff=vals[16]
                  name=cd[p+46:p+46+fnlen].decode('utf-8','replace')
                  if name.endswith(wanted): entry=(method,csize,usize,lhoff,name); break
                  p+=46+fnlen+extralen+comlen
              if not entry: return None,'member_not_found'
              method,csize,usize,lhoff,name=entry
              lh,_,_=range_get(loc,lhoff,lhoff+4095)
              if lh[:4]!=b'PK\x03\x04': return None,'bad_local_header'
              lv=struct.unpack('<4s5H3L2H',lh[:30]); fnlen=lv[9]; extralen=lv[10]
              data_off=lhoff+30+fnlen+extralen
              comp,_,_=range_get(loc,data_off,data_off+csize-1)
              if method==0: raw=comp
              elif method==8: raw=zlib.decompress(comp,-15)
              else: return None,f'unsupported_method_{method}'
              return raw.decode('utf-8','replace').strip(),None

          rows=[]
          for job in jobs:
              m=re.fullmatch(r'proof \((\d+), (\d+)\)',job.get('name',''))
              if not m: continue
              g,t=map(int,m.groups())
              step=next((s for s in job.get('steps',[]) if s.get('number')==7),{})
              dur=None
              if step.get('started_at') and step.get('completed_at'):
                  dur=(datetime.fromisoformat(step['completed_at'].replace('Z','+00:00'))-datetime.fromisoformat(step['started_at'].replace('Z','+00:00'))).total_seconds()
              name=f'b2-cube-g{g}-t{t}-20260817'; art=art_by_name.get(name)
              status_txt=None; err=None
              if art:
                  try: status_txt,err=zip_member_via_ranges(art['archive_download_url'],'STATUS.txt')
                  except Exception as e: err=repr(e)
              inferred=status_txt or ('CANCELLED' if job.get('conclusion')=='cancelled' else ('LIKELY_TIMEOUT' if dur is not None and dur>=3140 else 'NO_STATUS'))
              rows.append({'gap':g,'third':t,'job_id':job['id'],'job_status':job.get('status'),'job_conclusion':job.get('conclusion'),'solver_step_seconds':dur,'artifact_id':art.get('id') if art else None,'artifact_bytes':art.get('size_in_bytes') if art else None,'status_txt':status_txt,'status_read_error':err,'classification':inferred})

          rows.sort(key=lambda r:(r['gap'],r['third']))
          summary={'source_run':run,'expected_branches':111,'observed_branch_jobs':len(rows),'artifacts':len(arts),'counts':{},'rows':rows}
          for r in rows: summary['counts'][r['classification']]=summary['counts'].get(r['classification'],0)+1
          (out/'B2_CUBE_STATUS.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          with (out/'B2_CUBE_STATUS.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()) if rows else ['gap']); w.writeheader(); w.writerows(rows)
          with (out/'B2_CUBE_STATUS.md').open('w',encoding='utf-8') as f:
              f.write('# B2 cube status\n\n')
              f.write(f"Source run `{run_id}`: `{run.get('status')}` / `{run.get('conclusion')}`. Observed {len(rows)}/111 branches.\n\n")
              f.write('|class|count|\n|---|---:|\n')
              for k,v in sorted(summary['counts'].items()): f.write(f'|{k}|{v}|\n')
              f.write('\n## Unresolved branches\n\n')
              for r in rows:
                  if r['classification']!='VERIFIED_UNSAT': f.write(f"- g={r['gap']}, t={r['third']}: {r['classification']} (step={r['solver_step_seconds']}, job={r['job_conclusion']}, err={r['status_read_error']})\n")
          print(json.dumps(summary['counts'],indent=2),flush=True)
      - uses: actions/upload-artifact@v4
        with:
          name: b2-cube-status-collector-20260817-v2
          path: artifact/b2_cube_status
          retention-days: 30
          if-no-files-found: error
