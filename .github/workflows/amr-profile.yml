name: Global public-AMR unexplained-resistance census

on:
  push:
    branches: [amr-unexplained-marker-discovery-20260819]
    paths:
      - 'amr_discovery/profile_portal.py'
      - 'amr_discovery/README.md'
      - '.github/workflows/amr-profile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'amr_discovery/profile_portal.py'
      - 'amr_discovery/README.md'
      - '.github/workflows/amr-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            duckdb==1.3.2 \
            pandas==2.3.1 \
            pyarrow==21.0.0 \
            requests==2.32.5 \
            tabulate==0.9.0
      - name: Record runner provenance
        run: |
          mkdir -p amr_profile_results
          uname -a | tee amr_profile_results/UNAME.txt
          python --version | tee amr_profile_results/PYTHON_VERSION.txt
          python -m pip freeze | sort | tee amr_profile_results/PIP_FREEZE.txt
          git rev-parse HEAD | tee amr_profile_results/GIT_HEAD.txt
      - name: Profile latest EMBL-EBI AMR Portal release
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python amr_discovery/profile_portal.py \
            --out amr_profile_results \
            --min-resistant 40 \
            --min-susceptible 80 \
            --min-unexplained-resistant 20 \
            --manifest-per-class 600 \
            2>&1 | tee amr_profile_results/console.log
      - name: Hash compact evidence
        if: always()
        run: |
          find amr_profile_results -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > amr_profile_results/SHA256SUMS.txt || true
          du -ah amr_profile_results | sort -h | tail -50 > amr_profile_results/FILE_SIZES.txt || true
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMR_GLOBAL_PROFILE_20260819
          path: amr_profile_results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
