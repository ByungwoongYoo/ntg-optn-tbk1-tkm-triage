name: CASP17 active E2448 E2449 blind extension v3
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/casp17_active_extension_v3.py'
      - '.github/workflows/casp17-active-extension-v3.yml'
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Freeze corrected active CASP17 predictions before outcome
        run: |
          mkdir -p artifact/casp17_active_v3
          OUT_DIR=artifact/casp17_active_v3 python crossdomain/casp17_active_extension_v3.py
          cp crossdomain/casp17_active_extension_v3.py artifact/casp17_active_v3/
          find artifact/casp17_active_v3 -type f -print0 | sort -z | xargs -0 sha256sum > artifact/casp17_active_v3/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: casp17-active-extension-v3
          path: artifact/casp17_active_v3
          retention-days: 30
          if-no-files-found: error
