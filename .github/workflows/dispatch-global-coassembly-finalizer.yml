name: Dispatch isolated global coassembly finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-global-coassembly-finalizer.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch corrected finalizer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run lantern-global-coassembly-finalizer.yml --repo "$REPO" --ref "$REF"
          sleep 10
          gh run list --repo "$REPO" --workflow lantern-global-coassembly-finalizer.yml --branch "$REF" --limit 3 --json databaseId,status,conclusion,url,headSha,createdAt
