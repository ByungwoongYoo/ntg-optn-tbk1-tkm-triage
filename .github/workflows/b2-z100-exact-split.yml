name: B2[2] Z100 exact min-gap split

on:
  workflow_dispatch:
  push:
    branches: ["crossdomain-open-problem-tournament-20260817-doit"]
    paths:
      - "crossdomain/b2_z100_exact_split.py"
      - ".github/workflows/b2-z100-exact-split.yml"

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        min_gap: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ortools
      - name: Solve exact symmetry case
        run: |
          mkdir -p artifact/b2_exact_m${{ matrix.min_gap }}
          python crossdomain/b2_z100_exact_split.py \
            --min-gap ${{ matrix.min_gap }} \
            --seconds 900 \
            --workers 4 \
            --out-dir artifact/b2_exact_m${{ matrix.min_gap }}
      - name: Hash outputs
        run: |
          cp crossdomain/b2_z100_exact_split.py artifact/b2_exact_m${{ matrix.min_gap }}/
          find artifact/b2_exact_m${{ matrix.min_gap }} -type f -print0 | sort -z | xargs -0 sha256sum > artifact/b2_exact_m${{ matrix.min_gap }}/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2-exact-m${{ matrix.min_gap }}
          path: artifact/b2_exact_m${{ matrix.min_gap }}
          retention-days: 30
