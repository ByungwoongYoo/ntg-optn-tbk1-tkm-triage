name: CAMI III LANTERN Toy gold metadata inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-gold-metadata-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download representative public gold metadata and inspect
        run: |
          set -euo pipefail
          mkdir -p gold_meta
          curl -fsSL --retry 5 --retry-all-errors 'https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_0_gsa.tar.gz' -o /tmp/sample0_gsa.tar.gz
          tar -xzOf /tmp/sample0_gsa.tar.gz sample_0_gsa/sample0_ASV525.6_gsa.fasta.gz | gzip -dc > /tmp/asv525.fasta
          head -12 /tmp/asv525.fasta > gold_meta/gsa_ASV525_head.txt
          curl -fsSL --retry 5 --retry-all-errors 'https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/gsa_pooled_mapping.tsv.gz' -o /tmp/gsa_pooled_mapping.tsv.gz
          gzip -dc /tmp/gsa_pooled_mapping.tsv.gz > /tmp/gsa_pooled_mapping.tsv
          head -40 /tmp/gsa_pooled_mapping.tsv > gold_meta/pooled_mapping_head.tsv
          grep -m 10 -E 'ASV525|Actinomyces|Bacteroides' /tmp/gsa_pooled_mapping.tsv > gold_meta/pooled_mapping_examples.tsv || true
          sha256sum /tmp/sample0_gsa.tar.gz /tmp/gsa_pooled_mapping.tsv.gz > gold_meta/INPUT_SHA256.txt
          cat gold_meta/gsa_ASV525_head.txt
          cat gold_meta/pooled_mapping_head.tsv
          cat gold_meta/pooled_mapping_examples.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_GOLD_METADATA_20260819_V2
          path: gold_meta
          if-no-files-found: error
          retention-days: 90
