name: Herbal specificity audit

on:
  push:
    branches:
      - herbal-specificity-audit-20260816
    paths:
      - 'herbal_specificity_audit/**'
      - '.github/workflows/herbal-specificity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: herbal_specificity_audit/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r herbal_specificity_audit/requirements.txt
      - name: Reconstruct and validate frozen v2 source
        run: |
          python herbal_specificity_audit/install_v2.py
          python -m py_compile herbal_specificity_audit/audit.py
      - name: Run deterministic 100-paper v2 smoke test
        run: >-
          python herbal_specificity_audit/audit.py
          --out-dir artifact/herbal_specificity_audit
          --max-xml 100
          --workers 8
          --min-specific-n 5
          --min-broad-n 10
      - name: Upload v2 smoke-test package
        uses: actions/upload-artifact@v4
        with:
          name: herbal-specificity-audit-v2-smoke
          path: artifact/herbal_specificity_audit_package.zip
          if-no-files-found: error
          retention-days: 30
