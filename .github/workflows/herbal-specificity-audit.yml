name: Herbal specificity audit

on:
  push:
    branches:
      - herbal-specificity-audit-20260816
    paths:
      - 'herbal_specificity_audit/**'
      - '.github/workflows/herbal-specificity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: herbal_specificity_audit/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r herbal_specificity_audit/requirements.txt
      - name: Run deterministic 500-paper pilot
        run: >-
          python herbal_specificity_audit/audit.py
          --out-dir artifact/herbal_specificity_audit
          --max-xml 500
          --workers 8
      - name: Upload complete audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: herbal-specificity-audit-pilot
          path: |
            artifact/herbal_specificity_audit/
            artifact/herbal_specificity_audit_package.zip
          if-no-files-found: error
          retention-days: 30
