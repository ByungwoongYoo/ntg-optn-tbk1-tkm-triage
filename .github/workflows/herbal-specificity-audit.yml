name: Herbal specificity audit

on:
  push:
    branches:
      - herbal-specificity-audit-20260816
    paths:
      - 'herbal_specificity_audit/**'
      - '.github/workflows/herbal-specificity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: herbal_specificity_audit/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r herbal_specificity_audit/requirements.txt
      - name: Reconstruct, tighten, and validate frozen source
        run: |
          python herbal_specificity_audit/install_v2.py
          python herbal_specificity_audit/apply_v3_patch.py
          python -m py_compile herbal_specificity_audit/audit.py
      - name: Run held-out full frozen-corpus audit
        run: >-
          python herbal_specificity_audit/audit.py
          --out-dir artifact/herbal_specificity_audit
          --workers 12
          --full
          --min-specific-n 10
          --min-broad-n 20
      - name: Upload final reproducibility package
        uses: actions/upload-artifact@v4
        with:
          name: herbal-specificity-audit-final-v3
          path: artifact/herbal_specificity_audit_package.zip
          if-no-files-found: error
          retention-days: 30
