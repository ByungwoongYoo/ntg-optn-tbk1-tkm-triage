name: Vesuvius fiber skeleton positive-control inventory 20260818
on:
  workflow_dispatch:
  push:
    branches: [vesuvius-fiber-tracing-20260818]
    paths:
      - 'crossdomain/vesuvius_fiber_inventory.py'
      - '.github/workflows/vesuvius-fiber-inventory-20260818.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POINTER: crossdomain/VESUVIUS_FIBER_INVENTORY_LATEST_RUN.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish running pointer
        run: |
          printf '{"run_id":%s,"status":"running","commit":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > pointer.json
          encoded=$(base64 -w0 pointer.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${POINTER}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${POINTER}" -f message="Record Vesuvius fiber inventory run ${GITHUB_RUN_ID}" -f content="$encoded" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Environment
        run: |
          mkdir -p artifact/vesuvius_fiber_inventory
          {
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_image=${ImageOS:-unknown}"
            uname -a
            python --version
            gcc --version | head -1
          } | tee artifact/vesuvius_fiber_inventory/ENVIRONMENT.txt
      - name: Install readers
        run: pip install numpy scipy matplotlib pynrrd nibabel tifffile imagecodecs
      - name: Download official archived positive-control data
        run: |
          set -euo pipefail
          mkdir -p data
          url='https://dl.ash2txt.org/datasets/fiber-skeletons/fiber-skeletons.zip'
          curl -fL --retry 20 --retry-all-errors --retry-delay 3 "$url" -o data/fiber-skeletons.zip
          sha256sum data/fiber-skeletons.zip | tee artifact/vesuvius_fiber_inventory/ARCHIVE_SHA256.txt
          stat -c '%s bytes' data/fiber-skeletons.zip | tee artifact/vesuvius_fiber_inventory/ARCHIVE_SIZE.txt
          unzip -q data/fiber-skeletons.zip -d data/fiber-skeletons
      - name: Inventory arrays, labels, and original skeletons
        run: |
          python crossdomain/vesuvius_fiber_inventory.py data/fiber-skeletons artifact/vesuvius_fiber_inventory --max-arrays 40 | tee artifact/vesuvius_fiber_inventory/STDOUT.log
          cp crossdomain/vesuvius_fiber_inventory.py artifact/vesuvius_fiber_inventory/
          test "$(python -c 'import json;print(json.load(open("artifact/vesuvius_fiber_inventory/INVENTORY.json"))["status"])')" = POSITIVE_CONTROL_DATASET_INVENTORIED
      - name: Manifest
        run: |
          find artifact/vesuvius_fiber_inventory -type f -print0 | sort -z | xargs -0 sha256sum > artifact/vesuvius_fiber_inventory/SHA256SUMS.txt
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: vesuvius-fiber-inventory-20260818
          path: artifact/vesuvius_fiber_inventory
          retention-days: 90
          if-no-files-found: error
      - name: Publish completed pointer
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf '{"run_id":%s,"status":"completed","conclusion":"success","commit":"%s","artifact_id":%s,"artifact_digest":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" > pointer.json
          encoded=$(base64 -w0 pointer.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${POINTER}?ref=${GITHUB_REF_NAME}" --jq .sha)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${POINTER}" -f message="Complete Vesuvius fiber inventory run ${GITHUB_RUN_ID}" -f content="$encoded" -f branch="${GITHUB_REF_NAME}" -f sha="$sha" >/dev/null
