name: B2 Z100 adaptive fifth-point proof split v3

on:
  push:
    branches: [b2-z100-final-proof-audit-20260818]
    paths:
      - 'crossdomain/B2_U_SPLIT_DRAT_V3_LATEST_RUN.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_cases: ${{ steps.plan.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64,json,math
          d=json.load(open('crossdomain/B2_U_SPLIT_DRAT_V3_LATEST_RUN.json'))
          assert not d.get('verified_sat_counterexamples'),d
          prefixes=d.get('unresolved_prefixes',[])
          for p in prefixes:
              assert isinstance(p,list) and len(p)==4 and p[:2]==[0,1],p
          if prefixes:
              chunk=max(1,math.ceil(len(prefixes)/240))
              batches=[]
              for i in range(0,len(prefixes),chunk):
                  part=prefixes[i:i+chunk]
                  enc=base64.urlsafe_b64encode(json.dumps(part,separators=(',',':')).encode()).decode()
                  batches.append({'batch':len(batches),'prefixes_b64':enc,'skip':False})
          else:
              batches=[{'batch':0,'prefixes_b64':'W10=','skip':True}]
          print('matrix='+json.dumps({'include':batches},separators=(',',':')))
          print('has_cases='+('true' if prefixes else 'false'))
          PY

  split:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CADICAL_COMMIT: c60730422e758ef1cebe7aeddf2dda31c996bf04
      DRAT_TRIM_COMMIT: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ !matrix.skip }}
        with:
          python-version: '3.12'

      - name: Build pinned tools
        if: ${{ !matrix.skip }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile crossdomain/b2_z100_prefix_proof_cnf_v3.py crossdomain/b2_z100_split_proof_batch_v3.py crossdomain/b2_z100_verify_cadical_model.py
          git clone -q https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout -q "$CADICAL_COMMIT"
          test "$(git -C /tmp/cadical rev-parse HEAD)" = "$CADICAL_COMMIT"
          (cd /tmp/cadical && ./configure >/dev/null && make -j2 >/dev/null)
          git clone -q https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout -q "$DRAT_TRIM_COMMIT"
          test "$(git -C /tmp/drat-trim rev-parse HEAD)" = "$DRAT_TRIM_COMMIT"
          make -C /tmp/drat-trim -j2 >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Run complete fifth-point splits
        if: ${{ !matrix.skip }}
        env:
          PREFIXES_B64: ${{ matrix.prefixes_b64 }}
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifact/batch${BATCH}/parents"
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          prefixes=json.loads(base64.urlsafe_b64decode(os.environ['PREFIXES_B64']).decode())
          root=pathlib.Path(f"artifact/batch{os.environ['BATCH']}/parents")
          rows=[]
          for p in prefixes:
              pid='p'+'-'.join(map(str,p)); out=root/pid; out.mkdir(parents=True,exist_ok=True)
              cmd=['python','crossdomain/b2_z100_split_proof_batch_v3.py','--prefix-json',json.dumps(p,separators=(',',':')),'--generator','crossdomain/b2_z100_prefix_proof_cnf_v3.py','--model-checker','crossdomain/b2_z100_verify_cadical_model.py','--cadical','/tmp/cadical/build/cadical','--drat-trim','/tmp/drat-trim/drat-trim','--zstd','zstd','--workers','2','--solve-seconds','240','--check-seconds','90','--out',str(out)]
              with (out/'batch_stdout.log').open('wb') as so,(out/'batch_stderr.log').open('wb') as se:
                  rc=subprocess.run(cmd,stdout=so,stderr=se,check=False).returncode
              (out/'batch_exit_code.txt').write_text(str(rc)+'\n')
              s=json.load(open(out/'SUMMARY.json'))
              rows.append({'parent_prefix':p,'return_code':rc,'summary':s})
          b={'schema':'b2-z100-v-split-batch-v3','batch':int(os.environ['BATCH']),'parents':rows}
          path=pathlib.Path(f"artifact/batch{os.environ['BATCH']}/BATCH_SUMMARY.json")
          path.write_text(json.dumps(b,indent=2,sort_keys=True)+'\n')
          PY
          find "artifact/batch${BATCH}" -maxdepth 1 -type f ! -name SHA256SUMS_TOP.txt -print0 | sort -z | xargs -0 sha256sum > "artifact/batch${BATCH}/SHA256SUMS_TOP.txt"

      - name: Write no-op batch
        if: ${{ matrix.skip }}
        shell: bash
        run: |
          mkdir -p artifact/batch0
          printf '{"schema":"b2-z100-v-split-batch-v3","batch":0,"parents":[]}\n' > artifact/batch0/BATCH_SUMMARY.json
          sha256sum artifact/batch0/BATCH_SUMMARY.json > artifact/batch0/SHA256SUMS_TOP.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.skip }}
        with:
          name: b2-z100-v-split-batch${{ matrix.batch }}-v3-proofs
          path: artifact/batch${{ matrix.batch }}
          retention-days: 90
          compression-level: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-z100-v-split-batch${{ matrix.batch }}-v3-summary
          path: |
            artifact/batch${{ matrix.batch }}/BATCH_SUMMARY.json
            artifact/batch${{ matrix.batch }}/SHA256SUMS_TOP.txt
          retention-days: 90
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [plan, split]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: b2-z100-v-split-batch*-v3-summary
          path: aggregate
          merge-multiple: false
      - name: Aggregate fifth-point closures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          stage=json.load(open('crossdomain/B2_U_SPLIT_DRAT_V3_LATEST_RUN.json'))
          expected=stage.get('unresolved_prefixes',[])
          rows=[]
          for p in pathlib.Path('aggregate').rglob('BATCH_SUMMARY.json'):
              rows.extend(json.load(open(p)).get('parents',[]))
          by={tuple(r['parent_prefix']):r for r in rows}
          missing=[p for p in expected if tuple(p) not in by]
          unresolved=[];counter=[];closed=[]
          for p in expected:
              r=by.get(tuple(p))
              if not r: continue
              s=r['summary']
              counter.extend(s.get('verified_sat_counterexamples',[]))
              unresolved.extend(s.get('unresolved_child_prefixes',[]))
              if s.get('parent_verified_unsat_by_complete_children'): closed.append(p)
          payload={
            'schema':'b2-z100-adaptive-v-split-v3-summary',
            'run_id':int('${{ github.run_id }}'),
            'run_attempt':int('${{ github.run_attempt }}'),
            'commit':'${{ github.sha }}',
            'u_split_run_id':stage.get('run_id'),
            'input_unresolved_prefixes':expected,
            'closed_parent_prefixes':closed,
            'missing_parent_prefixes':missing,
            'unresolved_prefixes':unresolved,
            'verified_sat_counterexamples':counter,
            'all_input_parents_closed':len(closed)==len(expected) and not missing and not unresolved and not counter,
            'claim_boundary':'Each input fourth-point prefix is closed only by complete disjoint fifth-point coverage with checked terminal proofs.'
          }
          pathlib.Path('aggregate/V_SPLIT_SUMMARY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          pathlib.Path('aggregate/PARENT_ROWS.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          pathlib.Path('aggregate/UNRESOLVED_PREFIXES.json').write_text(json.dumps(unresolved,indent=2)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
          find aggregate -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > aggregate/SHA256SUMS.txt
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: b2-z100-adaptive-v-split-v3-summary
          path: |
            aggregate/V_SPLIT_SUMMARY.json
            aggregate/PARENT_ROWS.json
            aggregate/UNRESOLVED_PREFIXES.json
            aggregate/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
      - name: Publish stage pointer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=json.load(open('aggregate/V_SPLIT_SUMMARY.json'))
          p.update({'artifact_id':int(os.environ['ARTIFACT_ID']),'artifact_url':os.environ['ARTIFACT_URL'],'artifact_digest':os.environ['ARTIFACT_DIGEST']})
          pathlib.Path('pointer.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          encoded=$(base64 -w0 pointer.json)
          path='crossdomain/B2_V_SPLIT_DRAT_V3_LATEST_RUN.json'
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="Record B2 adaptive V-split run ${GITHUB_RUN_ID}" -f content="$encoded" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
      - name: Enforce stage proof gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('aggregate/V_SPLIT_SUMMARY.json'))
          assert not p['verified_sat_counterexamples'],p
          assert p['all_input_parents_closed'],p
          PY
