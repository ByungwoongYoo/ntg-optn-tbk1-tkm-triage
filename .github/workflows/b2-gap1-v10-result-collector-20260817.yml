name: B2 gap1 v10 result collector 20260817
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - '.github/workflows/b2-gap1-v10-result-collector-20260817.yml'
permissions:
  actions: read
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: '32040699080'
    steps:
      - name: Wait for all 256 artifacts
        shell: bash
        run: |
          deadline=$((SECONDS+18000))
          while true; do
            count=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=1" --jq '.total_count')
            status=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq '.status')
            conclusion=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')
            echo "source=$status/$conclusion artifacts=$count"
            if [ "$count" -ge 256 ] || [ "$status" = completed ] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 60
          done
      - name: Download all source artifacts with GitHub CLI
        run: gh run download "$SOURCE_RUN_ID" --repo "$REPO" --dir downloaded
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Aggregate and independently audit all 256 branch results
        shell: python
        run: |
          import csv,json,re
          from pathlib import Path
          rows=[]
          for d in Path('downloaded').iterdir():
              if not d.is_dir():continue
              m=re.fullmatch(r'b2-gap1-t(\d+)-u(\d+)-v-split-v10',d.name)
              if not m:continue
              status=(d/'STATUS.txt').read_text().strip()
              r=json.loads((d/'RESULT.json').read_text())
              audit=json.loads((d/'INDEPENDENT_AUDIT.json').read_text())
              t,u=map(int,m.groups())
              rows.append({'third':t,'fourth':u,'control':audit.get('control',False),'status':status,'completed_exhaustively':r['completed_exhaustively'],'timed_out':r['timed_out'],'witness_found':r['witness_found'],'witness_verified':r['witness_verified'],'aggregate_nodes':r['aggregate_nodes_including_fourth_root'],'wall_seconds':r['wall_seconds'],'audit_status':audit['status'],'coverage_ok':audit['coverage_ok']})
          rows.sort(key=lambda x:(x['third'],x['fourth']))
          expected={(t,u) for t in (2,3,4) for u in range(t+1,92-t)}|{(7,8)}
          observed={(r['third'],r['fourth']) for r in rows}
          assert observed==expected,(len(expected),len(observed),sorted(expected-observed)[:20],sorted(observed-expected)[:20])
          for r in rows:
              assert r['coverage_ok'] and r['status']==r['audit_status']
              if r['status']=='EXHAUSTED_NO_WITNESS':assert r['completed_exhaustively'] and not r['witness_found']
              if r['status']=='VERIFIED_WITNESS':assert r['witness_verified']
          counts={}
          for r in rows:counts[r['status']]=counts.get(r['status'],0)+1
          hard=[r for r in rows if not r['control']]
          out=Path('artifact/b2_gap1_v10_summary');out.mkdir(parents=True,exist_ok=True)
          summary={'source_run':32040699080,'expected_artifacts':256,'observed_artifacts':len(rows),'hard_branch_count':len(hard),'counts':counts,'verified_witnesses':[r for r in hard if r['status']=='VERIFIED_WITNESS'],'incomplete':[r for r in hard if r['status']=='INCOMPLETE_TIMEOUT'],'all_hard_exhausted_no_witness':all(r['status']=='EXHAUSTED_NO_WITNESS' for r in hard),'rows':rows}
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          with (out/'SUMMARY.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          (out/'SUMMARY.md').write_text('# B2 gap1 v10 aggregate\n\n'+f'Counts: `{counts}`\n\nAll 255 hard branches exhausted without witness: **{summary["all_hard_exhausted_no_witness"]}**\n\nVerified witnesses: {len(summary["verified_witnesses"])}\n\nIncomplete: {[(r["third"],r["fourth"]) for r in summary["incomplete"]]}\n',encoding='utf-8')
          print(json.dumps({'counts':counts,'all_hard_exhausted_no_witness':summary['all_hard_exhausted_no_witness'],'witnesses':len(summary['verified_witnesses']),'incomplete':[(r['third'],r['fourth']) for r in summary['incomplete']]},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap1-v10-result-collector-20260817
          path: artifact/b2_gap1_v10_summary
          retention-days: 30
          if-no-files-found: error
