name: CAMI III LANTERN metaMDBG long-read development benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-metamdbg-development.yml'
      - 'lantern_cami3/scripts/evaluate_gold_coverage.py'
      - 'lantern_cami3/scripts/extract_gsa_truth.py'
      - 'lantern_cami3/scripts/verify_cami_assembly.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  READ_RUN_ID: '32332720862'
  V4_RUN_ID: '32332720793'
  V4_ARTIFACT: 'LANTERN_CAMI3_HYBRID_V4_DEVELOPMENT_20260820'
  SEED: '20260819'

jobs:
  metamdbg:
    strategy:
      fail-fast: false
      matrix:
        method: [metamdbg_pair, metamdbg_s0, metamdbg_s1]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable development read artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_TOY_READS_S*_V1
          path: read_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.READ_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: metamdbg-development
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            metamdbg=1.4
            minimap2=2.31
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all

      - name: Isolate immutable long-read inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'
          root="metamdbg_${method}"
          mkdir -p "$root"/{inputs,assembly,evaluation,truth_download,truth,provenance,logs,failure_audit}
          for s in 0 1; do
            f=$(find read_artifacts -type f -name "S${s}_long.fastq.gz" -print -quit)
            test -s "$f"
            ln -s "$PWD/$f" "$root/inputs/S${s}_long.fastq.gz"
          done
          gzip -t "$root"/inputs/*.fastq.gz
          seqkit stats -T "$root"/inputs/*.fastq.gz > "$root/provenance/READ_STATS.tsv"
          sha256sum "$root"/inputs/*.fastq.gz > "$root/provenance/READ_SHA256.txt"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          metaMDBG --help > "$root/provenance/METAMDBG_HELP.txt" 2>&1 || true
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'method=%s\nread_run=%s\nseed=%s\ngold_accessed=false\n' "$method" "$READ_RUN_ID" "$SEED" > "$root/provenance/FROZEN_INPUTS.txt"

      - name: Run truth-blind metaMDBG/nanoMDBG assembly
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'
          root="metamdbg_${method}"
          case "$method" in
            metamdbg_pair) inputs=("$root/inputs/S0_long.fastq.gz" "$root/inputs/S1_long.fastq.gz") ;;
            metamdbg_s0) inputs=("$root/inputs/S0_long.fastq.gz") ;;
            metamdbg_s1) inputs=("$root/inputs/S1_long.fastq.gz") ;;
          esac
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=120s 300m \
            metaMDBG asm --out-dir "$root/assembly/out" --in-ont "${inputs[@]}" --threads 4 \
            > "$root/logs/METAMDBG.log" 2>&1
          rc=$?
          set -e
          printf 'exit_code=%s\ncommand=metaMDBG asm --out-dir %s --in-ont %s --threads 4\n' \
            "$rc" "$root/assembly/out" "${inputs[*]}" > "$root/failure_audit/METAMDBG.status"
          contigs=$(find "$root/assembly/out" -maxdepth 2 -type f \( -name 'contigs.fasta.gz' -o -name 'contigs.fasta' -o -name 'assembly.fasta' \) -print -quit)
          test -n "$contigs"
          if [[ "$contigs" == *.gz ]]; then gzip -cd "$contigs" > "$root/assembly/final_assembly.fasta"; else cp "$contigs" "$root/assembly/final_assembly.fasta"; fi
          test -s "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$method" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); method=sys.argv[2]
          fasta=root/'assembly/final_assembly.fasta'
          freeze={
            'method':method,
            'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'assembly_sha256':hashlib.sha256(fasta.read_bytes()).hexdigest(),
            'assembly_bytes':fasta.stat().st_size,
            'truth_accessed':False,
            'boundary':'The metaMDBG assembly was completed and hashed before Toy gold-standard archives were downloaded.'
          }
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(freeze,indent=2)+'\n')
          PY

      - name: Open Toy gold only after assembly freeze and evaluate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'
          root="metamdbg_${method}"
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          sha256sum "$root"/truth_download/*.tar.gz > "$root/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" \
            --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 \
            "$root/truth/combined_truth.fasta" "$root/assembly/final_assembly.fasta" \
            > "$root/evaluation/assembly_to_truth.paf" 2> "$root/logs/MINIMAP2.log"
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf "$root/evaluation/assembly_to_truth.paf" \
            --truth-mapping "$root/truth/truth_mapping.tsv" \
            --assembly-fasta "$root/assembly/final_assembly.fasta" \
            --min-identity 0.90 --min-alignment 500 --out "$root/evaluation" \
            > "$root/logs/EVALUATE.log" 2>&1
          test -s "$root/evaluation/GOLD_COVERAGE_SUMMARY.json"

      - name: Compact reproducible artifact
        if: always()
        shell: micromamba-shell {0}
        run: |
          method='${{ matrix.method }}'
          root="metamdbg_${method}"
          rm -rf "$root/inputs" "$root/assembly/out" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/evaluation/assembly_to_truth.paf"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_METAMDBG_${{ matrix.method }}_DEVELOPMENT_20260820
          path: metamdbg_${{ matrix.method }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  compare:
    needs: metamdbg
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download current metaMDBG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_METAMDBG_*_DEVELOPMENT_20260820
          path: inputs/metamdbg
          merge-multiple: false
      - name: Download immutable v4 development evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V4_ARTIFACT }}
          path: inputs/v4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V4_RUN_ID }}
      - name: Compare long-read baseline to prior frozen methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metamdbg_comparison/{results,provenance,failure_audit}
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          rows=[]
          for p in sorted(Path('inputs/metamdbg').rglob('GOLD_COVERAGE_SUMMARY.json')):
              s=json.loads(p.read_text())
              method=next((part for part in p.parts if part.startswith('LANTERN_CAMI3_METAMDBG_')),p.parent.name)
              method=method.replace('LANTERN_CAMI3_METAMDBG_','').replace('_DEVELOPMENT_20260820','')
              rows.append({'method':method,'role':'baseline','genome_fraction_percent':s['genome_fraction_percent'],'mean_genome_recovery_percent':100*s['mean_genome_recovery'],'chimera_bp_fraction':s['cross_binid_chimeric_bp_fraction'],'assembly_total_bp':s['assembly_total_bp']})
          v4_csv=next(Path('inputs/v4').rglob('decision/V4_DEVELOPMENT_COMPARISON.csv'))
          with v4_csv.open(newline='') as f:
              for r in csv.DictReader(f):
                  if r['variant']=='v4_balanced':
                      rows.append({'method':'v4_balanced','role':'lantern','genome_fraction_percent':float(r['genome_fraction_percent']),'mean_genome_recovery_percent':float(r['mean_genome_recovery_percent']),'chimera_bp_fraction':float(r['cross_binid_chimera_bp_fraction']),'assembly_total_bp':''})
          base_summary=next(Path('inputs/v4').rglob('evaluation/metaspades_hybrid_pair/GOLD_COVERAGE_SUMMARY.json'))
          s=json.loads(base_summary.read_text())
          rows.append({'method':'metaspades_hybrid_pair','role':'baseline','genome_fraction_percent':s['genome_fraction_percent'],'mean_genome_recovery_percent':100*s['mean_genome_recovery'],'chimera_bp_fraction':s['cross_binid_chimeric_bp_fraction'],'assembly_total_bp':s['assembly_total_bp']})
          rows=sorted(rows,key=lambda r:(-float(r['genome_fraction_percent']),-float(r['mean_genome_recovery_percent']),r['method']))
          fields=list(rows[0]) if rows else ['method']
          with open('metamdbg_comparison/results/METHOD_COMPARISON.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          best=rows[0] if rows else None
          verdict={'status':'PASS' if best else 'NO_RESULTS','strongest_method':best['method'] if best else None,'strongest_role':best['role'] if best else None,'methods':rows,'boundary':'Public Toy development comparison only. metaMDBG was evaluated after truth-blind assembly freeze; this is not a CAMI hidden-challenge result.'}
          Path('metamdbg_comparison/results/METAMDBG_DEVELOPMENT_VERDICT.json').write_text(json.dumps(verdict,indent=2)+'\n')
          PY
          git rev-parse HEAD > metamdbg_comparison/provenance/GIT_HEAD.txt
          printf 'read_run=%s\nv4_run=%s\nv4_artifact=%s\n' "$READ_RUN_ID" "$V4_RUN_ID" "$V4_ARTIFACT" > metamdbg_comparison/provenance/UPSTREAM.txt
          find metamdbg_comparison -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > metamdbg_comparison/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_METAMDBG_DEVELOPMENT_COMPARISON_20260820
          path: metamdbg_comparison
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
