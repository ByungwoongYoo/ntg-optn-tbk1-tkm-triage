name: ProteinGym wide nested human benchmark
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_wide_nested.py'
      - '.github/workflows/proteingym-wide-nested.yml'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis stack
        run: pip install numpy pandas scipy scikit-learn
      - name: Apply runtime efficiency patch and syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio_open_problem/proteingym_wide_nested.py')
          s=p.read_text()
          old='''    train_scores = model_training_scores(train, models)
    ordered = sorted(models, key=lambda m: (-np.nan_to_num(train_scores[m], nan=-999), m))
    if method == "top3_mean":
        return test[[f"rank__{m}" for m in ordered[:3]]].mean(axis=1, skipna=True).to_numpy(float)
    if method == "top5_mean":
        return test[[f"rank__{m}" for m in ordered[:5]]].mean(axis=1, skipna=True).to_numpy(float)
    if method == "performance_weighted":
        raw = np.asarray([max(0.0, np.nan_to_num(train_scores[m], nan=0.0)) ** 2 for m in models])
        if raw.sum() <= 0:
            raw = np.ones(len(models), dtype=float)
        return row_weighted_average(test, columns, raw / raw.sum())
    if method.startswith("ridge_"):
        alpha = float(method.split("_", 1)[1])
        sampled, weights = balanced_training_sample(train)
        pipeline = make_pipeline(
            SimpleImputer(strategy="median", add_indicator=True),
            Ridge(alpha=alpha),
        )
        pipeline.fit(sampled[columns], sampled["target_rank"], ridge__sample_weight=weights)
        return pipeline.predict(test[columns])
'''
          new='''    if method.startswith("ridge_"):
        alpha = float(method.split("_", 1)[1])
        sampled, weights = balanced_training_sample(train)
        pipeline = make_pipeline(
            SimpleImputer(strategy="median", add_indicator=True),
            Ridge(alpha=alpha),
        )
        pipeline.fit(sampled[columns], sampled["target_rank"], ridge__sample_weight=weights)
        return pipeline.predict(test[columns])

    cache_key = "model_training_scores__" + "|".join(models)
    if cache_key not in train.attrs:
        train.attrs[cache_key] = model_training_scores(train, models)
    train_scores = train.attrs[cache_key]
    ordered = sorted(models, key=lambda m: (-np.nan_to_num(train_scores[m], nan=-999), m))
    if method == "top3_mean":
        return test[[f"rank__{m}" for m in ordered[:3]]].mean(axis=1, skipna=True).to_numpy(float)
    if method == "top5_mean":
        return test[[f"rank__{m}" for m in ordered[:5]]].mean(axis=1, skipna=True).to_numpy(float)
    if method == "performance_weighted":
        raw = np.asarray([max(0.0, np.nan_to_num(train_scores[m], nan=0.0)) ** 2 for m in models])
        if raw.sum() <= 0:
            raw = np.ones(len(models), dtype=float)
        return row_weighted_average(test, columns, raw / raw.sum())
'''
          if old not in s:
              raise SystemExit('Efficiency patch target not found')
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile bio_open_problem/proteingym_wide_nested.py
      - name: Download official ProteinGym v1.3 wide scores and reference
        run: |
          mkdir -p pg_data artifact/proteingym_wide_nested
          curl -L --fail --retry 8 --retry-delay 5 \
            -o pg_data/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 \
            -o pg_data/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum pg_data/* > artifact/resource_sha256.txt
          ls -lh pg_data
      - name: Run nested cross-protein benchmark
        run: |
          python bio_open_problem/proteingym_wide_nested.py \
            --score-zip pg_data/zero_shot_substitutions_scores.zip \
            --reference pg_data/DMS_substitutions.csv \
            --out-dir artifact/proteingym_wide_nested
      - name: Build manifest and compact package
        if: always()
        run: |
          cp bio_open_problem/proteingym_wide_nested.py artifact/
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('artifact')
          manifest={}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.stat().st_size < 500_000_000:
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1<<20),b''): h.update(b)
                  manifest[str(p.relative_to(root))]={'bytes':p.stat().st_size,'sha256':h.hexdigest()}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          PY
          tar -czf artifact/proteingym_wide_nested_results.tar.gz \
            artifact/proteingym_wide_nested artifact/resource_sha256.txt \
            artifact/proteingym_wide_nested.py artifact/MANIFEST.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proteingym-wide-nested
          path: |
            artifact/proteingym_wide_nested
            artifact/resource_sha256.txt
            artifact/proteingym_wide_nested.py
            artifact/MANIFEST.json
            artifact/proteingym_wide_nested_results.tar.gz
          retention-days: 30
          if-no-files-found: warn
