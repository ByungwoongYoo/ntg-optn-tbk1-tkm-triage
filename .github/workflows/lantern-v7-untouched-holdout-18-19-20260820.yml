name: LANTERN v7 untouched official Toy holdout 18-19

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lantern-v7-untouched-holdout-18-19-20260820.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RESEARCH_REF: 'lantern-v7-multi-angle-20260820'
  DEVELOPMENT_RUN_ID: '32351114616'
  DEVELOPMENT_ARTIFACT: 'LANTERN_CAMI3_V7_SHORT_BACKBONE_DEVELOPMENT_20260820'
  SHORT_FRACTION: '0.03'
  LONG_FRACTION: '0.04'
  SEED: '20260819'

jobs:
  downsample:
    strategy:
      fail-fast: false
      matrix:
        sample: [18, 19]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stream and freeze short plus long holdout reads
        run: |
          set -euo pipefail
          s='${{ matrix.sample }}'; root="holdout_reads/S${s}"
          mkdir -p "$root"/{reads,provenance,logs}
          python lantern_cami3/scripts/stream_downsample_cami_tar.py \
            --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz" \
            --sample-id "S${s}" --mode short --fraction "$SHORT_FRACTION" --seed "$SEED" \
            --min-kept 10000 --out-dir "$root/reads" > "$root/logs/SHORT.log" 2>&1
          python lantern_cami3/scripts/stream_downsample_cami_tar.py \
            --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz" \
            --sample-id "S${s}" --mode long --fraction "$LONG_FRACTION" --seed "$SEED" \
            --min-kept 1000 --out-dir "$root/reads" > "$root/logs/LONG.log" 2>&1
          gzip -t "$root/reads"/*.fastq.gz
          sha256sum "$root/reads"/*.fastq.gz "$root/reads"/*_downsample.json > "$root/provenance/READ_SHA256SUMS.txt"
          python - "$root" "$s" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);s=int(sys.argv[2]);files=[]
          for p in sorted((root/'reads').glob('*')):
              if p.is_file():files.append({'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          obj={'sample':s,'short_fraction':0.03,'long_fraction':0.04,'seed':20260819,'truth_accessed':False,'files':files,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'boundary':'Deterministic short- and long-read holdout subsets were frozen without GSA, taxonomy, or performance access.'}
          (root/'provenance/READ_FREEZE.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
          git rev-parse HEAD > "$root/provenance/RESEARCH_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          python --version > "$root/provenance/PYTHON_VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V7_HOLDOUT_READS_S${{ matrix.sample }}_20260820
          path: holdout_reads/S${{ matrix.sample }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  baseline:
    needs: downsample
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - method: metaspades_short_pair
            assembler: metaspades
            mode: short
            scope: pair
          - method: metaspades_hybrid_pair
            assembler: metaspades
            mode: hybrid
            scope: pair
          - method: megahit_short_pair
            assembler: megahit
            mode: short
            scope: pair
          - method: flye_long_pair
            assembler: flye
            mode: long
            scope: pair
          - method: metaspades_short_s18
            assembler: metaspades
            mode: short
            scope: s18
          - method: metaspades_hybrid_s18
            assembler: metaspades
            mode: hybrid
            scope: s18
          - method: megahit_short_s18
            assembler: megahit
            mode: short
            scope: s18
          - method: flye_long_s18
            assembler: flye
            mode: long
            scope: s18
          - method: metaspades_short_s19
            assembler: metaspades
            mode: short
            scope: s19
          - method: metaspades_hybrid_s19
            assembler: metaspades
            mode: hybrid
            scope: s19
          - method: megahit_short_s19
            assembler: megahit
            mode: short
            scope: s19
          - method: flye_long_s19
            assembler: flye
            mode: long
            scope: s19
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V7_HOLDOUT_READS_S*_20260820
          path: incoming
          merge-multiple: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v7-holdout-baseline
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            megahit=1.2.9
            spades=4.3.0
            flye
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Build one truth-blind baseline
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'; assembler='${{ matrix.assembler }}'; mode='${{ matrix.mode }}'; scope='${{ matrix.scope }}'
          root="baseline_${method}"
          mkdir -p "$root"/{reads,assembly/run,provenance,logs,failure_audit}
          for s in 18 19; do
            for kind in R1 R2 long; do
              src=$(find incoming -type f -name "S${s}_${kind}.fastq.gz" -print -quit)
              test -s "$src"
              cp "$src" "$root/reads/S${s}_${kind}.fastq.gz"
            done
          done
          rm -rf incoming
          if test "$scope" = pair; then
            cat "$root/reads/S18_R1.fastq.gz" "$root/reads/S19_R1.fastq.gz" > "$root/reads/input_R1.fastq.gz"
            cat "$root/reads/S18_R2.fastq.gz" "$root/reads/S19_R2.fastq.gz" > "$root/reads/input_R2.fastq.gz"
            cat "$root/reads/S18_long.fastq.gz" "$root/reads/S19_long.fastq.gz" > "$root/reads/input_long.fastq.gz"
          else
            s=${scope#s}
            cp "$root/reads/S${s}_R1.fastq.gz" "$root/reads/input_R1.fastq.gz"
            cp "$root/reads/S${s}_R2.fastq.gz" "$root/reads/input_R2.fastq.gz"
            cp "$root/reads/S${s}_long.fastq.gz" "$root/reads/input_long.fastq.gz"
          fi
          gzip -t "$root/reads"/input_*.fastq.gz
          sha256sum "$root/reads"/input_*.fastq.gz > "$root/provenance/INPUT_SHA256SUMS.txt"
          seqkit stats -T "$root/reads"/input_*.fastq.gz > "$root/provenance/INPUT_STATS.tsv"
          git rev-parse HEAD > "$root/provenance/RESEARCH_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'method=%s\nassembler=%s\nmode=%s\nscope=%s\nsamples=18,19\ngold_accessed=false\n' "$method" "$assembler" "$mode" "$scope" > "$root/provenance/BOUNDARY.txt"

          set +e
          case "$assembler:$mode" in
            metaspades:short)
              /usr/bin/time -v timeout --signal=TERM --kill-after=120s 240m metaspades.py --only-assembler -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" -t 4 -m 13 -o "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            metaspades:hybrid)
              /usr/bin/time -v timeout --signal=TERM --kill-after=120s 240m metaspades.py --only-assembler -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" --nanopore "$root/reads/input_long.fastq.gz" -t 4 -m 13 -o "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            megahit:short)
              /usr/bin/time -v timeout --signal=TERM --kill-after=120s 240m megahit -1 "$root/reads/input_R1.fastq.gz" -2 "$root/reads/input_R2.fastq.gz" -o "$root/assembly/run" --min-contig-len 500 -t 4 --memory 0.8 > "$root/logs/ASSEMBLY.log" 2>&1 ;;
            flye:long)
              /usr/bin/time -v timeout --signal=TERM --kill-after=120s 240m flye --nano-raw "$root/reads/input_long.fastq.gz" --meta --threads 4 --out-dir "$root/assembly/run" > "$root/logs/ASSEMBLY.log" 2>&1 ;;
          esac
          rc=$?
          set -e
          printf 'exit_code=%s\n' "$rc" > "$root/failure_audit/ASSEMBLY.status"
          test "$rc" -eq 0
          case "$assembler" in
            metaspades) fasta="$root/assembly/run/contigs.fasta" ;;
            megahit) fasta="$root/assembly/run/final.contigs.fa" ;;
            flye) fasta="$root/assembly/run/assembly.fasta" ;;
          esac
          test -s "$fasta"
          cp "$fasta" "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$method" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);method=sys.argv[2];p=root/'assembly/final_assembly.fasta'
          obj={'method':method,'assembly_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'assembly_bytes':p.stat().st_size,'truth_accessed':False,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'boundary':'Baseline assembly completed and hashed before holdout GSA access.'}
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
          rm -rf "$root/reads" "$root/assembly/run"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V7_HOLDOUT_BASELINE_${{ matrix.method }}_20260820
          path: baseline_${{ matrix.method }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  holdout:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_REF }}
          fetch-depth: 1
      - name: Download frozen v7 development decision
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEVELOPMENT_ARTIFACT }}
          path: upstream/development
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DEVELOPMENT_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V7_HOLDOUT_BASELINE_*_20260820
          path: upstream/baselines
          merge-multiple: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v7-holdout-evaluate
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            mash=2.3
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Isolate immutable baselines and verify exact frozen winner
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          mkdir -p "$root"/{inputs,candidates,alignments,variants,evaluation,pseudo,abundance,decision,submission,validation,truth_download,truth,provenance,logs,failure_audit}
          winner=$(find upstream/development -type f -name FROZEN_V7_SHORT_BACKBONE_WINNER.json -print -quit)
          test -s "$winner"
          cp "$winner" "$root/provenance/FROZEN_V7_SHORT_BACKBONE_WINNER.json"
          python - "$winner" "$root/provenance/WINNER_PARAMETERS.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text())
          assert x['status']=='V7_SHORT_BACKBONE_RULE_FROZEN_FOR_NEW_UNTOUCHED_PAIR',x
          assert x['winner']=='short_terminal_500_s1',x
          p=x['construction']['parameters']; expected={'mode':'terminal','min_candidate_length':500,'min_terminal_bp':500,'alignment_identity':0.97,'alignment_min_bp':500,'whole_max_aligned_fraction':0.30,'containment_fraction':0.98,'min_source_count':1,'single_target_terminal':True}
          actual={'mode':x['construction']['mode'],**p}
          for k,v in expected.items():assert actual[k]==v,(k,actual[k],v)
          Path(sys.argv[2]).write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          PY
          for d in upstream/baselines/LANTERN_CAMI3_V7_HOLDOUT_BASELINE_*_20260820; do
            method=${d##*BASELINE_};method=${method%_20260820}
            fasta=$(find "$d" -type f -name final_assembly.fasta -size +0c -print -quit)
            test -s "$fasta"
            cp "$fasta" "$root/inputs/${method}.fasta"
          done
          n=$(find "$root/inputs" -type f -name '*.fasta' | wc -l);test "$n" -eq 12
          seqkit stats -T "$root/inputs"/*.fasta > "$root/provenance/INPUT_ASSEMBLY_STATS.tsv"
          sha256sum "$root/inputs"/*.fasta > "$root/provenance/INPUT_ASSEMBLY_SHA256SUMS.txt"
          git rev-parse HEAD > "$root/provenance/RESEARCH_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          python --version > "$root/provenance/PYTHON_VERSION.txt"
          minimap2 --version > "$root/provenance/MINIMAP2_VERSION.txt"
          mash --version > "$root/provenance/MASH_VERSION.txt"
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'development_run=%s\ndevelopment_artifact=%s\nholdout_pair=18,19\ngold_accessed=false\n' "$DEVELOPMENT_RUN_ID" "$DEVELOPMENT_ARTIFACT" > "$root/provenance/UPSTREAM.txt"
          rm -rf upstream

      - name: Apply exact winner to pair and matched single-sample ablations
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          build_one() {
            local label="$1" suffix="$2"
            python lantern_v6/prepare_extension_candidates.py \
              --source "hybrid=$root/inputs/metaspades_hybrid_${suffix}.fasta" \
              --source "megahit=$root/inputs/megahit_short_${suffix}.fasta" \
              --source "flye=$root/inputs/flye_long_${suffix}.fasta" \
              --min-length 500 --max-n-fraction 0.05 --out "$root/candidates/$label" > "$root/logs/PREPARE_${label}.log" 2>&1
            minimap2 -x asm5 -c -N 100 -t 4 "$root/inputs/metaspades_short_${suffix}.fasta" "$root/candidates/$label/extension_candidates.fasta" > "$root/alignments/${label}.paf" 2> "$root/logs/ALIGN_${label}.log"
            python lantern_v6/extension_union.py \
              --backbone "$root/inputs/metaspades_short_${suffix}.fasta" \
              --candidates "$root/candidates/$label/extension_candidates.fasta" \
              --metadata "$root/candidates/$label/extension_candidate_metadata.tsv" \
              --candidate-to-backbone-paf "$root/alignments/${label}.paf" \
              --mode terminal --min-candidate-length 500 --min-terminal-bp 500 \
              --alignment-identity 0.97 --alignment-min-bp 500 --whole-max-aligned-fraction 0.30 \
              --containment-fraction 0.98 --min-source-count 1 --single-target-terminal \
              --out "$root/variants/$label" > "$root/logs/CONSTRUCT_${label}.log" 2>&1
            python lantern_cami3/scripts/verify_cami_assembly.py "$root/variants/$label/LANTERN_V6_EXTENSION_UNION.fasta" --out "$root/variants/$label/VALIDATION.json"
          }
          build_one pair pair
          build_one s18 s18
          build_one s19 s19

          python - "$root" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]);sources=[root/'variants/s18/LANTERN_V6_EXTENSION_UNION.fasta',root/'variants/s19/LANTERN_V6_EXTENSION_UNION.fasta'];seen=set();n=0;bp=0
          out=root/'variants/v7_no_longitudinal.fasta'
          with out.open('w') as fo:
              for src in sources:
                  name=None;parts=[]
                  for raw in src.open():
                      line=raw.strip()
                      if not line:continue
                      if line.startswith('>'):
                          if name is not None:
                              seq=''.join(parts);h=hashlib.sha256(seq.encode()).hexdigest()
                              if h not in seen:
                                  seen.add(h);n+=1;bp+=len(seq);fo.write(f'>V7_NL_{h[:20].upper()}\n');[fo.write(seq[i:i+80]+'\n') for i in range(0,len(seq),80)]
                          name=line[1:].split()[0];parts=[]
                      else:parts.append(line)
                  if name is not None:
                      seq=''.join(parts);h=hashlib.sha256(seq.encode()).hexdigest()
                      if h not in seen:
                          seen.add(h);n+=1;bp+=len(seq);fo.write(f'>V7_NL_{h[:20].upper()}\n');[fo.write(seq[i:i+80]+'\n') for i in range(0,len(seq),80)]
          (root/'variants/V7_NO_LONGITUDINAL_SUMMARY.txt').write_text(f'records={n}\nbp={bp}\n')
          PY
          cp "$root/inputs/metaspades_short_pair.fasta" "$root/variants/v7_no_extension.fasta"

          python lantern_v6/prepare_extension_candidates.py \
            --source "megahit=$root/inputs/megahit_short_pair.fasta" --min-length 500 --max-n-fraction 0.05 \
            --out "$root/candidates/no_long" > "$root/logs/PREPARE_NO_LONG.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/inputs/metaspades_short_pair.fasta" "$root/candidates/no_long/extension_candidates.fasta" > "$root/alignments/no_long.paf" 2> "$root/logs/ALIGN_NO_LONG.log"
          python lantern_v6/extension_union.py \
            --backbone "$root/inputs/metaspades_short_pair.fasta" --candidates "$root/candidates/no_long/extension_candidates.fasta" \
            --metadata "$root/candidates/no_long/extension_candidate_metadata.tsv" --candidate-to-backbone-paf "$root/alignments/no_long.paf" \
            --mode terminal --min-candidate-length 500 --min-terminal-bp 500 --alignment-identity 0.97 --alignment-min-bp 500 \
            --whole-max-aligned-fraction 0.30 --containment-fraction 0.98 --min-source-count 1 --single-target-terminal \
            --out "$root/variants/v7_no_long" > "$root/logs/CONSTRUCT_NO_LONG.log" 2>&1

          for fasta in "$root/variants/pair/LANTERN_V6_EXTENSION_UNION.fasta" "$root/variants/v7_no_longitudinal.fasta" "$root/variants/v7_no_extension.fasta" "$root/variants/v7_no_long/LANTERN_V6_EXTENSION_UNION.fasta"; do
            python lantern_cami3/scripts/verify_cami_assembly.py "$fasta" --out "${fasta}.validation.json"
          done

      - name: Freeze all holdout outputs before opening gold
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          python - "$root" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);paths={'v7_full':root/'variants/pair/LANTERN_V6_EXTENSION_UNION.fasta','v7_no_longitudinal':root/'variants/v7_no_longitudinal.fasta','v7_no_extension':root/'variants/v7_no_extension.fasta','v7_no_long':root/'variants/v7_no_long/LANTERN_V6_EXTENSION_UNION.fasta'}
          obj={'status':'V7_HOLDOUT_18_19_FROZEN_BEFORE_GOLD','holdout_pair':[18,19],'truth_accessed':False,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'outputs':{k:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for k,p in paths.items()},'winner_sha256':hashlib.sha256((root/'provenance/FROZEN_V7_SHORT_BACKBONE_WINNER.json').read_bytes()).hexdigest(),'boundary':'Exact frozen development rule and matched ablations were constructed and hashed before sample-18/19 GSA access.'}
          (root/'provenance/HOLDOUT_TRUTH_BLIND_FREEZE.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum "$root/provenance/HOLDOUT_TRUTH_BLIND_FREEZE.json" > "$root/provenance/HOLDOUT_FREEZE_SHA256.txt"

      - name: Open public holdout gold and evaluate all frozen methods
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          for s in 18 19; do curl -fsSL --retry 8 --retry-all-errors "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" -o "$root/truth_download/sample_${s}_gsa.tar.gz"; done
          sha256sum "$root/truth_download"/*.tar.gz > "$root/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py --gsa-tar "S18=$root/truth_download/sample_18_gsa.tar.gz" --gsa-tar "S19=$root/truth_download/sample_19_gsa.tar.gz" --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -I 4G -d "$root/truth/toy_truth.mmi" "$root/truth/combined_truth.fasta" > "$root/logs/TRUTH_INDEX.stdout" 2> "$root/logs/TRUTH_INDEX.log"
          cat > "$root/provenance/METHOD_MANIFEST.tsv" <<'EOF'
          method	role	mode	scope	ablation	eligible_primary_baseline
          metaspades_short_pair	baseline	short	longitudinal	none	true
          metaspades_hybrid_pair	baseline	hybrid	longitudinal	none	true
          megahit_short_pair	baseline	short	longitudinal	none	true
          flye_long_pair	baseline	long	longitudinal	none	true
          metaspades_short_s18	baseline	short	single	none	false
          metaspades_hybrid_s18	baseline	hybrid	single	none	false
          megahit_short_s18	baseline	short	single	none	false
          flye_long_s18	baseline	long	single	none	false
          metaspades_short_s19	baseline	short	single	none	false
          metaspades_hybrid_s19	baseline	hybrid	single	none	false
          megahit_short_s19	baseline	short	single	none	false
          flye_long_s19	baseline	long	single	none	false
          v7_full	lantern	hybrid	longitudinal	full	false
          v7_no_longitudinal	ablation	hybrid	single_union	no_longitudinal	false
          v7_no_extension	ablation	short	longitudinal	no_extension	false
          v7_no_long	ablation	short	longitudinal	no_long	false
          EOF
          printf 'method\tfasta\n' > "$root/provenance/EVALUATED_METHODS.tsv"
          for fasta in "$root/inputs"/*.fasta; do printf '%s\t%s\n' "$(basename "$fasta" .fasta)" "$fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"; done
          printf 'v7_full\t%s\n' "$root/variants/pair/LANTERN_V6_EXTENSION_UNION.fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"
          printf 'v7_no_longitudinal\t%s\n' "$root/variants/v7_no_longitudinal.fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"
          printf 'v7_no_extension\t%s\n' "$root/variants/v7_no_extension.fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"
          printf 'v7_no_long\t%s\n' "$root/variants/v7_no_long/LANTERN_V6_EXTENSION_UNION.fasta" >> "$root/provenance/EVALUATED_METHODS.tsv"
          tail -n +2 "$root/provenance/EVALUATED_METHODS.tsv" | while IFS=$'\t' read -r method fasta; do
            dir="$root/evaluation/$method";mkdir -p "$dir"
            minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/toy_truth.mmi" "$fasta" > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py --paf "$dir/assembly_to_truth.paf" --truth-mapping "$root/truth/truth_mapping.tsv" --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" > "$dir/evaluate.log" 2>&1
            rm -f "$dir/assembly_to_truth.paf"
          done

      - name: Build pseudo-novel and low-abundance tables
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          python - "$root" <<'PY'
          import csv,sys
          from pathlib import Path
          root=Path(sys.argv[1]);rows=list(csv.DictReader(open(root/'truth/genome_reference_manifest.tsv'),delimiter='\t'));paths=[]
          for row in rows:
              if int(row['truth_bp'])>=50000:
                  p=root/'truth/references'/Path(row['reference_path']).name
                  if p.is_file():paths.append(str(p))
          (root/'pseudo/mash_reference_files.txt').write_text('\n'.join(paths)+'\n')
          PY
          mash sketch -k 21 -s 1000 -l "$root/pseudo/mash_reference_files.txt" -o "$root/pseudo/truth_genomes" > "$root/logs/MASH_SKETCH.log" 2>&1
          mash dist "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genomes.msh" > "$root/pseudo/truth_genome_distances.tsv"
          recovery_args=();while IFS=$'\t' read -r method fasta;do test "$method" = method && continue;recovery_args+=(--recovery "$method=$root/evaluation/$method/per_genome_recovery.tsv");done < "$root/provenance/EVALUATED_METHODS.tsv"
          python lantern_cami3/scripts/build_pseudo_novel_audit.py --manifest "$root/truth/genome_reference_manifest.tsv" --mash "$root/pseudo/truth_genome_distances.tsv" "${recovery_args[@]}" --min-truth-bp 50000 --out "$root/pseudo/results" > "$root/logs/PSEUDO_NOVEL.log" 2>&1
          for s in 18 19; do python lantern_cami3/scripts/extract_read_abundance.py --url "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz" --sample-id "sample${s}" --paired --out "$root/abundance/sample${s}_abundance.tsv" > "$root/logs/ABUNDANCE_S${s}.log" 2>&1;done
          python lantern_cami3/scripts/summarize_abundance_recovery.py --abundance "$root/abundance/sample18_abundance.tsv" --abundance "$root/abundance/sample19_abundance.tsv" "${recovery_args[@]}" --low-percent 0.01 --high-percent 0.1 --out "$root/abundance/results" > "$root/logs/ABUNDANCE_SUMMARY.log" 2>&1

      - name: Apply unchanged strict gates and validate candidate submission
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=v7_holdout_18_19
          cat > "$root/provenance/HOLDOUT_CONFIG.json" <<'EOF'
          {
            "holdout_pair": [18, 19],
            "strict_success_gates": {
              "genome_fraction_gain_minimum_percentage_points": 0.5,
              "mean_genome_recovery_gain_minimum_percentage_points": 1.0,
              "low_abundance_gain_minimum_percentage_points": 2.0,
              "relative_cross_binid_chimera_increase_maximum": 0.10,
              "longitudinal_ablation_drop_minimum_percentage_points": 0.5
            },
            "claim_boundary": "Untouched public Toy participant-pair validation of the exact frozen v7 rule. This is not an official hidden CAMI III result or a novel-organism discovery."
          }
          EOF
          method_args=();while IFS=$'\t' read -r method fasta;do test "$method" = method && continue;method_args+=(--method "$method=$root/evaluation/$method");done < "$root/provenance/EVALUATED_METHODS.tsv"
          python lantern_cami3/scripts/evaluate_frozen_holdout.py "${method_args[@]}" --manifest "$root/provenance/METHOD_MANIFEST.tsv" --holdout-config "$root/provenance/HOLDOUT_CONFIG.json" --full-method v7_full --no-longitudinal-method v7_no_longitudinal --no-long-method v7_no_long --abundance-summary "$root/abundance/results/ABUNDANCE_STRATIFIED_SUMMARY.tsv" --pseudo-summary "$root/pseudo/results/PSEUDO_NOVEL_RECOVERY_SUMMARY.tsv" --seed "$SEED" --out "$root/decision" > "$root/logs/HOLDOUT_DECISION.log" 2>&1
          cp "$root/variants/pair/LANTERN_V6_EXTENSION_UNION.fasta" "$root/submission/LANTERN_V7_HOLDOUT_18_19.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/submission/LANTERN_V7_HOLDOUT_18_19.fasta" --out "$root/validation/SUBMISSION_FASTA_VALIDATION.json"
          sha256sum "$root/submission/LANTERN_V7_HOLDOUT_18_19.fasta" > "$root/validation/SUBMISSION_FASTA_SHA256.txt"
          cat "$root/decision/HOLDOUT_DECISION.md"

      - name: Independent audit and compact evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          root=v7_holdout_18_19
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('v7_holdout_18_19');errors=[]
          for rel in ['provenance/FROZEN_V7_SHORT_BACKBONE_WINNER.json','provenance/HOLDOUT_TRUTH_BLIND_FREEZE.json','decision/HOLDOUT_DECISION.json','validation/SUBMISSION_FASTA_VALIDATION.json','validation/SUBMISSION_FASTA_SHA256.txt']:
              if not (root/rel).is_file():errors.append(f'missing {rel}')
          decision=json.loads((root/'decision/HOLDOUT_DECISION.json').read_text()) if (root/'decision/HOLDOUT_DECISION.json').is_file() else {}
          validation=json.loads((root/'validation/SUBMISSION_FASTA_VALIDATION.json').read_text()) if (root/'validation/SUBMISSION_FASTA_VALIDATION.json').is_file() else {}
          if decision.get('holdout_pair')!=[18,19]:errors.append('pair mismatch')
          if decision.get('full_method')!='v7_full':errors.append('full method mismatch')
          if validation.get('status')!='PASS':errors.append('FASTA validation failed')
          audit={'status':'PASS' if not errors else 'FAIL','errors':errors,'decision_status':decision.get('status'),'strict_success':decision.get('strict_success'),'boundary':'Independent artifact consistency audit only.'}
          (root/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if errors:raise SystemExit(errors)
          PY
          rm -rf "$root/inputs" "$root/candidates" "$root/alignments" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/truth/toy_truth.mmi" "$root/pseudo/truth_genomes.msh" "$root/pseudo/truth_genome_distances.tsv"
          rm -rf "$root/variants/s18" "$root/variants/s19"
          find "$root" -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS_ALL.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V7_UNTOUCHED_HOLDOUT_18_19_20260820
          path: v7_holdout_18_19
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
