name: PR-visible RefSeq viral audit of Panax RdRP candidates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/panax-rdrp-refseq-audit-pr.yml'
      - 'virus_hunt/refseq_audit/**'
      - 'virus_hunt/validation_inputs/candidate_*.f*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panax-rdrp-refseq-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 pigz ncbi-blast+ mafft fasttree
          python -m pip install biopython==1.85
      - name: Download current RefSeq viral release, search, and build trees
        run: |
          set -euo pipefail
          rm -rf refseq_audit
          chmod +x virus_hunt/refseq_audit/run_refseq_audit.sh
          bash virus_hunt/refseq_audit/run_refseq_audit.sh \
            virus_hunt/validation_inputs/candidate_rdrp.faa \
            virus_hunt/validation_inputs/candidate_contigs.fna \
            refseq_audit \
            2>&1 | tee refseq_audit_console.log
          mv refseq_audit_console.log refseq_audit/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PANAX_RDRP_REFSEQ_VIRAL_AUDIT_20260818
          path: refseq_audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
