name: Bio open-problem smoke probe on crossdomain branch v1
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - '.github/workflows/bio-open-problem-probe-crossdomain-v1.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Run all eight bio/medical access and objective-truth probes
        env: {OUT_DIR: 'artifact/bio_probe'}
        run: python bio_open_problem/probe.py
      - name: Preserve code and hash outputs
        run: |
          cp bio_open_problem/probe.py artifact/bio_probe/
          find artifact/bio_probe -type f -print0 | sort -z | xargs -0 sha256sum > artifact/bio_probe/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bio-open-problem-probe-crossdomain-v1
          path: artifact/bio_probe
          retention-days: 30
          if-no-files-found: error
