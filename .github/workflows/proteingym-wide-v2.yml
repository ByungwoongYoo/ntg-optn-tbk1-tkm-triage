name: ProteinGym sealed wide-format ensemble v2
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_wide_v2.py'
      - '.github/workflows/proteingym-wide-v2.yml'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: pip install numpy pandas scipy scikit-learn
      - name: Download official ProteinGym resources
        run: |
          mkdir -p pg_data_v2 artifact/proteingym_wide_v2
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data_v2/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 -o pg_data_v2/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum \
            pg_data_v2/zero_shot_substitutions_scores.zip \
            pg_data_v2/DMS_substitutions.csv > artifact/resource_sha256.txt
          ls -lh pg_data_v2
      - name: Run sealed human-protein experiment
        run: |
          python bio_open_problem/proteingym_wide_v2.py \
            --score-zip pg_data_v2/zero_shot_substitutions_scores.zip \
            --reference pg_data_v2/DMS_substitutions.csv \
            --out-dir artifact/proteingym_wide_v2 \
            --human-only
      - name: Package results
        run: |
          cp bio_open_problem/proteingym_wide_v2.py artifact/
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('artifact')
          man={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  man[str(p.relative_to(root))]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'MANIFEST.json').write_text(json.dumps(man,indent=2))
          PY
          tar -czf artifact/proteingym_wide_v2_results.tar.gz \
            artifact/proteingym_wide_v2 artifact/resource_sha256.txt \
            artifact/proteingym_wide_v2.py artifact/MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: proteingym-wide-v2
          path: |
            artifact/proteingym_wide_v2
            artifact/resource_sha256.txt
            artifact/proteingym_wide_v2.py
            artifact/MANIFEST.json
            artifact/proteingym_wide_v2_results.tar.gz
          retention-days: 30
          if-no-files-found: error
