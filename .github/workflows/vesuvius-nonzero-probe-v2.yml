name: Vesuvius nonzero CT region probe v2
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/vesuvius_nonzero_probe_v2.py'
      - '.github/workflows/vesuvius-nonzero-probe-v2.yml'
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'zarr<3' fsspec s3fs numpy numcodecs
      - name: Deterministically locate a nonzero public CT region
        env: {OUT_DIR: 'artifact/vesuvius_v2'}
        run: python crossdomain/vesuvius_nonzero_probe_v2.py
      - run: |
          cp crossdomain/vesuvius_nonzero_probe_v2.py artifact/vesuvius_v2/
          find artifact/vesuvius_v2 -type f -print0 | sort -z | xargs -0 sha256sum > artifact/vesuvius_v2/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vesuvius-nonzero-probe-v2
          path: artifact/vesuvius_v2
          retention-days: 30
          if-no-files-found: error
