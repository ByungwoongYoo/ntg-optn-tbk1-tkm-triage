name: B2 gap2 gap3 v9 result collector 20260817
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - '.github/workflows/b2-gap23-v9-result-collector-20260817.yml'
permissions:
  actions: read
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: '32040180627'
    steps:
      - name: Download all source artifacts with GitHub CLI
        run: gh run download "$SOURCE_RUN_ID" --repo "$REPO" --dir downloaded
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Aggregate and independently audit all branch results
        shell: python
        run: |
          import csv,json,re
          from pathlib import Path
          rows=[]
          for d in Path('downloaded').iterdir():
              if not d.is_dir():continue
              m=re.fullmatch(r'b2-g([23])-t(\d+)-u-split-v9',d.name)
              if not m:continue
              status=(d/'STATUS.txt').read_text().strip()
              r=json.loads((d/'RESULT.json').read_text())
              audit=json.loads((d/'INDEPENDENT_AUDIT.json').read_text())
              g,t=map(int,m.groups())
              rows.append({'gap':g,'third':t,'status':status,'completed_exhaustively':r['completed_exhaustively'],'timed_out':r['timed_out'],'witness_found':r['witness_found'],'witness_verified':r['witness_verified'],'aggregate_nodes':r['aggregate_nodes_including_third_root'],'wall_seconds':r['wall_seconds'],'audit_status':audit['status'],'coverage_ok':audit['coverage_ok']})
          rows.sort(key=lambda x:(x['gap'],x['third']))
          expected={(2,t) for t in range(4,41)}|{(3,t) for t in range(6,36)}
          observed={(r['gap'],r['third']) for r in rows}
          assert observed==expected,(sorted(expected-observed),sorted(observed-expected))
          for r in rows:
              assert r['coverage_ok'] and r['status']==r['audit_status']
              if r['status']=='EXHAUSTED_NO_WITNESS':assert r['completed_exhaustively'] and not r['witness_found']
              if r['status']=='VERIFIED_WITNESS':assert r['witness_verified']
          counts={}
          for r in rows:counts[r['status']]=counts.get(r['status'],0)+1
          out=Path('artifact/b2_gap23_v9_summary');out.mkdir(parents=True,exist_ok=True)
          summary={'source_run':32040180627,'expected_branches':67,'observed_branches':len(rows),'counts':counts,'verified_witnesses':[r for r in rows if r['status']=='VERIFIED_WITNESS'],'incomplete':[r for r in rows if r['status']=='INCOMPLETE_TIMEOUT'],'all_exhausted_no_witness':all(r['status']=='EXHAUSTED_NO_WITNESS' for r in rows),'rows':rows}
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          with (out/'SUMMARY.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          (out/'SUMMARY.md').write_text('# B2 gap 2 and 3 v9 aggregate\n\n'+f'Counts: `{counts}`\n\nAll exhausted without witness: **{summary["all_exhausted_no_witness"]}**\n\nVerified witnesses: {len(summary["verified_witnesses"])}\n\nIncomplete: {[(r["gap"],r["third"]) for r in summary["incomplete"]]}\n',encoding='utf-8')
          print(json.dumps({'counts':counts,'all_exhausted_no_witness':summary['all_exhausted_no_witness'],'witnesses':len(summary['verified_witnesses']),'incomplete':[(r['gap'],r['third']) for r in summary['incomplete']]},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap23-v9-result-collector-20260817
          path: artifact/b2_gap23_v9_summary
          retention-days: 30
          if-no-files-found: error
