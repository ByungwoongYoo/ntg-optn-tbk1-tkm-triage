name: eBL candidate external asset fetch v5

on:
  workflow_dispatch:
  push:
    branches: ["crossdomain-open-problem-tournament-20260817-doit"]
    paths:
      - "crossdomain/ebl_external_asset_fetch_v5.py"
      - ".github/workflows/ebl-external-assets-v5.yml"

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download v4 asset metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data artifact/ebl_external_v5
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -o data/v4.zip https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9276552840/zip
          unzip -q data/v4.zip -d data/v4
          test -s data/v4/candidate_asset_metadata.json
      - name: Probe external asset endpoints
        run: |
          python crossdomain/ebl_external_asset_fetch_v5.py \
            --asset-metadata data/v4/candidate_asset_metadata.json \
            --out-dir artifact/ebl_external_v5 --top 3
      - name: Hash outputs
        run: |
          cp crossdomain/ebl_external_asset_fetch_v5.py artifact/ebl_external_v5/
          find artifact/ebl_external_v5 -type f -print0 | sort -z | xargs -0 sha256sum > artifact/ebl_external_v5/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ebl-external-assets-v5
          path: artifact/ebl_external_v5
          retention-days: 30
