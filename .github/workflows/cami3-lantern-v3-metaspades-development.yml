name: CAMI III LANTERN v3 metaSPAdes-backbone development

on:
  pull_request:
    branches: [cami3-lantern-v2-development-20260820]
    paths:
      - '.github/workflows/cami3-lantern-v3-metaspades-development.yml'
      - 'lantern_cami3/scripts/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  TRAINING_RUN_ID: '32285680577'
  TRAINING_ARTIFACT: 'LANTERN_CAMI3_TOY_SHORT_BENCHMARK_20260819'
  METASPADES_RUN_ID: '32305282819'
  METASPADES_ARTIFACT: 'LANTERN_CAMI3_CORRECTED_METASPADES_BASELINE_20260820'

jobs:
  develop-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen public-Toy training state
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TRAINING_ARTIFACT }}
          path: training_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAINING_RUN_ID }}

      - name: Download frozen corrected metaSPAdes backbone
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.METASPADES_ARTIFACT }}
          path: metaspades_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.METASPADES_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v3-development
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            tabulate
          cache-downloads: true
          post-cleanup: all

      - name: Locate immutable inputs and freeze development boundary
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          TRAIN=$(find training_artifact -type d -name lantern_short_benchmark | head -1)
          BACKBONE=$(find metaspades_artifact -type f -name METASPADES_PAIR.fasta | head -1)
          test -n "$TRAIN"; test -s "$BACKBONE"
          printf '%s\n' "$TRAIN" > /tmp/training_root
          printf '%s\n' "$BACKBONE" > /tmp/backbone_fasta
          mkdir -p v3_development/{alignments,development,best_assembly,validation,provenance,code_snapshot,configs,logs_summary,failure_audit}
          for f in \
            "$TRAIN/truth_blind/clusters/cluster_representatives.fasta" \
            "$TRAIN/truth_blind/clusters/representative_metadata.tsv" \
            "$TRAIN/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv" \
            "$TRAIN/truth/combined_truth.fasta" \
            "$TRAIN/truth/truth_mapping.tsv" \
            "$TRAIN/truth_blind/TRUTH_BLIND_FREEZE.json"; do test -s "$f"; done
          test -s metaspades_artifact/provenance/TRUTH_BLIND_BASELINE_FREEZE.json || \
            test -s "$(find metaspades_artifact -type f -name TRUTH_BLIND_BASELINE_FREEZE.json | head -1)"
          git rev-parse HEAD > v3_development/provenance/GIT_HEAD.txt
          uname -a > v3_development/provenance/UNAME.txt
          python --version > v3_development/provenance/PYTHON_VERSION.txt
          minimap2 --version > v3_development/provenance/MINIMAP2_VERSION.txt
          micromamba list > v3_development/provenance/MICROMAMBA_LIST.txt
          printf 'training_run=%s\ntraining_artifact=%s\nmetaspades_run=%s\nmetaspades_artifact=%s\npublic_training_pair=0,1\n' \
            "$TRAINING_RUN_ID" "$TRAINING_ARTIFACT" "$METASPADES_RUN_ID" "$METASPADES_ARTIFACT" \
            > v3_development/provenance/UPSTREAM.txt
          sha256sum "$BACKBONE" "$TRAIN/truth_blind/TRUTH_BLIND_FREEZE.json" \
            > v3_development/provenance/IMMUTABLE_INPUT_SHA256SUMS.txt
          cat > v3_development/provenance/DEVELOPMENT_BOUNDARY.md <<'EOF'
          # Development boundary

          Public CAMI III Toy samples 0 and 1 and their public gold standard are used only to select one metaSPAdes-backbone rescue configuration. The corrected metaSPAdes pair assembly was frozen before gold evaluation in its source workflow. Any selected v3 configuration has no external-validation status and must be committed unchanged before use on the officially corrected independent Toy individual pairs. Hidden CAMI challenge data are prohibited from tuning.
          EOF

      - name: Patch and snapshot the development implementation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cp lantern_cami3/scripts/develop_backbone_rescue_v2.py /tmp/develop_backbone_rescue_v3.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/develop_backbone_rescue_v3.py')
          s=p.read_text()
          s=s.replace('LANTERN v2 config','LANTERN v3 config')
          s=s.replace('LANTERN-backbone-rescue-v2','LANTERN-metaspades-backbone-rescue-v3')
          anchor='    selection = load_tsv(args.selection, "contig_id")\n'
          if anchor not in s: raise SystemExit('selection anchor missing')
          s=s.replace(anchor, anchor+'    backbone_hashes = {hashlib.sha256(seq.encode("ascii")).hexdigest() for seq in backbone.values()}\n',1)
          old='''            if keep and hashlib.sha256(seq.encode("ascii")).hexdigest() not in {\n                hashlib.sha256(value.encode("ascii")).hexdigest() for value in backbone.values()\n            }:\n'''
          new='''            if keep and hashlib.sha256(seq.encode("ascii")).hexdigest() not in backbone_hashes:\n'''
          if old not in s: raise SystemExit('hash optimization block missing')
          s=s.replace(old,new,1)
          if '"exclude_source_ids": ["megahit_pair"],' not in s: raise SystemExit('source exclusion anchor missing')
          s=s.replace('"exclude_source_ids": ["megahit_pair"],','"exclude_source_ids": [],',1)
          s=s.replace('"development_pair": "CAMI III Toy samples 0 and 1",','"development_pair": "CAMI III Toy official individual 1: samples 0 and 1",',1)
          s=s.replace('"LANTERN-backbone-rescue-v2-training-freeze-20260820"','"LANTERN-metaspades-backbone-rescue-v3-training-freeze-20260820"')
          p.write_text(s)
          PY
          python -m py_compile /tmp/develop_backbone_rescue_v3.py lantern_cami3/scripts/lantern_backbone_rescue.py
          cp /tmp/develop_backbone_rescue_v3.py v3_development/code_snapshot/develop_backbone_rescue_v3_EXECUTED.py
          cp lantern_cami3/scripts/{lantern_backbone_rescue.py,evaluate_gold_coverage.py,verify_cami_assembly.py,fasta_utils.py} v3_development/code_snapshot/
          sha256sum v3_development/code_snapshot/* > v3_development/provenance/EXECUTED_CODE_SHA256SUMS.txt

      - name: Align strong backbone and candidate pool once
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          TRAIN=$(cat /tmp/training_root); BACKBONE=$(cat /tmp/backbone_fasta)
          CAND="$TRAIN/truth_blind/clusters/cluster_representatives.fasta"
          TRUTH="$TRAIN/truth/combined_truth.fasta"
          minimap2 -x asm5 -c -N 100 -t 4 "$BACKBONE" "$CAND" \
            > v3_development/alignments/candidate_to_backbone.paf 2> v3_development/alignments/candidate_to_backbone.log
          minimap2 -x asm5 -c -N 100 -t 4 "$TRUTH" "$BACKBONE" \
            > v3_development/alignments/backbone_to_truth.paf 2> v3_development/alignments/backbone_to_truth.log
          minimap2 -x asm5 -c -N 100 -t 4 "$TRUTH" "$CAND" \
            > v3_development/alignments/candidate_to_truth.paf 2> v3_development/alignments/candidate_to_truth.log
          sha256sum v3_development/alignments/*.paf > v3_development/provenance/ALIGNMENT_SHA256SUMS.txt

      - name: Select one v3 training configuration across the fixed grid
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          TRAIN=$(cat /tmp/training_root); BACKBONE=$(cat /tmp/backbone_fasta)
          export PYTHONPATH="$PWD/lantern_cami3/scripts"
          python /tmp/develop_backbone_rescue_v3.py \
            --backbone-fasta "$BACKBONE" \
            --candidate-fasta "$TRAIN/truth_blind/clusters/cluster_representatives.fasta" \
            --selection "$TRAIN/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv" \
            --metadata "$TRAIN/truth_blind/clusters/representative_metadata.tsv" \
            --candidate-to-backbone-paf v3_development/alignments/candidate_to_backbone.paf \
            --backbone-to-truth-paf v3_development/alignments/backbone_to_truth.paf \
            --candidate-to-truth-paf v3_development/alignments/candidate_to_truth.paf \
            --truth-mapping "$TRAIN/truth/truth_mapping.tsv" \
            --seed 20260820 --bootstrap 5000 --out v3_development/development \
            2>&1 | tee v3_development/logs_summary/DEVELOPMENT_CONSOLE.log
          cp v3_development/development/LANTERN_BACKBONE_RESCUE_V2_CONFIG.json \
            v3_development/configs/LANTERN_METASPADES_BACKBONE_RESCUE_V3_CONFIG.json

      - name: Reconstruct and independently verify selected v3 assembly
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          TRAIN=$(cat /tmp/training_root); BACKBONE=$(cat /tmp/backbone_fasta)
          export PYTHONPATH="$PWD/lantern_cami3/scripts"
          python lantern_cami3/scripts/lantern_backbone_rescue.py \
            --backbone "$BACKBONE" \
            --candidate-fasta "$TRAIN/truth_blind/clusters/cluster_representatives.fasta" \
            --selection "$TRAIN/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv" \
            --metadata "$TRAIN/truth_blind/clusters/representative_metadata.tsv" \
            --candidate-to-backbone-paf v3_development/alignments/candidate_to_backbone.paf \
            --config v3_development/configs/LANTERN_METASPADES_BACKBONE_RESCUE_V3_CONFIG.json \
            --out v3_development/best_assembly 2>&1 | tee v3_development/logs_summary/CONSTRUCT_BEST.log
          python lantern_cami3/scripts/verify_cami_assembly.py \
            v3_development/best_assembly/LANTERN_BACKBONE_RESCUE.fasta \
            --out v3_development/validation/LANTERN_V3_FASTA_VALIDATION.json
          minimap2 -x asm5 -c -N 100 -t 4 "$TRAIN/truth/combined_truth.fasta" \
            v3_development/best_assembly/LANTERN_BACKBONE_RESCUE.fasta \
            > v3_development/validation/final_to_truth.paf 2> v3_development/validation/final_to_truth.log
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf v3_development/validation/final_to_truth.paf \
            --truth-mapping "$TRAIN/truth/truth_mapping.tsv" \
            --assembly-fasta v3_development/best_assembly/LANTERN_BACKBONE_RESCUE.fasta \
            --min-identity 0.90 --min-alignment 500 --out v3_development/validation/exact_final \
            > v3_development/logs_summary/EXACT_FINAL_EVALUATION.log
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          dev=json.loads(Path('v3_development/development/V2_DEVELOPMENT_DECISION.json').read_text())
          exact=json.loads(Path('v3_development/validation/exact_final/GOLD_COVERAGE_SUMMARY.json').read_text())
          selected=dev['best_training_result']
          diff=abs(selected['genome_fraction_percent']-exact['genome_fraction_percent'])
          audit={'status':'PASS' if diff<=1e-8 else 'FAIL','selected_config_id':selected['config_id'],'analytic_genome_fraction_percent':selected['genome_fraction_percent'],'exact_genome_fraction_percent':exact['genome_fraction_percent'],'absolute_difference':diff,'training_gain_percentage_points':selected['genome_fraction_gain_percentage_points'],'training_bootstrap_95_ci':[selected['paired_bootstrap_95_ci_low'],selected['paired_bootstrap_95_ci_high']],'external_validation_required':True}
          Path('v3_development/validation/ANALYTIC_EXACT_RECONCILIATION.json').write_text(json.dumps(audit,indent=2)+'\n')
          cfg=Path('v3_development/configs/LANTERN_METASPADES_BACKBONE_RESCUE_V3_CONFIG.json'); fa=Path('v3_development/best_assembly/LANTERN_BACKBONE_RESCUE.fasta')
          freeze={'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'config_sha256':hashlib.sha256(cfg.read_bytes()).hexdigest(),'training_assembly_sha256':hashlib.sha256(fa.read_bytes()).hexdigest(),'training_pair':[0,1],'backbone':'corrected metaSPAdes pair assembly','external_validation_required':True,'boundary':'Training-selected v3 config; no held-out performance established.'}
          Path('v3_development/provenance/V3_TRAINING_FREEZE.json').write_text(json.dumps(freeze,indent=2)+'\n')
          if audit['status']!='PASS': raise SystemExit('analytic/exact mismatch')
          print(json.dumps(audit,indent=2))
          PY
          sha256sum v3_development/configs/LANTERN_METASPADES_BACKBONE_RESCUE_V3_CONFIG.json \
                    v3_development/best_assembly/LANTERN_BACKBONE_RESCUE.fasta \
            > v3_development/provenance/V3_TRAINING_FREEZE_SHA256SUMS.txt

      - name: Compact and hash v3 development evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          rm -rf v3_development/alignments
          rm -f v3_development/validation/final_to_truth.paf
          find v3_development -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > v3_development/SHA256SUMS.txt || true
          du -ah v3_development | sort -h > v3_development/FILE_SIZES.txt || true

      - name: Upload compact v3 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V3_METASPADES_BACKBONE_DEVELOPMENT_20260820
          path: v3_development
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
