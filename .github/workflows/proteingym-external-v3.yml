name: ProteinGym frozen ensemble external validation v3
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_external_v3.py'
      - '.github/workflows/proteingym-external-v3.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn
      - name: Download official score matrix and reference
        run: |
          mkdir -p pg_data_v3 artifact/proteingym_external_v3
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data_v3/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 -o pg_data_v3/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum pg_data_v3/zero_shot_substitutions_scores.zip pg_data_v3/DMS_substitutions.csv > artifact/resource_sha256_v3.txt
      - name: Run frozen human-trained model on untouched non-human assays
        run: |
          PYTHONPATH=bio_open_problem python bio_open_problem/proteingym_external_v3.py \
            --score-zip pg_data_v3/zero_shot_substitutions_scores.zip \
            --reference pg_data_v3/DMS_substitutions.csv \
            --out-dir artifact/proteingym_external_v3
      - name: Package
        run: |
          cp bio_open_problem/proteingym_external_v3.py bio_open_problem/proteingym_wide_v2.py artifact/
          tar -czf artifact/proteingym_external_v3_results.tar.gz \
            artifact/proteingym_external_v3 artifact/resource_sha256_v3.txt \
            artifact/proteingym_external_v3.py artifact/proteingym_wide_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: proteingym-external-v3
          path: |
            artifact/proteingym_external_v3
            artifact/resource_sha256_v3.txt
            artifact/proteingym_external_v3.py
            artifact/proteingym_wide_v2.py
            artifact/proteingym_external_v3_results.tar.gz
          retention-days: 30
          if-no-files-found: error
