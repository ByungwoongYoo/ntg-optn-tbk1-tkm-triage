name: Kleborate-filtered deep-residual K. pneumoniae colistin targeted GWAS

on:
  pull_request:
    branches: [amr-kp-colistin-genome-audit-20260819]
    paths:
      - '.github/workflows/amr-kp-colistin-deep-residual-targeted-gwas.yml'
      - 'amr_discovery/prepare_colistin_gwas_inputs.py'
      - 'amr_discovery/evaluate_colistin_gwas.py'
      - 'amr_discovery/tighten_colistin_gwas_gate.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V4_RUN_ID: '32214559594'
  V4_ARTIFACT: 'KP_COLISTIN_TARGETED_GWAS_20260819_V4_BIOPROJECT_FIXED'
  CORE_RUN_ID: '32209530341'
  CORE_ARTIFACT: 'KP_COLISTIN_CORE_KLEBORATE_AUDIT_20260819'

jobs:
  deep-residual-targeted-gwas:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download complete targeted matrix and BioProject metadata
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V4_ARTIFACT }}
          path: v4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V4_RUN_ID }}

      - name: Download independent sequence-level known-mechanism audit
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CORE_ARTIFACT }}
          path: core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORE_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: deep-residual
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11 pandas=2.3.1 scipy scikit-learn pyseer tabulate=0.9.0
          cache-downloads: true
          post-cleanup: all

      - name: Freeze deep-residual cohort and reconstruct true BioProject holdout
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p deep/provenance deep/dummy_assemblies
          cp core/summary/residual_matched_sequence_audit_cohort.csv deep/deep_residual_input.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          x=pd.read_csv('deep/deep_residual_input.csv',dtype={'assembly_ID':str})
          assert x.assembly_ID.is_unique
          assert x.phenotype.value_counts().to_dict()=={'R':222,'S':222}
          assert not x.has_kleborate_known_colistin_evidence.fillna(False).astype(bool).any()
          matrix=pd.read_csv('v4/targeted_variants/targeted_variants.Rtab',sep='\t',nrows=0)
          available=set(matrix.columns[1:])
          x=x[x.assembly_ID.isin(available)].copy()
          x.to_csv('deep/deep_residual_matrix_available.csv',index=False)
          for acc in x.assembly_ID:
              (Path('deep/dummy_assemblies')/f'{acc}.fna').touch()
          print(x.phenotype.value_counts())
          print('matrix_available',len(x))
          PY
          python amr_discovery/prepare_colistin_gwas_inputs.py \
            --metadata deep/deep_residual_matrix_available.csv \
            --rtab v4/targeted_variants/targeted_variants.Rtab \
            --assembly-report v4/assembly_data_report.jsonl \
            --assemblies-dir deep/dummy_assemblies \
            --out deep/gwas_inputs \
            --validation-fraction 0.30 --seed 20260819 --min-class 25 \
            2>&1 | tee deep/input_console.log
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('deep/gwas_inputs/GWAS_INPUT_SUMMARY.json').read_text())
          if s['primary_bioproject_coverage']<0.95 or not s['group_disjoint']:
              raise SystemExit(f'Invalid BioProject split: {s}')
          if min(s['class_counts_validation'].values())<25:
              raise SystemExit(f'Validation class too small: {s}')
          print(json.dumps(s,indent=2))
          PY
          rm -rf deep/dummy_assemblies
          git rev-parse HEAD > deep/provenance/GIT_HEAD.txt
          printf 'v4_run=%s\nv4_artifact=%s\ncore_run=%s\ncore_artifact=%s\n' "$V4_RUN_ID" "$V4_ARTIFACT" "$CORE_RUN_ID" "$CORE_ARTIFACT" > deep/provenance/UPSTREAM.txt
          python --version > deep/provenance/PYTHON_VERSION.txt
          pyseer --version > deep/provenance/PYSEER_VERSION.txt
          micromamba list > deep/provenance/MICROMAMBA_LIST.txt

      - name: Subset exact Mash matrices
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p deep/structure
          python - <<'PY'
          import pandas as pd
          allx=pd.read_csv('v4/structure/all_mash.tsv',sep='\t',index_col=0)
          allx.index=allx.index.astype(str); allx.columns=allx.columns.astype(str)
          m=pd.read_csv('deep/gwas_inputs/gwas_sample_manifest.csv',dtype={'assembly_ID':str})
          ids=m.assembly_ID.tolist(); disc=m.loc[m.split.eq('discovery'),'assembly_ID'].tolist()
          missing=set(ids)-set(allx.index)
          if missing: raise SystemExit(f'Missing Mash IDs: {sorted(missing)[:20]}')
          allx.loc[ids,ids].to_csv('deep/structure/all_mash.tsv',sep='\t')
          allx.loc[disc,disc].to_csv('deep/structure/discovery_mash.tsv',sep='\t')
          PY

      - name: Run deep-residual population-structure models
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p deep/pyseer
          for dim in 10 20 30; do
            pyseer --phenotypes deep/gwas_inputs/discovery_phenotypes.tsv --pres deep/gwas_inputs/discovery_variants.Rtab \
              --distances deep/structure/discovery_mash.tsv --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 1 --print-samples --output-patterns "deep/pyseer/discovery_dim${dim}.patterns" \
              > "deep/pyseer/discovery_dim${dim}.tsv" 2> "deep/pyseer/discovery_dim${dim}.log"
            pyseer --phenotypes deep/gwas_inputs/all_phenotypes.tsv --pres deep/gwas_inputs/all_variants.Rtab \
              --distances deep/structure/all_mash.tsv --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 1 --print-samples --output-patterns "deep/pyseer/all_dim${dim}.patterns" \
              > "deep/pyseer/all_dim${dim}.tsv" 2> "deep/pyseer/all_dim${dim}.log"
          done

      - name: Apply held-out, source, country, and multiplicity gates
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python amr_discovery/evaluate_colistin_gwas.py \
            --manifest deep/gwas_inputs/gwas_sample_manifest.csv \
            --rtab deep/gwas_inputs/all_variants.Rtab \
            --feature-meta v4/targeted_variants/targeted_variant_metadata.csv \
            --discovery deep/pyseer/discovery_dim10.tsv deep/pyseer/discovery_dim20.tsv deep/pyseer/discovery_dim30.tsv \
            --whole deep/pyseer/all_dim10.tsv deep/pyseer/all_dim20.tsv deep/pyseer/all_dim30.tsv \
            --out deep/evaluation 2>&1 | tee deep/evaluation_console.log
          python amr_discovery/tighten_colistin_gwas_gate.py \
            --evidence deep/evaluation/ALL_MARKER_EVIDENCE.csv \
            --meta-details deep/evaluation/MARKER_META_ANALYSIS_DETAILS.json \
            --out deep/final_gate 2>&1 | tee deep/final_gate_console.log

      - name: Finalize deep-residual hashes
        if: always()
        shell: micromamba-shell {0}
        run: |
          rm -f deep/SHA256SUMS_ALL.txt
          find deep -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > deep/SHA256SUMS_ALL.txt || true
          du -ah deep | sort -h | tail -200 > deep/FILE_SIZES.txt || true

      - name: Upload deep-residual targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KP_COLISTIN_DEEP_RESIDUAL_TARGETED_GWAS_20260819
          path: deep
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
