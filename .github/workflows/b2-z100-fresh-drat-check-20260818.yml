name: B2 Z100 fresh DRAT clean-room check 20260818
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - '.github/workflows/b2-z100-fresh-drat-check-20260818.yml'

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      POINTER: crossdomain/B2_FRESH_DRAT_LATEST_RUN.json
    steps:
      - uses: actions/checkout@v4
      - name: Publish run pointer
        run: |
          printf '{"run_id":%s,"status":"running","commit":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > pointer.json
          encoded=$(base64 -w0 pointer.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${POINTER}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${POINTER}" -f message="Record B2 fresh DRAT run ${GITHUB_RUN_ID}" -f content="$encoded" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
      - name: Download the four original proof artifacts
        run: |
          set -euo pipefail
          mkdir -p proofs
          for pair in 4:9279813096 5:9291076270 6:9291072827 7:9291073263; do
            g=${pair%%:*}; id=${pair##*:}
            mkdir -p "proofs/g${g}"
            curl -fL --retry 30 --retry-all-errors --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "proofs/g${g}.zip"
            unzip -q "proofs/g${g}.zip" -d "proofs/g${g}"
            rm "proofs/g${g}.zip"
          done
      - name: Build a fresh drat-trim and verify every included proof
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git drat-trim
          make -C drat-trim -j"$(nproc)"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_image=${ImageOS:-unknown}"
            uname -a
            cc --version | head -1
            echo "drat_trim_commit=$(git -C drat-trim rev-parse HEAD)"
          } > FRESH_DRAT_ENVIRONMENT.txt
          : > FRESH_DRAT_VERIFICATION.log
          for g in 4 5 6 7; do
            cnf=$(find "proofs/g${g}" -name "gap${g}.cnf" -type f -print -quit)
            prf=$(find "proofs/g${g}" -name "gap${g}.drat" -type f -print -quit)
            test -n "$cnf" -a -n "$prf"
            echo "=== gap ${g} ===" | tee -a FRESH_DRAT_VERIFICATION.log
            ./drat-trim/drat-trim "$cnf" "$prf" > "g${g}.fresh.log" 2>&1
            cat "g${g}.fresh.log" >> FRESH_DRAT_VERIFICATION.log
            grep -q 'VERIFIED' "g${g}.fresh.log"
            sha256sum "$cnf" "$prf" >> FRESH_DRAT_VERIFICATION.log
          done
          echo VERIFIED_ALL_G4_G7_DRAT | tee -a FRESH_DRAT_VERIFICATION.log
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: B2-Z100-FRESH-DRAT-CHECK-20260818
          path: |
            FRESH_DRAT_VERIFICATION.log
            FRESH_DRAT_ENVIRONMENT.txt
            g4.fresh.log
            g5.fresh.log
            g6.fresh.log
            g7.fresh.log
          retention-days: 90
          if-no-files-found: error
      - name: Publish completed pointer
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf '{"run_id":%s,"status":"completed","conclusion":"success","commit":"%s","artifact_id":%s,"artifact_digest":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" > pointer.json
          encoded=$(base64 -w0 pointer.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${POINTER}?ref=${GITHUB_REF_NAME}" --jq .sha)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${POINTER}" -f message="Complete B2 fresh DRAT run ${GITHUB_RUN_ID}" -f content="$encoded" -f branch="${GITHUB_REF_NAME}" -f sha="$sha" >/dev/null
