name: Repair and dispatch CAMI III LANTERN v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-v4-repair.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Patch robust artifact discovery without changing frozen science
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cami3-lantern-hybrid-v4-development.yml')
          text = path.read_text()

          old = r'''          backbone=$(find inputs/hybrid_raw -type f -path '*/assembly/out/contigs.fasta' | head -1)
          megahit=$(find inputs/megahit_raw -type f -path '*/assembly/out/final.contigs.fa' | head -1)
          metashort=$(find inputs/metaspades_short_raw -type f -path '*/assembly/out/contigs.fasta' | head -1)
          flyepair=$(find inputs/flye_pair_raw -type f -path '*/assembly/out/assembly.fasta' | head -1)
          flyes0=$(find inputs/flye_single_raw -type f -path '*/multimodal_flye_long_s0/assembly/out/assembly.fasta' | head -1)
          flyes1=$(find inputs/flye_single_raw -type f -path '*/multimodal_flye_long_s1/assembly/out/assembly.fasta' | head -1)
          for f in "$backbone" "$megahit" "$metashort" "$flyepair" "$flyes0" "$flyes1"; do test -s "$f"; done
'''

          new = r'''          # Artifact directory layouts differ by actions/download-artifact mode. Resolve
          # only non-empty, pre-existing FASTA files. Flye timepoint S0 did not
          # produce a final assembly, so a non-empty consensus/repeat-graph FASTA is
          # allowed strictly as an auxiliary candidate source and is recorded as a
          # fallback; it is never represented as a completed Flye assembly.
          pick_required_fasta() {
            local root="$1"; shift
            local pattern candidate
            for pattern in "$@"; do
              candidate=$(find "$root" -type f -path "$pattern" -size +0c -print -quit)
              if [[ -n "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          flye_status() {
            case "$1" in
              */assembly/out/assembly.fasta) printf 'final_assembly\n' ;;
              */assembly/out/10-consensus/consensus.fasta) printf 'consensus_fallback_from_incomplete_run\n' ;;
              */assembly/out/20-repeat/repeat_graph_edges.fasta) printf 'repeat_graph_fallback_from_incomplete_run\n' ;;
              *) printf 'unclassified\n' ;;
            esac
          }

          backbone=$(pick_required_fasta inputs/hybrid_raw '*/assembly/out/contigs.fasta')
          megahit=$(pick_required_fasta inputs/megahit_raw '*/assembly/out/final.contigs.fa')
          metashort=$(pick_required_fasta inputs/metaspades_short_raw '*/assembly/out/contigs.fasta')
          flyepair=$(pick_required_fasta inputs/flye_pair_raw '*/assembly/out/assembly.fasta')
          flyes0=$(pick_required_fasta inputs/flye_single_raw \
            '*flye_long_s0*/assembly/out/assembly.fasta' \
            '*flye_long_s0*/assembly/out/10-consensus/consensus.fasta' \
            '*flye_long_s0*/assembly/out/20-repeat/repeat_graph_edges.fasta')
          flyes1=$(pick_required_fasta inputs/flye_single_raw \
            '*flye_long_s1*/assembly/out/assembly.fasta' \
            '*flye_long_s1*/assembly/out/10-consensus/consensus.fasta' \
            '*flye_long_s1*/assembly/out/20-repeat/repeat_graph_edges.fasta')

          flyes0_status=$(flye_status "$flyes0")
          flyes1_status=$(flye_status "$flyes1")
          printf 'logical_source\tselected_path\tstatus\n' > "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'metaspades_hybrid_backbone\t%s\tfinal_assembly\n' "$backbone" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'megahit_short_pair\t%s\tfinal_assembly\n' "$megahit" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'metaspades_short_pair\t%s\tfinal_assembly\n' "$metashort" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'flye_long_pair\t%s\tfinal_assembly\n' "$flyepair" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'flye_long_s0\t%s\t%s\n' "$flyes0" "$flyes0_status" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
          printf 'flye_long_s1\t%s\t%s\n' "$flyes1" "$flyes1_status" >> "$ROOT/provenance/AUXILIARY_FASTA_SELECTION.tsv"
'''

          if old in text:
              text = text.replace(old, new, 1)
          elif 'pick_required_fasta()' not in text:
              raise SystemExit('expected v4 discovery block not found and robust repair not present')

          old_read = r'''            read_dir=$(dirname "$(find inputs/read_artifacts -type f -name "S${s}_R1.fastq.gz" | head -1)")'''
          new_read = r'''            read_dir=$(dirname "$(find inputs/read_artifacts -type f -name "S${s}_R1.fastq.gz" -print -quit)")'''
          if old_read in text:
              text = text.replace(old_read, new_read, 1)

          if 'AUXILIARY_FASTA_SELECTION.tsv' not in text:
              raise SystemExit('repair did not install auxiliary FASTA provenance')
          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/cami3-lantern-hybrid-v4-development.yml

      - name: Commit repaired execution wrapper
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'LANTERN execution bot'
          git config user.email 'yoonge3@gmail.com'
          git add .github/workflows/cami3-lantern-hybrid-v4-development.yml
          if git diff --cached --quiet; then
            echo 'repair already present'
          else
            git commit -m 'Allow audited Flye fallback FASTA in v4 development'
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Dispatch corrected v4 workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run cami3-lantern-hybrid-v4-development.yml --repo "$REPO" --ref "$REF"
          sleep 15
          gh run list --repo "$REPO" --workflow cami3-lantern-hybrid-v4-development.yml \
            --branch "$REF" --limit 5 --json databaseId,status,conclusion,url,headSha,createdAt \
            | tee V4_REPAIR_DISPATCH_RUNS.json
