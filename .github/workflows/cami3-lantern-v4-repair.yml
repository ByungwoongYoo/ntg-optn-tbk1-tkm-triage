name: Repair and dispatch CAMI III LANTERN v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-v4-repair.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair v4 workflow text and validate YAML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/cami3-lantern-hybrid-v4-development.yml')
          text=path.read_text()

          replacements={
          """\nsource_id\tassembler\tscope\tmode\nmegahit_short_pair\tmegahit\tlongitudinal\tshort\nmetaspades_short_pair\tmetaspades\tlongitudinal\tshort\nflye_long_pair\tflye\tlongitudinal\tlong\nflye_long_s0\tflye\ttimepoint_support\tlong\nflye_long_s1\tflye\ttimepoint_support\tlong\nEOF\n""":
          """\n          source_id\tassembler\tscope\tmode\n          megahit_short_pair\tmegahit\tlongitudinal\tshort\n          metaspades_short_pair\tmetaspades\tlongitudinal\tshort\n          flye_long_pair\tflye\tlongitudinal\tlong\n          flye_long_s0\tflye\ttimepoint_support\tlong\n          flye_long_s1\tflye\ttimepoint_support\tlong\n          EOF\n""",
          """winner=$(python - <<'PY'\nimport json\nx=json.load(open('v4_hybrid_development/decision/V4_DEVELOPMENT_FREEZE.json'))\nprint(x.get('winner_name',''))\nPY\n""":
          """winner=$(python - <<'PY'\n          import json\n          x=json.load(open('v4_hybrid_development/decision/V4_DEVELOPMENT_FREEZE.json'))\n          print(x.get('winner_name',''))\n          PY\n""",
          """          python - <<'PY'\nimport json\nfrom pathlib import Path\nroot=Path('v4_hybrid_development'); errors=[]\nfreeze=root/'provenance/V4_TRUTH_BLIND_FREEZE.json'; decision=root/'decision/V4_DEVELOPMENT_FREEZE.json'\nif not freeze.is_file(): errors.append('truth-blind freeze missing')\nif not decision.is_file(): errors.append('development decision missing')\nif freeze.is_file() and json.loads(freeze.read_text()).get('truth_accessed') is not False: errors.append('freeze boundary invalid')\nif decision.is_file():\n    d=json.loads(decision.read_text())\n    if d.get('winner_name') and not (root/'decision/FROZEN_V4_WINNER_CONFIG.json').is_file(): errors.append('winner config missing')\naudit={'status':'PASS' if not errors else 'INCOMPLETE','errors':errors,'claim_boundary':'Public Toy development audit only; no active CAMI challenge data or rank.'}\n(root/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2)+'\\n')\nPY\n""":
          """          python - <<'PY'\n          import json\n          from pathlib import Path\n          root=Path('v4_hybrid_development'); errors=[]\n          freeze=root/'provenance/V4_TRUTH_BLIND_FREEZE.json'; decision=root/'decision/V4_DEVELOPMENT_FREEZE.json'\n          if not freeze.is_file(): errors.append('truth-blind freeze missing')\n          if not decision.is_file(): errors.append('development decision missing')\n          if freeze.is_file() and json.loads(freeze.read_text()).get('truth_accessed') is not False: errors.append('freeze boundary invalid')\n          if decision.is_file():\n              d=json.loads(decision.read_text())\n              if d.get('winner_name') and not (root/'decision/FROZEN_V4_WINNER_CONFIG.json').is_file(): errors.append('winner config missing')\n          audit={'status':'PASS' if not errors else 'INCOMPLETE','errors':errors,'claim_boundary':'Public Toy development audit only; no active CAMI challenge data or rank.'}\n          (root/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2)+'\\n')\n          PY\n"""
          }
          for old,new in replacements.items():
              text=text.replace(old,new)
          if 'pick_required_fasta()' not in text:
              raise SystemExit('robust v4 artifact resolver missing')
          path.write_text(text)
          PY
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/cami3-lantern-hybrid-v4-development.yml')
          obj=yaml.safe_load(p.read_text())
          if not isinstance(obj,dict) or 'jobs' not in obj:
              raise SystemExit('invalid workflow object')
          print('V4_WORKFLOW_YAML_VALID')
          PY
          git diff --check
          git diff -- .github/workflows/cami3-lantern-hybrid-v4-development.yml

      - name: Commit repaired v4 workflow
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'LANTERN execution bot'
          git config user.email 'yoonge3@gmail.com'
          git add .github/workflows/cami3-lantern-hybrid-v4-development.yml
          if git diff --cached --quiet; then
            echo 'repair already present'
          else
            git commit -m 'Validate and repair v4 workflow YAML'
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Dispatch corrected v4 workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run cami3-lantern-hybrid-v4-development.yml --repo "$REPO" --ref "$REF"
          sleep 15
          gh run list --repo "$REPO" --workflow cami3-lantern-hybrid-v4-development.yml \
            --branch "$REF" --limit 5 --json databaseId,status,conclusion,url,headSha,createdAt \
            | tee V4_REPAIR_DISPATCH_RUNS.json
