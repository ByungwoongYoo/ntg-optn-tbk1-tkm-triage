name: ProteinGym vectorized family fixed audit v12b
on:
  workflow_dispatch:
  push:
    branches: [missense-family-gating-20260817]
    paths:
      - 'bio_open_problem/proteingym_family_fixed_fast_v12b.py'
      - '.github/workflows/proteingym-family-fixed-fast-v12b.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy scikit-learn
      - name: Install MMseqs2
        run: |
          if ! sudo apt-get update || ! sudo apt-get install -y mmseqs2; then
            curl -L --fail --retry 5 -o /tmp/mmseqs.tar.gz https://mmseqs.com/latest/mmseqs-linux-avx2.tar.gz
            tar -xzf /tmp/mmseqs.tar.gz -C /tmp
            echo '/tmp/mmseqs/bin' >> "$GITHUB_PATH"
          fi
      - name: Download and prepare official data
        run: |
          mkdir -p v12b_data artifact/fixed_fast_v12b/prepare artifact/fixed_fast_v12b/mmseqs/tmp artifact/fixed_fast_v12b/result
          curl -L --fail --retry 8 --retry-delay 5 -o v12b_data/clinical.zip https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_clinical_substitutions_scores.zip
          python bio_open_problem/clinical_family_prepare_v12.py --clinical-score-zip v12b_data/clinical.zip --out-dir artifact/fixed_fast_v12b/prepare
          mmseqs easy-search artifact/fixed_fast_v12b/prepare/clinical_sequences.fasta artifact/fixed_fast_v12b/prepare/clinical_sequences.fasta artifact/fixed_fast_v12b/mmseqs/global30_cov80.tsv artifact/fixed_fast_v12b/mmseqs/tmp --search-type 1 --min-seq-id 0.30 -c 0.80 --cov-mode 0 -s 7.5 --max-seqs 10000 --format-output 'query,target,fident,qcov,tcov,evalue,bits'
      - name: Run vectorized audit
        run: |
          PYTHONPATH=bio_open_problem python bio_open_problem/proteingym_family_fixed_fast_v12b.py --clinical-score-zip v12b_data/clinical.zip --sequence-inventory artifact/fixed_fast_v12b/prepare/sequence_inventory.csv --edge artifact/fixed_fast_v12b/mmseqs/global30_cov80.tsv --out-dir artifact/fixed_fast_v12b/result
      - name: Package
        run: |
          rm -rf artifact/fixed_fast_v12b/mmseqs/tmp
          cp bio_open_problem/clinical_family_prepare_v12.py bio_open_problem/proteingym_family_gating_v12.py bio_open_problem/proteingym_family_fixed_fast_v12b.py artifact/fixed_fast_v12b/
          tar -czf artifact/proteingym_family_fixed_fast_v12b.tar.gz -C artifact fixed_fast_v12b
      - uses: actions/upload-artifact@v4
        with:
          name: proteingym-family-fixed-fast-v12b
          path: |
            artifact/fixed_fast_v12b
            artifact/proteingym_family_fixed_fast_v12b.tar.gz
          retention-days: 30
          if-no-files-found: error
