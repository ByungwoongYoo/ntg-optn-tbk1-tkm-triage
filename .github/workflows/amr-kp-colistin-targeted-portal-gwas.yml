name: Parallel portal-residual K. pneumoniae colistin targeted GWAS

on:
  pull_request:
    branches: [amr-kp-colistin-genome-audit-20260819]
    paths:
      - '.github/workflows/amr-kp-colistin-targeted-portal-gwas.yml'
      - 'amr_discovery/build_colistin_variant_matrix.py'
      - 'amr_discovery/prepare_colistin_gwas_inputs.py'
      - 'amr_discovery/evaluate_colistin_gwas.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-portal-gwas:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: amr-targeted-portal
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            duckdb=1.3.2
            pandas=2.3.1
            pyarrow=21.0.0
            requests=2.32.5
            scipy
            scikit-learn
            biopython
            blast
            mash
            pyseer
            ncbi-datasets-cli
            tabulate=0.9.0
          cache-downloads: true
          post-cleanup: all

      - name: Record provenance
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p targeted_gwas/provenance
          uname -a > targeted_gwas/provenance/UNAME.txt
          python --version > targeted_gwas/provenance/PYTHON_VERSION.txt
          datasets version > targeted_gwas/provenance/DATASETS_VERSION.txt
          tblastn -version > targeted_gwas/provenance/BLAST_VERSION.txt
          mash --version > targeted_gwas/provenance/MASH_VERSION.txt
          pyseer --version > targeted_gwas/provenance/PYSEER_VERSION.txt
          micromamba list > targeted_gwas/provenance/MICROMAMBA_LIST.txt
          git rev-parse HEAD > targeted_gwas/provenance/GIT_HEAD.txt

      - name: Reconstruct portal-residual balanced discovery cohort
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python amr_discovery/audit_kp_colistin_portal.py \
            --out targeted_gwas/portal --per-class 358 \
            2>&1 | tee targeted_gwas/portal_console.log
          cp targeted_gwas/portal/target_labels.csv targeted_gwas/residual_cohort.csv
          cp targeted_gwas/portal/assembly_accessions.txt targeted_gwas/accessions.txt
          sort -u targeted_gwas/accessions.txt -o targeted_gwas/accessions.txt
          n=$(wc -l < targeted_gwas/accessions.txt)
          echo "portal_residual_accessions=$n" | tee targeted_gwas/provenance/COHORT_SIZE.txt
          [[ "$n" -ge 700 ]]
          cat > targeted_gwas/PORTAL_FIRST_STAGE_BOUNDARY.json <<'EOF'
          {
            "cohort": "portal-residual balanced cohort",
            "boundary": "Resistance is unexplained only by the pre-specified AMR Portal genotype mapping. The cohort has not yet been filtered by the independent Kleborate sequence-level mechanism audit. Any association must be re-evaluated after that audit before novelty claims."
          }
          EOF

      - name: Download cohort assemblies and pinned reference annotation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p download assemblies reference_download
          ok=0
          for attempt in 1 2 3; do
            rm -f download/genomes.zip
            datasets download genome accession --inputfile targeted_gwas/accessions.txt --include genome --filename download/genomes.zip --no-progressbar \
              2>&1 | tee "targeted_gwas/provenance/GENOME_DOWNLOAD_${attempt}.log" \
              && unzip -tq download/genomes.zip && { ok=1; break; }
            sleep 20
          done
          [[ "$ok" == 1 ]]
          sha256sum download/genomes.zip > targeted_gwas/provenance/GENOME_PACKAGE_SHA256.txt
          unzip -q download/genomes.zip -d download/package
          cp download/package/ncbi_dataset/data/assembly_data_report.jsonl targeted_gwas/assembly_data_report.jsonl
          cp download/package/ncbi_dataset/data/dataset_catalog.json targeted_gwas/dataset_catalog.json
          find download/package/ncbi_dataset/data -mindepth 2 -maxdepth 2 -type f -name '*.fna' -print0 | while IFS= read -r -d '' f; do
            acc=$(basename "$(dirname "$f")")
            ln -s "$PWD/$f" "assemblies/${acc}.fna"
          done
          downloaded=$(find assemblies -type l | wc -l)
          echo "downloaded=$downloaded" | tee targeted_gwas/provenance/DOWNLOAD_COUNT.txt
          [[ "$downloaded" -ge 680 ]]
          rm -f download/genomes.zip

          datasets download genome accession GCF_000016305.1 --include genome,gbff --filename reference_download/reference.zip --no-progressbar
          unzip -tq reference_download/reference.zip
          unzip -q reference_download/reference.zip -d reference_download/package
          refgbff=$(find reference_download/package -type f -name '*.gbff' | head -1)
          test -n "$refgbff"
          cp "$refgbff" targeted_gwas/reference.gbff
          sha256sum targeted_gwas/reference.gbff > targeted_gwas/provenance/REFERENCE_GBFF_SHA256.txt

      - name: Build targeted colistin-pathway variant matrix
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python amr_discovery/build_colistin_variant_matrix.py \
            --labels targeted_gwas/residual_cohort.csv \
            --assemblies-dir assemblies \
            --reference-gbff targeted_gwas/reference.gbff \
            --out targeted_gwas/targeted_variants \
            --threads 4 \
            2>&1 | tee targeted_gwas/targeted_variant_console.log

      - name: Prepare BioProject-held-out discovery and validation inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python amr_discovery/prepare_colistin_gwas_inputs.py \
            --metadata targeted_gwas/targeted_variants/targeted_sample_metadata.csv \
            --rtab targeted_gwas/targeted_variants/targeted_variants.Rtab \
            --assembly-report targeted_gwas/assembly_data_report.jsonl \
            --assemblies-dir assemblies \
            --out targeted_gwas/gwas_inputs \
            --validation-fraction 0.30 \
            --seed 20260819 \
            2>&1 | tee targeted_gwas/gwas_input_console.log

      - name: Build normalized Mash distance matrices
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p targeted_gwas/structure
          for cohort in discovery all; do
            mash sketch -p 4 -s 10000 -l "targeted_gwas/gwas_inputs/${cohort}_refs.txt" -o "targeted_gwas/structure/${cohort}"
            mash dist "targeted_gwas/structure/${cohort}.msh" "targeted_gwas/structure/${cohort}.msh" | square_mash > "targeted_gwas/structure/${cohort}_raw.tsv"
            python - "$cohort" <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd

          name=sys.argv[1]
          raw=f'targeted_gwas/structure/{name}_raw.tsv'
          refs_file=f'targeted_gwas/gwas_inputs/{name}_refs.txt'
          refs=[Path(line.strip()).name.removesuffix('.fna') for line in open(refs_file) if line.strip()]
          by_base={r.split('.')[0]: r for r in refs}
          if len(by_base) != len(refs):
              raise SystemExit('Assembly-version restoration is not one-to-one')

          x=pd.read_csv(raw,sep='\t',index_col=0)
          def restore(value):
              token=Path(str(value)).name.removesuffix('.fna')
              return by_base.get(token, by_base.get(token.split('.')[0], token))
          x.index=[restore(v) for v in x.index]
          x.columns=[restore(v) for v in x.columns]
          if x.index.duplicated().any() or pd.Index(x.columns).duplicated().any():
              raise SystemExit('Duplicate Mash sample IDs after version restoration')
          missing=sorted(set(refs)-set(x.index))
          extra=sorted(set(x.index)-set(refs))
          if missing or extra:
              raise SystemExit(f'Mash/sample mismatch missing={missing[:10]} extra={extra[:10]}')
          x=x.loc[refs,refs]
          x.to_csv(f'targeted_gwas/structure/{name}_mash.tsv',sep='\t')
          with open(f'targeted_gwas/structure/{name}_ID_AUDIT.txt','w') as f:
              f.write(f'n_refs={len(refs)}\n')
              f.write('exact_id_match=true\n')
          PY
          done
          rm -f targeted_gwas/structure/*_raw.tsv targeted_gwas/structure/*.msh

      - name: Run population-structure sensitivity models
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p targeted_gwas/pyseer
          for dim in 10 20 30; do
            pyseer \
              --phenotypes targeted_gwas/gwas_inputs/discovery_phenotypes.tsv \
              --pres targeted_gwas/gwas_inputs/discovery_variants.Rtab \
              --distances targeted_gwas/structure/discovery_mash.tsv \
              --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 1 --print-samples \
              --output-patterns "targeted_gwas/pyseer/discovery_dim${dim}.patterns" \
              > "targeted_gwas/pyseer/discovery_dim${dim}.tsv" \
              2> "targeted_gwas/pyseer/discovery_dim${dim}.log"
            pyseer \
              --phenotypes targeted_gwas/gwas_inputs/all_phenotypes.tsv \
              --pres targeted_gwas/gwas_inputs/all_variants.Rtab \
              --distances targeted_gwas/structure/all_mash.tsv \
              --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 1 --print-samples \
              --output-patterns "targeted_gwas/pyseer/all_dim${dim}.patterns" \
              > "targeted_gwas/pyseer/all_dim${dim}.tsv" \
              2> "targeted_gwas/pyseer/all_dim${dim}.log"
          done

      - name: Evaluate held-out and cross-source replication
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python amr_discovery/evaluate_colistin_gwas.py \
            --manifest targeted_gwas/gwas_inputs/gwas_sample_manifest.csv \
            --rtab targeted_gwas/gwas_inputs/all_variants.Rtab \
            --feature-meta targeted_gwas/targeted_variants/targeted_variant_metadata.csv \
            --discovery targeted_gwas/pyseer/discovery_dim10.tsv targeted_gwas/pyseer/discovery_dim20.tsv targeted_gwas/pyseer/discovery_dim30.tsv \
            --whole targeted_gwas/pyseer/all_dim10.tsv targeted_gwas/pyseer/all_dim20.tsv targeted_gwas/pyseer/all_dim30.tsv \
            --out targeted_gwas/final_evaluation \
            2>&1 | tee targeted_gwas/evaluation_console.log

      - name: Remove public genome bytes and finalize hashes
        if: always()
        shell: micromamba-shell {0}
        run: |
          rm -rf assemblies download reference_download
          rm -f targeted_gwas/portal/target_audit.duckdb targeted_gwas/portal/target_all_genotypes.parquet
          find targeted_gwas -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > targeted_gwas/SHA256SUMS_ALL.txt || true
          du -ah targeted_gwas | sort -h | tail -150 > targeted_gwas/FILE_SIZES.txt || true

      - name: Upload parallel portal-residual targeted GWAS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KP_COLISTIN_TARGETED_PORTAL_GWAS_20260819_V2
          path: targeted_gwas
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
