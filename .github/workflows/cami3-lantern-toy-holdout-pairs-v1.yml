name: CAMI III LANTERN Toy holdout-pair low-depth stress benchmark v1

on:
  pull_request:
    branches: [cami3-lantern-20260819]
    paths:
      - '.github/workflows/cami3-lantern-toy-holdout-pairs-v1.yml'
      - 'lantern_cami3/scripts/**'
      - 'lantern_cami3/config/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  holdout-pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair_id: pair_2_3
            sample_a: 2
            sample_b: 3
          - pair_id: pair_4_5
            sample_a: 4
            sample_b: 5
          - pair_id: pair_6_7
            sample_a: 6
            sample_b: 7
          - pair_id: pair_8_9
            sample_a: 8
            sample_b: 9
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-holdout
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            megahit=1.2.9
            minimap2=2.31
            samtools
            mash=2.3
            seqkit
            tabulate
          cache-downloads: true
          post-cleanup: all

      - name: Stream deterministic 1 percent short-read stress inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PAIR='${{ matrix.pair_id }}'; A='${{ matrix.sample_a }}'; B='${{ matrix.sample_b }}'
          ROOT="holdout_${PAIR}"
          mkdir -p "$ROOT"/{reads,assemblies,truth_blind,evaluation,truth_download,truth,logs,provenance,validation,failure_audit}
          for s in "$A" "$B"; do
            url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_reads.tar.gz"
            python lantern_cami3/scripts/stream_downsample_cami_tar.py \
              --url "$url" --sample-id "S${s}" --mode short --fraction 0.01 --seed 20260819 \
              --min-kept 20000 --out-dir "$ROOT/reads" 2>&1 | tee "$ROOT/logs/DOWNSAMPLE_S${s}.log"
            gzip -t "$ROOT/reads/S${s}_R1.fastq.gz" "$ROOT/reads/S${s}_R2.fastq.gz"
          done
          gzip -cd "$ROOT/reads/S${A}_R1.fastq.gz" "$ROOT/reads/S${B}_R1.fastq.gz" | gzip -1 > "$ROOT/reads/pair_R1.fastq.gz"
          gzip -cd "$ROOT/reads/S${A}_R2.fastq.gz" "$ROOT/reads/S${B}_R2.fastq.gz" | gzip -1 > "$ROOT/reads/pair_R2.fastq.gz"
          gzip -t "$ROOT/reads/pair_R1.fastq.gz" "$ROOT/reads/pair_R2.fastq.gz"
          seqkit stats -T "$ROOT"/reads/*.fastq.gz > "$ROOT/provenance/READ_STATS.tsv"
          sha256sum "$ROOT"/reads/*.fastq.gz > "$ROOT/provenance/READ_SHA256SUMS.txt"
          git rev-parse HEAD > "$ROOT/provenance/GIT_HEAD.txt"
          uname -a > "$ROOT/provenance/UNAME.txt"
          python --version > "$ROOT/provenance/PYTHON_VERSION.txt"
          megahit --version > "$ROOT/provenance/MEGAHIT_VERSION.txt" 2>&1
          minimap2 --version > "$ROOT/provenance/MINIMAP2_VERSION.txt"
          samtools --version > "$ROOT/provenance/SAMTOOLS_VERSION.txt"
          micromamba list > "$ROOT/provenance/MICROMAMBA_LIST.txt"
          printf 'pair=%s\nsample_a=%s\nsample_b=%s\nshort_fraction=0.01\nseed=20260819\ntruth_accessed=false\n' "$PAIR" "$A" "$B" > "$ROOT/provenance/FROZEN_INPUTS.txt"

      - name: Run single-timepoint and longitudinal MEGAHIT baselines
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PAIR='${{ matrix.pair_id }}'; A='${{ matrix.sample_a }}'; B='${{ matrix.sample_b }}'; ROOT="holdout_${PAIR}"
          megahit -1 "$ROOT/reads/S${A}_R1.fastq.gz" -2 "$ROOT/reads/S${A}_R2.fastq.gz" \
            -o "$ROOT/assemblies/megahit_A" --min-contig-len 1000 -t 4 --memory 0.8 > "$ROOT/logs/MEGAHIT_A.log" 2>&1
          megahit -1 "$ROOT/reads/S${B}_R1.fastq.gz" -2 "$ROOT/reads/S${B}_R2.fastq.gz" \
            -o "$ROOT/assemblies/megahit_B" --min-contig-len 1000 -t 4 --memory 0.8 > "$ROOT/logs/MEGAHIT_B.log" 2>&1
          megahit -1 "$ROOT/reads/pair_R1.fastq.gz" -2 "$ROOT/reads/pair_R2.fastq.gz" \
            -o "$ROOT/assemblies/megahit_pair" --min-contig-len 1000 -t 4 --memory 0.8 > "$ROOT/logs/MEGAHIT_PAIR.log" 2>&1
          test -s "$ROOT/assemblies/megahit_A/final.contigs.fa"
          test -s "$ROOT/assemblies/megahit_B/final.contigs.fa"
          test -s "$ROOT/assemblies/megahit_pair/final.contigs.fa"
          sha256sum "$ROOT/assemblies"/*/final.contigs.fa > "$ROOT/provenance/BASELINE_FASTA_SHA256.txt"

      - name: Build frozen LANTERN v1 from three truth-blind assemblies
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PAIR='${{ matrix.pair_id }}'; A='${{ matrix.sample_a }}'; B='${{ matrix.sample_b }}'; ROOT="holdout_${PAIR}"
          mkdir -p "$ROOT/truth_blind"/{prepared,clusters,evidence}
          cat > "$ROOT/truth_blind/source_manifest.tsv" <<'EOF'
          source_id	assembler	scope	mode
          A	megahit	single	short
          B	megahit	single	short
          PAIR	megahit	longitudinal	short
          EOF
          python lantern_cami3/scripts/prepare_candidates.py \
            --assembly "A=$ROOT/assemblies/megahit_A/final.contigs.fa" \
            --assembly "B=$ROOT/assemblies/megahit_B/final.contigs.fa" \
            --assembly "PAIR=$ROOT/assemblies/megahit_pair/final.contigs.fa" \
            --source-manifest "$ROOT/truth_blind/source_manifest.tsv" --min-length 1000 \
            --out "$ROOT/truth_blind/prepared" > "$ROOT/logs/PREPARE.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$ROOT/truth_blind/prepared/combined_candidates.fasta" "$ROOT/truth_blind/prepared/combined_candidates.fasta" \
            > "$ROOT/truth_blind/all_vs_all.paf" 2> "$ROOT/logs/ALL_VS_ALL.log"
          python lantern_cami3/scripts/cluster_candidates.py \
            --fasta "$ROOT/truth_blind/prepared/combined_candidates.fasta" --metadata "$ROOT/truth_blind/prepared/candidates.tsv" \
            --paf "$ROOT/truth_blind/all_vs_all.paf" --min-identity 0.97 --min-shorter-coverage 0.85 \
            --out "$ROOT/truth_blind/clusters" > "$ROOT/logs/CLUSTER.log" 2>&1
          for s in "$A" "$B"; do
            minimap2 -t 4 -ax sr "$ROOT/truth_blind/clusters/cluster_representatives.fasta" \
              "$ROOT/reads/S${s}_R1.fastq.gz" "$ROOT/reads/S${s}_R2.fastq.gz" \
              2> "$ROOT/logs/MAP_S${s}.log" | samtools sort -@ 2 -o "$ROOT/truth_blind/evidence/S${s}.bam" -
            samtools index "$ROOT/truth_blind/evidence/S${s}.bam"
            samtools coverage "$ROOT/truth_blind/evidence/S${s}.bam" > "$ROOT/truth_blind/evidence/S${s}_coverage.tsv"
          done
          python lantern_cami3/scripts/merge_mapping_evidence.py \
            --short-coverage "S${A}=$ROOT/truth_blind/evidence/S${A}_coverage.tsv" \
            --short-coverage "S${B}=$ROOT/truth_blind/evidence/S${B}_coverage.tsv" \
            --out "$ROOT/truth_blind/evidence/merged" > "$ROOT/logs/MERGE_EVIDENCE.log" 2>&1
          for ablation in full no_longitudinal no_consensus; do
            python lantern_cami3/scripts/lantern_select.py \
              --fasta "$ROOT/truth_blind/clusters/cluster_representatives.fasta" \
              --metadata "$ROOT/truth_blind/clusters/representative_metadata.tsv" \
              --evidence "$ROOT/truth_blind/evidence/merged/mapping_evidence.tsv" \
              --config lantern_cami3/config/lantern_frozen_v1.json --ablation "$ablation" \
              --out "$ROOT/truth_blind/LANTERN_${ablation}" > "$ROOT/logs/LANTERN_${ablation}.log" 2>&1
            python lantern_cami3/scripts/verify_cami_assembly.py "$ROOT/truth_blind/LANTERN_${ablation}/LANTERN_ASSEMBLY.fasta" \
              --out "$ROOT/truth_blind/LANTERN_${ablation}/VALIDATION.json"
          done
          python - "$ROOT" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]);files=[]
          for base in [root/'assemblies',root/'truth_blind',Path('lantern_cami3/config/lantern_frozen_v1.json')]:
              paths=[base] if base.is_file() else sorted(base.rglob('*'))
              for p in paths:
                  if p.is_file() and not p.name.endswith(('.bam','.bai')):files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          obj={'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'truth_accessed':False,'files':files,'boundary':'All holdout assemblies, evidence scores, selections, and ablations were frozen before sample gold-standard archives were downloaded.'}
          (root/'truth_blind/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Download pair gold standards only after freeze and evaluate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PAIR='${{ matrix.pair_id }}'; A='${{ matrix.sample_a }}'; B='${{ matrix.sample_b }}'; ROOT="holdout_${PAIR}"
          for s in "$A" "$B"; do
            curl -fsSL --retry 8 --retry-all-errors "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$ROOT/truth_download/sample_${s}_gsa.tar.gz"
          done
          sha256sum "$ROOT/truth_download"/*.tar.gz > "$ROOT/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "S${A}=$ROOT/truth_download/sample_${A}_gsa.tar.gz" \
            --gsa-tar "S${B}=$ROOT/truth_download/sample_${B}_gsa.tar.gz" \
            --out "$ROOT/truth" > "$ROOT/logs/EXTRACT_TRUTH.log" 2>&1
          cat > "$ROOT/evaluation/METHOD_PATHS.tsv" <<EOF
          method	fasta	out
          megahit_A	$ROOT/assemblies/megahit_A/final.contigs.fa	$ROOT/evaluation/megahit_A
          megahit_B	$ROOT/assemblies/megahit_B/final.contigs.fa	$ROOT/evaluation/megahit_B
          megahit_pair	$ROOT/assemblies/megahit_pair/final.contigs.fa	$ROOT/evaluation/megahit_pair
          lantern_full	$ROOT/truth_blind/LANTERN_full/LANTERN_ASSEMBLY.fasta	$ROOT/evaluation/lantern_full
          lantern_no_longitudinal	$ROOT/truth_blind/LANTERN_no_longitudinal/LANTERN_ASSEMBLY.fasta	$ROOT/evaluation/lantern_no_longitudinal
          lantern_no_consensus	$ROOT/truth_blind/LANTERN_no_consensus/LANTERN_ASSEMBLY.fasta	$ROOT/evaluation/lantern_no_consensus
          EOF
          while IFS=$'\t' read -r method fasta out; do
            test "$method" = method && continue; mkdir -p "$out"
            minimap2 -x asm5 -c -N 100 -t 4 "$ROOT/truth/combined_truth.fasta" "$fasta" > "$out/assembly_to_truth.paf" 2> "$out/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py \
              --paf "$out/assembly_to_truth.paf" --truth-mapping "$ROOT/truth/truth_mapping.tsv" \
              --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$out" > "$out/evaluate_console.log"
          done < "$ROOT/evaluation/METHOD_PATHS.tsv"
          python - "$ROOT" "$PAIR" "$A" "$B" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);pair,a,b=sys.argv[2:]
          names=['megahit_A','megahit_B','megahit_pair','lantern_full','lantern_no_longitudinal','lantern_no_consensus']
          m={n:json.loads((root/'evaluation'/n/'GOLD_COVERAGE_SUMMARY.json').read_text()) for n in names}
          strongest=max(['megahit_A','megahit_B','megahit_pair'],key=lambda n:m[n]['genome_fraction_percent'])
          full=m['lantern_full'];base=m[strongest];abl=m['lantern_no_longitudinal']
          out={'pair_id':pair,'sample_a':int(a),'sample_b':int(b),'stress':'deterministic 1% short-read depth','strongest_baseline':strongest,'baseline_genome_fraction_percent':base['genome_fraction_percent'],'lantern_genome_fraction_percent':full['genome_fraction_percent'],'gain_percentage_points':full['genome_fraction_percent']-base['genome_fraction_percent'],'mean_recovery_gain_percentage_points':100*(full['mean_genome_recovery']-base['mean_genome_recovery']),'longitudinal_ablation_drop_percentage_points':full['genome_fraction_percent']-abl['genome_fraction_percent'],'baseline_chimera_proxy_bp_fraction':base['cross_binid_chimeric_bp_fraction'],'lantern_chimera_proxy_bp_fraction':full['cross_binid_chimeric_bp_fraction'],'truth_blind':True,'claim_boundary':'Independent public Toy-pair low-depth stress result; not CAMI challenge rank or hidden-genome validation.'}
          (root/'PAIR_RESULT.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY

      - name: Compact pair artifact
        if: always()
        shell: micromamba-shell {0}
        run: |
          PAIR='${{ matrix.pair_id }}'; ROOT="holdout_${PAIR}"
          rm -rf "$ROOT/reads" "$ROOT/truth_download" "$ROOT/truth/references"
          rm -f "$ROOT/truth/combined_truth.fasta" "$ROOT/truth_blind/evidence"/*.bam "$ROOT/truth_blind/evidence"/*.bai
          find "$ROOT" -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS_ALL.txt" || true
          du -ah "$ROOT" | sort -h > "$ROOT/FILE_SIZES.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_HOLDOUT_${{ matrix.pair_id }}_20260820
          path: holdout_${{ matrix.pair_id }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  aggregate-holdouts:
    needs: holdout-pair
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_HOLDOUT_pair_*_20260820
          path: holdout_artifacts
          merge-multiple: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aggregate independent stress results
        run: |
          set -euo pipefail
          mkdir -p holdout_summary
          python - <<'PY'
          import csv,json,statistics,hashlib
          from pathlib import Path
          files=sorted(Path('holdout_artifacts').rglob('PAIR_RESULT.json'))
          rows=[json.loads(p.read_text()) for p in files]
          if len(rows)<2: raise SystemExit(f'Too few completed holdout pairs: {len(rows)}')
          fields=sorted({k for r in rows for k in r})
          with open('holdout_summary/HOLDOUT_PAIR_RESULTS.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          gains=[r['gain_percentage_points'] for r in rows];drops=[r['longitudinal_ablation_drop_percentage_points'] for r in rows]
          summary={'n_pairs_completed':len(rows),'pairs':[r['pair_id'] for r in rows],'positive_gain_pairs':sum(x>0 for x in gains),'median_gain_percentage_points':statistics.median(gains),'mean_gain_percentage_points':statistics.mean(gains),'minimum_gain_percentage_points':min(gains),'maximum_gain_percentage_points':max(gains),'positive_ablation_drop_pairs':sum(x>0 for x in drops),'median_longitudinal_ablation_drop_percentage_points':statistics.median(drops),'claim_boundary':'Robustness stress summary across separate public Toy individuals at 1% short-read depth. No post-hoc parameter changes and no hidden CAMI challenge truth.'}
          Path('holdout_summary/HOLDOUT_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          Path('holdout_summary/README.md').write_text('# LANTERN holdout-pair stress audit\n\nFrozen LANTERN v1 was applied without retuning to independent Toy pairs (2,3), (4,5), (6,7), and (8,9) at deterministic 1% short-read depth. Pair-level results are retained even when unfavorable.\n')
          lines=[]
          for p in sorted(Path('holdout_summary').rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.txt':lines.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}')
          Path('holdout_summary/SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_HOLDOUT_SUMMARY_20260820
          path: holdout_summary
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
