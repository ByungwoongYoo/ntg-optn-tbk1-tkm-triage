name: LANTERN CAMI III official-source smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'lantern/**'
      - '.github/workflows/lantern-cami3-official-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record environment and frozen inputs
        run: |
          set -euo pipefail
          mkdir -p lantern_smoke/provenance lantern_smoke/downloads lantern_smoke/extracted lantern_smoke/validation
          uname -a > lantern_smoke/provenance/UNAME.txt
          python --version > lantern_smoke/provenance/PYTHON_VERSION.txt
          curl --version > lantern_smoke/provenance/CURL_VERSION.txt
          tar --version > lantern_smoke/provenance/TAR_VERSION.txt
          git rev-parse HEAD > lantern_smoke/provenance/GIT_HEAD.txt
          cp lantern/config/cami3_official_snapshot_20260820.json lantern_smoke/provenance/
          sha256sum lantern/config/cami3_official_snapshot_20260820.json > lantern_smoke/provenance/INPUT_CONFIG_SHA256.txt

      - name: Download official CAMI III Toy sample-0 assembly resources
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('lantern/config/cami3_official_snapshot_20260820.json').read_text())
          Path('/tmp/contigs_url').write_text(x['toy_smoke_urls']['short_sample_0_contigs'])
          Path('/tmp/gsa_url').write_text(x['toy_smoke_urls']['short_sample_0_gsa'])
          PY
          for item in contigs gsa; do
            url=$(cat "/tmp/${item}_url")
            out="lantern_smoke/downloads/sample_0_${item}.tar.gz"
            hdr="lantern_smoke/provenance/sample_0_${item}_headers.txt"
            ok=0
            for attempt in 1 2 3 4; do
              rm -f "$out" "$hdr"
              if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
                    --max-time 1800 --dump-header "$hdr" --output "$out" "$url"; then
                tar -tzf "$out" > "lantern_smoke/provenance/sample_0_${item}_archive_listing.txt"
                ok=1
                break
              fi
              sleep $((attempt * 15))
            done
            [[ "$ok" == 1 ]]
            sha256sum "$out" >> lantern_smoke/provenance/DOWNLOAD_SHA256SUMS.txt
            stat --printf='%n\t%s\t%y\n' "$out" >> lantern_smoke/provenance/DOWNLOAD_STAT.tsv
            mkdir -p "lantern_smoke/extracted/${item}"
            tar -xzf "$out" -C "lantern_smoke/extracted/${item}"
          done

      - name: Validate every extracted FASTA-compatible file
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find lantern_smoke/extracted -type f \( -iname '*.fa' -o -iname '*.fasta' -o -iname '*.fna' -o -iname '*.fa.gz' -o -iname '*.fasta.gz' -o -iname '*.fna.gz' \) -print0)
          [[ ${#files[@]} -gt 0 ]]
          : > lantern_smoke/validation/VALIDATED_FILES.tsv
          n=0
          for f in "${files[@]}"; do
            n=$((n+1))
            out="lantern_smoke/validation/fasta_${n}.json"
            python lantern/scripts/validate_cami_fasta.py "$f" --out "$out"
            printf '%s\t%s\n' "$n" "$f" >> lantern_smoke/validation/VALIDATED_FILES.tsv
          done
          echo "$n" > lantern_smoke/validation/N_FASTA_FILES.txt

      - name: Build smoke-test verdict and complete manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('lantern_smoke')
          validations=[]
          for p in sorted((root/'validation').glob('fasta_*.json')):
              validations.append(json.loads(p.read_text()))
          verdict={
              'status':'PASS' if validations and all(v['valid'] for v in validations) else 'FAIL',
              'official_files_downloaded':2,
              'fasta_files_validated':len(validations),
              'total_records':sum(v['records'] for v in validations),
              'total_bases':sum(v['total_bases'] for v in validations),
              'claim_boundary':'Official-source retrieval and FASTA syntax/integrity smoke test only. No assembler baseline or biological performance result has been produced.'
          }
          (root/'SMOKE_VERDICT.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
          if verdict['status']!='PASS':
              raise SystemExit('smoke validation failed')
          lines=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS_ALL.txt':
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  lines.append(f'{h}  {p.relative_to(root)}')
          (root/'SHA256SUMS_ALL.txt').write_text('\n'.join(lines)+'\n')
          print(json.dumps(verdict,indent=2,sort_keys=True))
          PY
          tar -tzf lantern_smoke/downloads/sample_0_contigs.tar.gz >/dev/null
          tar -tzf lantern_smoke/downloads/sample_0_gsa.tar.gz >/dev/null

      - name: Remove downloaded source archives from compact evidence artifact
        run: |
          rm -rf lantern_smoke/downloads
          find lantern_smoke -type f ! -name SHA256SUMS_COMPACT.txt -print0 | sort -z | xargs -0 sha256sum > lantern_smoke/SHA256SUMS_COMPACT.txt

      - name: Upload compact official-source smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_OFFICIAL_SMOKE_20260820
          path: lantern_smoke
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
