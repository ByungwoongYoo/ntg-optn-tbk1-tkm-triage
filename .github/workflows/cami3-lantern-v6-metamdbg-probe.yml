name: CAMI III LANTERN v6 isolated metaMDBG development probe

on:
  pull_request:
    branches: [cami3-lantern-20260819]
    paths:
      - '.github/workflows/cami3-lantern-v6-metamdbg-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SEED: '20260819'

jobs:
  assemble-evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: f25
            fraction: '0.25'
          - label: f50
            fraction: '0.50'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v6-metamdbg
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            metamdbg=1.4
            minimap2=2.31
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all

      - name: Stream deterministic development long reads
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; fraction='${{ matrix.fraction }}'
          root="v6_metamdbg_${label}"
          mkdir -p "$root"/{reads,assembly,evaluation,truth_download,truth,provenance,logs,failure_audit}
          for s in 0 1; do
            url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz"
            python lantern_cami3/scripts/stream_downsample_cami_tar.py \
              --url "$url" --sample-id "S${s}" --mode long \
              --fraction "$fraction" --seed "$SEED" --min-kept 5000 --out-dir "$root/reads" \
              > "$root/logs/DOWNSAMPLE_S${s}.log" 2>&1
          done
          gzip -t "$root"/reads/S0_long.fastq.gz "$root"/reads/S1_long.fastq.gz
          seqkit stats -T "$root"/reads/*.fastq.gz > "$root/provenance/READ_STATS.tsv"
          sha256sum "$root"/reads/*.fastq.gz "$root"/reads/*_downsample.json > "$root/provenance/READ_SHA256.txt"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          metaMDBG --help > "$root/provenance/METAMDBG_HELP.txt" 2>&1 || true
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'label=%s\nfraction=%s\nseed=%s\nsamples=0,1\ngold_accessed=false\n' \
            "$label" "$fraction" "$SEED" > "$root/provenance/FROZEN_INPUTS.txt"

      - name: Assemble with metaMDBG and freeze before gold
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; root="v6_metamdbg_${label}"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=120s 300m \
            metaMDBG asm --out-dir "$root/assembly/out" \
            --in-ont "$root/reads/S0_long.fastq.gz" "$root/reads/S1_long.fastq.gz" --threads 4 \
            > "$root/logs/METAMDBG.log" 2>&1
          rc=$?
          set -e
          printf 'exit_code=%s\n' "$rc" > "$root/failure_audit/METAMDBG.status"
          contigs=$(find "$root/assembly/out" -maxdepth 3 -type f \( -name 'contigs.fasta.gz' -o -name 'contigs.fasta' -o -name 'assembly.fasta' \) -print -quit || true)
          if [[ -z "$contigs" ]]; then
            printf '{"status":"NO_CONTIG_FILE","exit_code":%s}\n' "$rc" > "$root/assembly/ASSEMBLY_STATUS.json"
            exit 1
          fi
          if [[ "$contigs" == *.gz ]]; then
            gzip -cd "$contigs" > "$root/assembly/final_assembly.fasta"
          else
            cp "$contigs" "$root/assembly/final_assembly.fasta"
          fi
          if [[ ! -s "$root/assembly/final_assembly.fasta" ]]; then
            printf '{"status":"ZERO_CONTIG_ASSEMBLY","exit_code":%s}\n' "$rc" > "$root/assembly/ASSEMBLY_STATUS.json"
            exit 1
          fi
          python lantern_cami3/scripts/verify_cami_assembly.py \
            "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$label" '${{ matrix.fraction }}' <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); label=sys.argv[2]; fraction=float(sys.argv[3])
          fasta=root/'assembly/final_assembly.fasta'
          freeze={
            'status':'ASSEMBLY_FROZEN_BEFORE_GOLD',
            'label':label,
            'long_fraction':fraction,
            'samples':[0,1],
            'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'assembly_sha256':hashlib.sha256(fasta.read_bytes()).hexdigest(),
            'assembly_bytes':fasta.stat().st_size,
            'truth_accessed':False,
            'boundary':'High-depth metaMDBG development assembly was completed and hashed before Toy gold-standard access.'
          }
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
          PY

      - name: Open development gold only after freeze and evaluate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; root="v6_metamdbg_${label}"
          test -s "$root/provenance/TRUTH_BLIND_FREEZE.json"
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          sha256sum "$root"/truth_download/*.tar.gz > "$root/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" \
            --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 \
            "$root/truth/combined_truth.fasta" "$root/assembly/final_assembly.fasta" \
            > "$root/evaluation/assembly_to_truth.paf" 2> "$root/logs/MINIMAP2.log"
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf "$root/evaluation/assembly_to_truth.paf" \
            --truth-mapping "$root/truth/truth_mapping.tsv" \
            --assembly-fasta "$root/assembly/final_assembly.fasta" \
            --min-identity 0.90 --min-alignment 500 --out "$root/evaluation" \
            > "$root/logs/EVALUATE.log" 2>&1
          test -s "$root/evaluation/GOLD_COVERAGE_SUMMARY.json"

      - name: Compact reproducible development artifact
        if: always()
        shell: micromamba-shell {0}
        run: |
          label='${{ matrix.label }}'; root="v6_metamdbg_${label}"
          rm -rf "$root/reads" "$root/assembly/out" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/evaluation/assembly_to_truth.paf"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V6_METAMDBG_${{ matrix.label }}_DEVELOPMENT_20260820
          path: v6_metamdbg_${{ matrix.label }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  select-fraction:
    needs: assemble-evaluate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download current-run development artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V6_METAMDBG_*_DEVELOPMENT_20260820
          path: inputs
          merge-multiple: false
      - name: Select and freeze one long-read fraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_fraction_decision/{results,provenance,failure_audit}
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          rows=[]
          for p in sorted(Path('inputs').rglob('GOLD_COVERAGE_SUMMARY.json')):
              summary=json.loads(p.read_text())
              freeze=json.loads(next(p.parents[1].glob('provenance/TRUTH_BLIND_FREEZE.json')).read_text())
              rows.append({
                'label':freeze['label'],
                'long_fraction':freeze['long_fraction'],
                'genome_fraction_percent':summary['genome_fraction_percent'],
                'mean_genome_recovery_percent':100*summary['mean_genome_recovery'],
                'chimera_bp_fraction':summary['cross_binid_chimeric_bp_fraction'],
                'assembly_total_bp':summary['assembly_total_bp'],
                'assembly_contigs_total':summary['assembly_contigs_total'],
              })
          if not rows:
              Path('v6_fraction_decision/results/FRACTION_DECISION.json').write_text(json.dumps({'status':'NO_NONZERO_METAMDBG_ASSEMBLY'},indent=2)+'\n')
              raise SystemExit('no successful nonzero metaMDBG development assembly')
          best_gf=max(r['genome_fraction_percent'] for r in rows)
          eligible=[r for r in rows if best_gf-r['genome_fraction_percent']<=0.05]
          winner=min(eligible,key=lambda r:(r['long_fraction'],-r['mean_genome_recovery_percent']))
          decision={
            'status':'FRACTION_FROZEN_FOR_V6_CONSTRUCTION',
            'selection_rule':'Choose the smallest long-read fraction within 0.05 percentage points of the best development genome fraction; break ties by mean recovery.',
            'winner':winner,
            'all_methods':sorted(rows,key=lambda r:r['long_fraction']),
            'development_samples':[0,1],
            'claim_boundary':'Development-only fraction selection. No holdout or active CAMI challenge performance is implied.'
          }
          Path('v6_fraction_decision/results/FRACTION_DECISION.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          fields=list(rows[0])
          with open('v6_fraction_decision/results/FRACTION_COMPARISON.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(sorted(rows,key=lambda r:r['long_fraction']))
          Path('v6_fraction_decision/results/FROZEN_LONG_FRACTION.txt').write_text(str(winner['long_fraction'])+'\n')
          PY
          git rev-parse HEAD > v6_fraction_decision/provenance/GIT_HEAD.txt
          find v6_fraction_decision -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > v6_fraction_decision/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V6_METAMDBG_FRACTION_DECISION_20260820
          path: v6_fraction_decision
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
