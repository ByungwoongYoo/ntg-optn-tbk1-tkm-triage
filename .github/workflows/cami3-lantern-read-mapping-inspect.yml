name: CAMI III Toy read mapping metadata inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-read-mapping-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stream mapping header and examples
        run: |
          set -euo pipefail
          mkdir -p mapping_inspect
          set +o pipefail
          curl -fsSL --retry 5 --retry-all-errors https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_0_reads.tar.gz | tar -xzOf - sample_0_reads/reads_mapping.tsv.gz | gzip -dc | head -100 > mapping_inspect/sample0_mapping_head.tsv
          set -o pipefail
          test -s mapping_inspect/sample0_mapping_head.tsv
          git rev-parse HEAD > mapping_inspect/GIT_HEAD.txt
          find mapping_inspect -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > mapping_inspect/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_READ_MAPPING_HEAD_20260819
          path: mapping_inspect
          if-no-files-found: error
          retention-days: 90
