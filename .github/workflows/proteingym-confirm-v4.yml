name: ProteinGym confirmatory model audit v4
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_confirm_v4.py'
      - '.github/workflows/proteingym-confirm-v4.yml'
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn
      - name: Download official ProteinGym resources
        run: |
          mkdir -p pg_data_v4 artifact/proteingym_confirm_v4
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data_v4/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 -o pg_data_v4/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum pg_data_v4/zero_shot_substitutions_scores.zip pg_data_v4/DMS_substitutions.csv > artifact/resource_sha256_v4.txt
      - name: Run confirmatory external and excluded-human audit
        run: |
          PYTHONPATH=bio_open_problem python bio_open_problem/proteingym_confirm_v4.py \
            --score-zip pg_data_v4/zero_shot_substitutions_scores.zip \
            --reference pg_data_v4/DMS_substitutions.csv \
            --out-dir artifact/proteingym_confirm_v4
      - name: Package
        run: |
          cp bio_open_problem/proteingym_confirm_v4.py \
             bio_open_problem/proteingym_external_v3.py \
             bio_open_problem/proteingym_wide_v2.py artifact/
          tar -czf artifact/proteingym_confirm_v4_results.tar.gz \
            artifact/proteingym_confirm_v4 artifact/resource_sha256_v4.txt \
            artifact/proteingym_confirm_v4.py artifact/proteingym_external_v3.py artifact/proteingym_wide_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: proteingym-confirm-v4
          path: |
            artifact/proteingym_confirm_v4
            artifact/resource_sha256_v4.txt
            artifact/proteingym_confirm_v4.py
            artifact/proteingym_external_v3.py
            artifact/proteingym_wide_v2.py
            artifact/proteingym_confirm_v4_results.tar.gz
          retention-days: 30
          if-no-files-found: error
