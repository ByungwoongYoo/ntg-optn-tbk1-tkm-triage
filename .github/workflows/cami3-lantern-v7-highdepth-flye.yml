name: CAMI III LANTERN v7 high-depth metaFlye development

on:
  pull_request:
    branches: [lantern-v6-isolated-20260820]
    paths:
      - '.github/workflows/cami3-lantern-v7-highdepth-flye.yml'
      - 'lantern_cami3/scripts/stream_downsample_cami_tar.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V4_RUN_ID: '32332720793'
  V4_ARTIFACT: 'LANTERN_CAMI3_HYBRID_V4_DEVELOPMENT_20260820'
  SEED: '20260820'

jobs:
  assemble-evaluate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: f08
            fraction: '0.08'
          - label: f16
            fraction: '0.16'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v7-flye
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            flye
            minimap2=2.31
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Stream high-depth long reads and run truth-blind metaFlye
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; fraction='${{ matrix.fraction }}'
          root="flye_${label}"
          mkdir -p "$root"/{reads,assembly,truth_download,truth,evaluation,provenance,logs,failure_audit}
          for s in 0 1; do
            url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz"
            python lantern_cami3/scripts/stream_downsample_cami_tar.py \
              --url "$url" --sample-id "S${s}" --mode long \
              --fraction "$fraction" --seed "$SEED" --min-kept 2000 --out-dir "$root/reads" \
              > "$root/logs/DOWNSAMPLE_S${s}.log" 2>&1
            gzip -t "$root/reads/S${s}_long.fastq.gz"
          done
          seqkit stats -T "$root"/reads/*.fastq.gz > "$root/provenance/READ_STATS.tsv"
          sha256sum "$root"/reads/*.fastq.gz > "$root/provenance/READ_SHA256.txt"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          flye --version > "$root/provenance/FLYE_VERSION.txt" 2>&1 || true
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'samples=0,1\nfraction=%s\nseed=%s\ngold_accessed=false\n' "$fraction" "$SEED" > "$root/provenance/FROZEN_INPUTS.txt"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=120s 300m \
            flye --nano-raw "$root/reads/S0_long.fastq.gz" "$root/reads/S1_long.fastq.gz" \
            --meta --threads 4 --out-dir "$root/assembly/out" \
            > "$root/logs/FLYE.log" 2>&1
          rc=$?
          set -e
          printf 'exit_code=%s\n' "$rc" > "$root/failure_audit/FLYE.status"
          fasta="$root/assembly/out/assembly.fasta"
          test -s "$fasta"
          cp "$fasta" "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$label" "$fraction" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); fasta=root/'assembly/final_assembly.fasta'
          x={'status':'FLYE_ASSEMBLY_FROZEN_BEFORE_GOLD','label':sys.argv[2],'fraction':float(sys.argv[3]),'assembly_bytes':fasta.stat().st_size,'assembly_sha256':hashlib.sha256(fasta.read_bytes()).hexdigest(),'truth_accessed':False,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'boundary':'Long-read subset, Flye command and assembly were frozen before public Toy GSA access.'}
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
      - name: Open development gold after freeze and evaluate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root="flye_${{ matrix.label }}"
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" \
            --out "$root/truth" > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/combined_truth.fasta" "$root/assembly/final_assembly.fasta" \
            > "$root/evaluation/assembly_to_truth.paf" 2> "$root/evaluation/minimap2.log"
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf "$root/evaluation/assembly_to_truth.paf" --truth-mapping "$root/truth/truth_mapping.tsv" \
            --assembly-fasta "$root/assembly/final_assembly.fasta" --min-identity 0.90 --min-alignment 500 \
            --out "$root/evaluation" > "$root/evaluation/evaluate.log" 2>&1
          test -s "$root/evaluation/GOLD_COVERAGE_SUMMARY.json"
          rm -f "$root/evaluation/assembly_to_truth.paf"
      - name: Compact and upload one frozen depth result
        if: always()
        shell: micromamba-shell {0}
        run: |
          root="flye_${{ matrix.label }}"
          rm -rf "$root/reads" "$root/assembly/out" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/evaluation/per_truth_contig.tsv"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V7_HIGHDEPTH_FLYE_${{ matrix.label }}_20260820
          path: flye_${{ matrix.label }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  compare:
    needs: assemble-evaluate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_V7_HIGHDEPTH_FLYE_*_20260820
          path: incoming
      - name: Download immutable v4 development metrics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V4_ARTIFACT }}
          path: v4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V4_RUN_ID }}
      - name: Compare successful long-read depths to existing development baseline
        run: |
          set -euo pipefail
          mkdir -p comparison
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('incoming').rglob('GOLD_COVERAGE_SUMMARY.json'):
              s=json.loads(p.read_text()); label=p.parts[-3] if len(p.parts)>=3 else p.parent.name
              rows.append({'method':label,'genome_fraction_percent':s['genome_fraction_percent'],'mean_recovery_percent':100*s['mean_genome_recovery'],'chimera_bp_fraction':s['cross_binid_chimeric_bp_fraction'],'assembly_bp':s['assembly_total_bp']})
          base=next(Path('v4').rglob('evaluation/metaspades_hybrid_pair/GOLD_COVERAGE_SUMMARY.json'))
          b=json.loads(base.read_text())
          winner=max(rows,key=lambda r:(r['genome_fraction_percent'],r['mean_recovery_percent'],-(r['chimera_bp_fraction'] or 0))) if rows else None
          out={'status':'SUCCESSFUL_DEPTHS_COMPARED' if rows else 'NO_SUCCESSFUL_FLYE_ASSEMBLY','existing_hybrid_baseline':{'genome_fraction_percent':b['genome_fraction_percent'],'mean_recovery_percent':100*b['mean_genome_recovery'],'chimera_bp_fraction':b['cross_binid_chimeric_bp_fraction']},'depth_results':rows,'best_depth':winner,'development_only':True,'boundary':'Public Toy development comparison; no untouched or official hidden CAMI claim.'}
          Path('comparison/HIGHDEPTH_FLYE_COMPARISON.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          rm -rf incoming v4
          find comparison -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > comparison/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_V7_HIGHDEPTH_FLYE_COMPARISON_20260820
          path: comparison
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
