name: ProteinGym missense open-problem benchmark
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_ensemble.py'
      - '.github/workflows/proteingym-missense-ensemble.yml'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis stack
        run: pip install numpy pandas scipy scikit-learn
      - name: Patch archive diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio_open_problem/proteingym_ensemble.py')
          s=p.read_text()
          old="data=data[data[rank_cols].notna().sum(axis=1)>=max(3,len(models)//2)].copy()"
          new="score_counts=data[rank_cols].notna().sum(axis=1); print('score-count distribution', score_counts.value_counts().sort_index().to_dict(), flush=True); data=data[score_counts>=1].copy()"
          s=s.replace(old,new)
          old2="models=choose_models(coverage,len(ref),args.max_models)"
          new2="models=choose_models(coverage,len(ref),args.max_models); print('coverage top20', sorted(coverage.items(), key=lambda x:(-x[1],x[0]))[:20], flush=True); print('selected models', models, flush=True)"
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Download official ProteinGym v1.3 resources
        run: |
          mkdir -p pg_data artifact/proteingym_full
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data/DMS_ProteinGym_substitutions.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/DMS_ProteinGym_substitutions.zip
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 -o pg_data/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum \
            pg_data/DMS_ProteinGym_substitutions.zip \
            pg_data/zero_shot_substitutions_scores.zip \
            pg_data/DMS_substitutions.csv > artifact/resource_sha256.txt
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('pg_data/zero_shot_substitutions_scores.zip') as z:
              print('FIRST SCORE ARCHIVE MEMBERS')
              for n in z.namelist()[:40]: print(n)
              first=next(n for n in z.namelist() if n.lower().endswith('.csv'))
              print('FIRST CSV', first)
              import pandas as pd
              with z.open(first) as f:
                  d=pd.read_csv(f,nrows=3)
              print('FIRST CSV COLUMNS', d.columns.tolist())
          PY
      - name: Run all eligible human assays
        run: |
          python bio_open_problem/proteingym_ensemble.py \
            --dms-zip pg_data/DMS_ProteinGym_substitutions.zip \
            --score-zip pg_data/zero_shot_substitutions_scores.zip \
            --reference pg_data/DMS_substitutions.csv \
            --out-dir artifact/proteingym_full \
            --human-only --max-models 12
      - name: Package concise results
        if: always()
        run: |
          cp bio_open_problem/proteingym_ensemble.py artifact/
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('artifact')
          man={}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.stat().st_size < 200_000_000:
                  man[str(p.relative_to(root))]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'MANIFEST.json').write_text(json.dumps(man,indent=2))
          PY
          tar -czf artifact/proteingym_missense_results.tar.gz \
            artifact/proteingym_full artifact/resource_sha256.txt \
            artifact/proteingym_ensemble.py artifact/MANIFEST.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proteingym-missense-ensemble
          path: |
            artifact/proteingym_full
            artifact/resource_sha256.txt
            artifact/proteingym_ensemble.py
            artifact/MANIFEST.json
            artifact/proteingym_missense_results.tar.gz
          retention-days: 30
          if-no-files-found: warn
