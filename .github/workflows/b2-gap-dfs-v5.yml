name: B2 Z100 exact C++ DFS hard-gap attack v5
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/b2_gap_dfs_v5.cpp'
      - '.github/workflows/b2-gap-dfs-v5.yml'
jobs:
  dfs:
    strategy:
      fail-fast: false
      matrix:
        gap: [1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent exact DFS
        run: g++ -std=c++20 -O3 -march=native -DNDEBUG crossdomain/b2_gap_dfs_v5.cpp -o b2dfs
      - name: Exhaustive incremental search for normalized gap case
        run: |
          mkdir -p artifact/b2_gap_dfs_${{ matrix.gap }}
          ./b2dfs ${{ matrix.gap }} 3000 artifact/b2_gap_dfs_${{ matrix.gap }}/RESULT.json
          cp crossdomain/b2_gap_dfs_v5.cpp artifact/b2_gap_dfs_${{ matrix.gap }}/
          sha256sum b2dfs > artifact/b2_gap_dfs_${{ matrix.gap }}/BINARY_SHA256.txt
          find artifact/b2_gap_dfs_${{ matrix.gap }} -type f -print0 | sort -z | xargs -0 sha256sum > artifact/b2_gap_dfs_${{ matrix.gap }}/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap-dfs-${{ matrix.gap }}-v5
          path: artifact/b2_gap_dfs_${{ matrix.gap }}
          retention-days: 30
          if-no-files-found: error
