name: Snapshot Panax RdRP validation status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/panax-rdrp-validation-status.yml'
      - '.github/workflows/panax-rdrp-validation-observer.yml'

permissions:
  contents: read
  actions: read

env:
  EXPECTED_HEAD_SHA: 1d277f493d64df008bcbd06c74100fb6d5c7ef20

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Query exact validation and corrected-remap workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          for workflow in panax-rdrp-validation.yml panax-rdrp-raw-remap.yml; do
            stem="${workflow%.yml}"
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=panax-rdrp-validation-20260818&per_page=100"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -o "snapshot/${stem}_runs.json"
          done
          python - <<'PY'
          import json, os, pathlib
          expected=os.environ['EXPECTED_HEAD_SHA']
          val=json.load(open('snapshot/panax-rdrp-validation_runs.json'))
          raw=json.load(open('snapshot/panax-rdrp-raw-remap_runs.json'))
          val_matches=[r for r in val.get('workflow_runs',[]) if r.get('head_sha')==expected]
          raw_runs=raw.get('workflow_runs',[])
          def keep(r):
              return {k:r.get(k) for k in ('id','head_sha','status','conclusion','created_at','updated_at','run_attempt','html_url','artifacts_url','jobs_url')}
          out={
            'expected_validation_head_sha':expected,
            'validation_matches':[keep(r) for r in val_matches],
            'corrected_remap_latest':[keep(r) for r in raw_runs[:3]],
          }
          pathlib.Path('snapshot/VALIDATION_STATUS.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          ids=[]
          if val_matches: ids.append(('validation',val_matches[0]['id']))
          if raw_runs: ids.append(('raw_remap',raw_runs[0]['id']))
          pathlib.Path('snapshot/RUN_IDS.tsv').write_text(''.join(f'{label}\t{rid}\n' for label,rid in ids))
          PY
          while IFS=$'\t' read -r label run_id; do
            [[ -n "$run_id" ]] || continue
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              -o "snapshot/${label}_JOBS.json" || true
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              -o "snapshot/${label}_ARTIFACTS.json" || true
          done < snapshot/RUN_IDS.tsv
          find snapshot -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > snapshot/SHA256SUMS.txt

      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PANAX_RDRP_VALIDATION_STATUS
          path: snapshot
          if-no-files-found: error
          retention-days: 7
