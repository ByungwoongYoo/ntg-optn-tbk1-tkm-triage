name: Snapshot Panax RdRP validation status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/panax-rdrp-validation-status.yml'
      - '.github/workflows/panax-rdrp-validation-observer.yml'

permissions:
  contents: read
  actions: read

env:
  EXPECTED_HEAD_SHA: 1d277f493d64df008bcbd06c74100fb6d5c7ef20

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Query exact validation workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/panax-rdrp-validation.yml/runs?branch=panax-rdrp-validation-20260818&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -o snapshot/all_runs.json
          python - <<'PY'
          import json, os, pathlib
          data=json.load(open('snapshot/all_runs.json'))
          expected=os.environ['EXPECTED_HEAD_SHA']
          matches=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==expected]
          out={
            'expected_head_sha':expected,
            'match_count':len(matches),
            'matches':[{
              'id':r.get('id'),'status':r.get('status'),'conclusion':r.get('conclusion'),
              'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),
              'run_attempt':r.get('run_attempt'),'html_url':r.get('html_url'),
              'artifacts_url':r.get('artifacts_url'),'jobs_url':r.get('jobs_url')
            } for r in matches]
          }
          pathlib.Path('snapshot/VALIDATION_STATUS.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if matches:
            pathlib.Path('snapshot/RUN_ID.txt').write_text(str(matches[0]['id'])+'\n')
          PY
          if [[ -s snapshot/RUN_ID.txt ]]; then
            run_id="$(cat snapshot/RUN_ID.txt)"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              -o snapshot/JOBS.json || true
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              -o snapshot/ARTIFACTS.json || true
          fi
          find snapshot -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > snapshot/SHA256SUMS.txt

      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PANAX_RDRP_VALIDATION_STATUS
          path: snapshot
          if-no-files-found: error
          retention-days: 7
