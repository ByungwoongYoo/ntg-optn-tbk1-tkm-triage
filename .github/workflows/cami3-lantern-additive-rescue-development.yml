name: CAMI III LANTERN additive-rescue development audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-additive-rescue-development.yml'
      - 'lantern_cami3/scripts/build_additive_rescue.py'
      - 'lantern_cami3/scripts/evaluate_gold_coverage.py'
      - 'lantern_cami3/scripts/verify_cami_assembly.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  UPSTREAM_RUN_ID: '32313703218'
  UPSTREAM_ARTIFACT: 'LANTERN_CAMI3_TOY_SHORT_BENCHMARK_20260819'

jobs:
  additive-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen sample-0/1 development artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.UPSTREAM_ARTIFACT }}
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-additive
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
          cache-downloads: true
          post-cleanup: all

      - name: Locate immutable development inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=$(find upstream -type d -name lantern_short_benchmark | head -1)
          test -n "$root"
          for f in \
            "$root/assemblies/megahit_longitudinal/final.contigs.fa" \
            "$root/truth_blind/clusters/cluster_representatives.fasta" \
            "$root/truth_blind/clusters/representative_metadata.tsv" \
            "$root/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv" \
            "$root/truth/combined_truth.fasta" \
            "$root/truth/truth_mapping.tsv" \
            "$root/truth_blind/TRUTH_BLIND_FREEZE.json"; do
              test -s "$f"
          done
          printf '%s\n' "$root" > /tmp/root
          mkdir -p additive_dev/{variants,evaluation,decision,provenance,logs}
          printf 'development_samples=sample0,sample1\nupstream_run=%s\nupstream_artifact=%s\n' "$UPSTREAM_RUN_ID" "$UPSTREAM_ARTIFACT" > additive_dev/provenance/BOUNDARY.txt
          git rev-parse HEAD > additive_dev/provenance/GIT_HEAD.txt
          cp "$root/truth_blind/TRUTH_BLIND_FREEZE.json" additive_dev/provenance/
          sha256sum \
            "$root/assemblies/megahit_longitudinal/final.contigs.fa" \
            "$root/truth_blind/clusters/cluster_representatives.fasta" \
            "$root/truth_blind/clusters/representative_metadata.tsv" \
            "$root/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv" \
            "$root/truth/combined_truth.fasta" \
            "$root/truth/truth_mapping.tsv" \
            lantern_cami3/scripts/build_additive_rescue.py \
            lantern_cami3/scripts/evaluate_gold_coverage.py \
            > additive_dev/provenance/INPUT_CODE_SHA256.txt

      - name: Build small prespecified additive rescue family without reading truth
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=$(cat /tmp/root)
          common=(
            --baseline-fasta "$root/assemblies/megahit_longitudinal/final.contigs.fa"
            --representative-fasta "$root/truth_blind/clusters/cluster_representatives.fasta"
            --representative-metadata "$root/truth_blind/clusters/representative_metadata.tsv"
            --selection "$root/truth_blind/LANTERN_full/LANTERN_SELECTION.tsv"
            --baseline-source-id megahit_pair
          )
          python lantern_cami3/scripts/build_additive_rescue.py "${common[@]}" --mode rescue_all --min-score 0 --min-breadth 0 --min-length 1000 --min-timepoints 1 --out additive_dev/variants/additive_rescue_all
          python lantern_cami3/scripts/build_additive_rescue.py "${common[@]}" --mode selected_nonbaseline --min-score 0 --min-breadth 0 --min-length 1000 --min-timepoints 1 --out additive_dev/variants/additive_selected_nonbaseline
          python lantern_cami3/scripts/build_additive_rescue.py "${common[@]}" --mode rescue_high --min-score 0.40 --min-breadth 0.80 --min-length 1000 --min-timepoints 2 --out additive_dev/variants/additive_rescue_high
          python lantern_cami3/scripts/build_additive_rescue.py "${common[@]}" --mode rescue_strict --min-score 0.45 --min-breadth 0.95 --min-length 1500 --min-timepoints 2 --out additive_dev/variants/additive_rescue_strict
          python lantern_cami3/scripts/build_additive_rescue.py "${common[@]}" --mode rescue_length --min-score 0.28 --min-breadth 0.50 --min-length 1500 --min-timepoints 2 --out additive_dev/variants/additive_rescue_length
          for fasta in additive_dev/variants/*/ADDITIVE_ASSEMBLY.fasta; do
            name=$(basename "$(dirname "$fasta")")
            python lantern_cami3/scripts/verify_cami_assembly.py "$fasta" --out "$(dirname "$fasta")/VALIDATION.json"
            sha256sum "$fasta" > "$(dirname "$fasta")/ASSEMBLY_SHA256.txt"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          variants=[]
          for p in sorted(Path('additive_dev/variants').glob('*/ADDITIVE_SUMMARY.json')):
              x=json.loads(p.read_text()); x['variant']=p.parent.name; x['assembly_sha256']=hashlib.sha256((p.parent/'ADDITIVE_ASSEMBLY.fasta').read_bytes()).hexdigest(); variants.append(x)
          Path('additive_dev/provenance/PRE_EVALUATION_VARIANT_FREEZE.json').write_text(json.dumps({'development_samples':['sample0','sample1'],'truth_used_for_construction':False,'variants':variants,'boundary':'Variant family and assemblies were fixed before the development gold evaluation step.'},indent=2)+'\n')
          PY

      - name: Build reusable truth index and evaluate baseline plus variants
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=$(cat /tmp/root)
          minimap2 -I 4G -d additive_dev/toy_truth.mmi "$root/truth/combined_truth.fasta" > additive_dev/logs/TRUTH_INDEX.stdout 2> additive_dev/logs/TRUTH_INDEX.log
          printf 'method\tfasta\n' > additive_dev/provenance/METHODS.tsv
          printf 'megahit_pair\t%s\n' "$root/assemblies/megahit_longitudinal/final.contigs.fa" >> additive_dev/provenance/METHODS.tsv
          for fasta in additive_dev/variants/*/ADDITIVE_ASSEMBLY.fasta; do
            printf '%s\t%s\n' "$(basename "$(dirname "$fasta")")" "$fasta" >> additive_dev/provenance/METHODS.tsv
          done
          tail -n +2 additive_dev/provenance/METHODS.tsv | while IFS=$'\t' read -r name fasta; do
            dir="additive_dev/evaluation/$name"; mkdir -p "$dir"
            minimap2 -x asm5 -c -N 100 -t 4 additive_dev/toy_truth.mmi "$fasta" > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py --paf "$dir/assembly_to_truth.paf" --truth-mapping "$root/truth/truth_mapping.tsv" --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" > "$dir/evaluate_console.log" 2>&1
            rm -f "$dir/assembly_to_truth.paf"
          done
          rm -f additive_dev/toy_truth.mmi

      - name: Select one development rule under fixed safety constraints and freeze it
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path('additive_dev')
          base=json.loads((root/'evaluation/megahit_pair/GOLD_COVERAGE_SUMMARY.json').read_text())
          rows=[]
          for p in sorted((root/'variants').glob('*/ADDITIVE_SUMMARY.json')):
              name=p.parent.name; summary=json.loads(p.read_text()); score=json.loads((root/f'evaluation/{name}/GOLD_COVERAGE_SUMMARY.json').read_text())
              gf=float(score['genome_fraction_percent'])-float(base['genome_fraction_percent'])
              mean=100*(float(score['mean_genome_recovery'])-float(base['mean_genome_recovery']))
              bchim=float(base['cross_binid_chimeric_bp_fraction'] or 0); schim=float(score['cross_binid_chimeric_bp_fraction'] or 0)
              rel_chim=(schim-bchim)/bchim if bchim else (0 if schim==0 else None)
              align_increase=float(score['alignment_to_unique_truth_ratio'] or 0)-float(base['alignment_to_unique_truth_ratio'] or 0)
              safe=(gf>0 and rel_chim is not None and rel_chim<=0.10 and align_increase<=0.10)
              rows.append({'variant':name,'genome_fraction_gain_pp':gf,'mean_recovery_gain_pp':mean,'relative_chimera_change':rel_chim,'alignment_ratio_increase':align_increase,'safe_development_candidate':str(safe).lower(),**summary})
          safe=[r for r in rows if r['safe_development_candidate']=='true']
          winner=max(safe,key=lambda r:(r['genome_fraction_gain_pp'],r['mean_recovery_gain_pp'],-r['relative_chimera_change'],-r['added_contigs'])) if safe else None
          with open(root/'decision/ADDITIVE_DEVELOPMENT_COMPARISON.csv','w',newline='') as f:
              fields=[]
              for r in rows:
                  for k in r:
                      if k not in fields:fields.append(k)
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          freeze={'status':'WINNER_FROZEN_FOR_UNTOUCHED_PAIR_VALIDATION' if winner else 'NO_SAFE_ADDITIVE_WINNER','development_samples':['sample0','sample1'],'winner':winner,'selection_order':['maximum genome-fraction gain','maximum mean-recovery gain','minimum relative chimera change','minimum added-contig count'],'safety_constraints':{'genome_fraction_gain_pp':'>0','relative_chimera_change':'<=0.10','alignment_ratio_increase':'<=0.10'},'builder_sha256':hashlib.sha256(Path('lantern_cami3/scripts/build_additive_rescue.py').read_bytes()).hexdigest(),'claim_boundary':'Gold-informed choice is development-only. No result is promoted unless the exact frozen rule succeeds without modification on an untouched Toy participant pair.'}
          (root/'decision/ADDITIVE_DEVELOPMENT_FREEZE.json').write_text(json.dumps(freeze,indent=2)+'\n')
          lines=['# Additive rescue development decision','',f"- Status: **{freeze['status']}**"]
          if winner:
              lines += [f"- Frozen winner: `{winner['variant']}`",f"- Development genome-fraction gain: **{winner['genome_fraction_gain_pp']:.4f} percentage points**",f"- Added contigs: **{winner['added_contigs']}**",f"- Relative chimera change: **{winner['relative_chimera_change']:.4f}**"]
          lines += ['','This is a development-pair selection only. The next step is untouched participant-pair validation with no threshold changes.']
          (root/'decision/ADDITIVE_DEVELOPMENT_DECISION.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(freeze,indent=2))
          PY
          cat additive_dev/decision/ADDITIVE_DEVELOPMENT_DECISION.md

      - name: Remove bulky immutable inputs and finalize compact evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          rm -f additive_dev/variants/*/ADDITIVE_ASSEMBLY.fasta additive_dev/toy_truth.mmi additive_dev/evaluation/*/assembly_to_truth.paf 2>/dev/null || true
          find additive_dev -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > additive_dev/SHA256SUMS_ALL.txt || true
          find additive_dev -type f -printf '%P\t%s\n' | sort > additive_dev/CONTENTS.tsv || true
          du -sh additive_dev > additive_dev/PACKAGE_SIZE.txt || true

      - name: Upload additive-rescue development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_ADDITIVE_RESCUE_DEVELOPMENT_20260820
          path: additive_dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
