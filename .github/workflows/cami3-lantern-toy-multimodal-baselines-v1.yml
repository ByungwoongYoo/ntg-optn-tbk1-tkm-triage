name: CAMI III Toy pair short-long-hybrid baseline benchmark v1

on:
  pull_request:
    branches: [cami3-lantern-20260819]
    paths:
      - '.github/workflows/cami3-lantern-toy-multimodal-baselines-v1.yml'
      - 'lantern_cami3/scripts/evaluate_gold_coverage.py'
      - 'lantern_cami3/scripts/extract_gsa_truth.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  READ_RUN_ID: '32285680342'
  READ_ARTIFACT_PATTERN: 'LANTERN_CAMI3_TOY_READS_S*_V1'

jobs:
  multimodal-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen S0/S1 short and long read artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.READ_ARTIFACT_PATTERN }}
          path: read_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.READ_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cami-multimodal
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            megahit=1.2.9
            spades=4.3.0
            flye
            minimap2=2.31
            seqkit
            quast=5.3.0
            tabulate
          cache-downloads: true
          post-cleanup: all

      - name: Locate exact inputs and build paired longitudinal files
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          mkdir -p "$ROOT"/{reads,assemblies,logs,provenance,failure_audit,truth_blind,evaluation,truth_download,truth,metaquast,validation}
          for s in 0 1; do
            artifact_dir=$(dirname "$(find read_artifacts -type f -name "S${s}_R1.fastq.gz" | head -1)")
            test -d "$artifact_dir"
            for kind in R1 R2 long; do
              src="$artifact_dir/S${s}_${kind}.fastq.gz"
              test -s "$src"
              ln -s "$PWD/$src" "$ROOT/reads/S${s}_${kind}.fastq.gz"
              gzip -t "$ROOT/reads/S${s}_${kind}.fastq.gz"
            done
            if test -s "$artifact_dir/READ_STATS.json"; then cp "$artifact_dir/READ_STATS.json" "$ROOT/provenance/S${s}_READ_STATS.json"; fi
            if test -s "$artifact_dir/SHA256SUMS.txt"; then cp "$artifact_dir/SHA256SUMS.txt" "$ROOT/provenance/S${s}_UPSTREAM_SHA256SUMS.txt"; fi
            find "$artifact_dir" -maxdepth 2 -type f -printf '%p\t%s\n' | sort > "$ROOT/provenance/S${s}_ARTIFACT_FILE_LIST.tsv"
          done
          gzip -cd "$ROOT/reads/S0_R1.fastq.gz" "$ROOT/reads/S1_R1.fastq.gz" | gzip -1 > "$ROOT/reads/pair_R1.fastq.gz"
          gzip -cd "$ROOT/reads/S0_R2.fastq.gz" "$ROOT/reads/S1_R2.fastq.gz" | gzip -1 > "$ROOT/reads/pair_R2.fastq.gz"
          gzip -cd "$ROOT/reads/S0_long.fastq.gz" "$ROOT/reads/S1_long.fastq.gz" | gzip -1 > "$ROOT/reads/pair_long.fastq.gz"
          gzip -t "$ROOT/reads/pair_R1.fastq.gz" "$ROOT/reads/pair_R2.fastq.gz" "$ROOT/reads/pair_long.fastq.gz"
          seqkit stats -T "$ROOT"/reads/*.fastq.gz > "$ROOT/provenance/READ_STATS.tsv"
          sha256sum "$ROOT"/reads/*.fastq.gz > "$ROOT/provenance/READ_SHA256SUMS.txt"
          git rev-parse HEAD > "$ROOT/provenance/GIT_HEAD.txt"
          uname -a > "$ROOT/provenance/UNAME.txt"
          python --version > "$ROOT/provenance/PYTHON_VERSION.txt"
          megahit --version > "$ROOT/provenance/MEGAHIT_VERSION.txt" 2>&1
          metaspades.py --version > "$ROOT/provenance/METASPADES_VERSION.txt" 2>&1
          flye --version > "$ROOT/provenance/FLYE_VERSION.txt" 2>&1
          minimap2 --version > "$ROOT/provenance/MINIMAP2_VERSION.txt"
          metaquast.py --version > "$ROOT/provenance/METAQUAST_VERSION.txt" 2>&1 || true
          micromamba list > "$ROOT/provenance/MICROMAMBA_LIST.txt"
          printf 'upstream_read_run=%s\ntruth_accessed=false\n' "$READ_RUN_ID" > "$ROOT/provenance/FROZEN_INPUTS.txt"

      - name: Run truth-blind short, long, and hybrid baselines
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          run_one() {
            local name="$1"; shift
            set +e
            /usr/bin/time -v timeout --signal=TERM --kill-after=120s 210m "$@" > "$ROOT/logs/${name}.log" 2>&1
            rc=$?
            set -e
            printf 'name=%s\nexit_code=%s\ncommand=' "$name" "$rc" > "$ROOT/failure_audit/${name}.status"
            printf '%q ' "$@" >> "$ROOT/failure_audit/${name}.status"; printf '\n' >> "$ROOT/failure_audit/${name}.status"
          }
          run_one megahit_short_pair \
            megahit -1 "$ROOT/reads/pair_R1.fastq.gz" -2 "$ROOT/reads/pair_R2.fastq.gz" \
            -o "$ROOT/assemblies/megahit_short_pair" --min-contig-len 1000 -t 4 --memory 0.8
          run_one metaspades_short_pair \
            metaspades.py --only-assembler -t 4 -m 12 \
            -1 "$ROOT/reads/pair_R1.fastq.gz" -2 "$ROOT/reads/pair_R2.fastq.gz" \
            -o "$ROOT/assemblies/metaspades_short_pair"
          run_one flye_long_s0 \
            flye --nano-hq "$ROOT/reads/S0_long.fastq.gz" --meta --threads 4 \
            --out-dir "$ROOT/assemblies/flye_long_s0"
          run_one flye_long_s1 \
            flye --nano-hq "$ROOT/reads/S1_long.fastq.gz" --meta --threads 4 \
            --out-dir "$ROOT/assemblies/flye_long_s1"
          run_one flye_long_pair \
            flye --nano-hq "$ROOT/reads/pair_long.fastq.gz" --meta --threads 4 \
            --out-dir "$ROOT/assemblies/flye_long_pair"
          run_one metaspades_hybrid_pair \
            metaspades.py --only-assembler -t 4 -m 12 \
            -1 "$ROOT/reads/pair_R1.fastq.gz" -2 "$ROOT/reads/pair_R2.fastq.gz" \
            --nanopore "$ROOT/reads/pair_long.fastq.gz" \
            -o "$ROOT/assemblies/metaspades_hybrid_pair"

      - name: Freeze every successful baseline before gold access
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          cat > "$ROOT/truth_blind/METHOD_PATHS.tsv" <<'EOF'
          method	mode	scope	fasta
          EOF
          add() { test -s "$4" && printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" >> "$ROOT/truth_blind/METHOD_PATHS.tsv"; }
          add megahit_short_pair short longitudinal "$ROOT/assemblies/megahit_short_pair/final.contigs.fa"
          add metaspades_short_pair short longitudinal "$ROOT/assemblies/metaspades_short_pair/contigs.fasta"
          add flye_long_s0 long single "$ROOT/assemblies/flye_long_s0/assembly.fasta"
          add flye_long_s1 long single "$ROOT/assemblies/flye_long_s1/assembly.fasta"
          add flye_long_pair long longitudinal "$ROOT/assemblies/flye_long_pair/assembly.fasta"
          add metaspades_hybrid_pair hybrid longitudinal "$ROOT/assemblies/metaspades_hybrid_pair/contigs.fasta"
          n=$(( $(wc -l < "$ROOT/truth_blind/METHOD_PATHS.tsv") - 1 ))
          echo "successful_baselines=$n" > "$ROOT/provenance/SUCCESSFUL_BASELINE_COUNT.txt"
          test "$n" -ge 3
          tail -n +2 "$ROOT/truth_blind/METHOD_PATHS.tsv" | cut -f4 | xargs sha256sum > "$ROOT/provenance/TRUTH_BLIND_BASELINE_SHA256SUMS.txt"
          python - "$ROOT" <<'PY'
          import csv,hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for r in csv.DictReader(open(root/'truth_blind/METHOD_PATHS.tsv'),delimiter='\t'):
              p=Path(r['fasta']); rows.append({**r,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          obj={'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'truth_accessed':False,'methods':rows,'boundary':'All short, long, and hybrid assemblies were completed and hashed before the public Toy gold standard was downloaded.'}
          (root/'truth_blind/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(obj,indent=2)+'\n');print(json.dumps(obj,indent=2))
          PY

      - name: Download public Toy gold only after baseline freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$ROOT/truth_download/sample_${s}_gsa.tar.gz"
          done
          sha256sum "$ROOT/truth_download"/*.tar.gz > "$ROOT/provenance/GSA_SHA256SUMS.txt"
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "S0=$ROOT/truth_download/sample_0_gsa.tar.gz" \
            --gsa-tar "S1=$ROOT/truth_download/sample_1_gsa.tar.gz" \
            --out "$ROOT/truth" > "$ROOT/logs/EXTRACT_TRUTH.log" 2>&1

      - name: Evaluate all frozen baselines
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          while IFS=$'\t' read -r method mode scope fasta; do
            test "$method" = method && continue
            out="$ROOT/evaluation/$method"; mkdir -p "$out"
            minimap2 -x asm5 -c -N 100 -t 4 "$ROOT/truth/combined_truth.fasta" "$fasta" > "$out/assembly_to_truth.paf" 2> "$out/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py \
              --paf "$out/assembly_to_truth.paf" --truth-mapping "$ROOT/truth/truth_mapping.tsv" \
              --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$out" > "$out/evaluate_console.log"
          done < "$ROOT/truth_blind/METHOD_PATHS.tsv"
          python - "$ROOT" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for r in csv.DictReader(open(root/'truth_blind/METHOD_PATHS.tsv'),delimiter='\t'):
              s=json.loads((root/'evaluation'/r['method']/'GOLD_COVERAGE_SUMMARY.json').read_text())
              rows.append({**r,'genome_fraction_percent':s['genome_fraction_percent'],'mean_genome_recovery_percent':100*s['mean_genome_recovery'],'genomes_recovered_50':s['genomes_recovered_50'],'genomes_recovered_90':s['genomes_recovered_90'],'assembly_contigs_total':s['assembly_contigs_total'],'assembly_total_bp':s['assembly_total_bp'],'cross_binid_chimera_bp_fraction':s['cross_binid_chimeric_bp_fraction'],'alignment_to_unique_truth_ratio':s['alignment_to_unique_truth_ratio']})
          rows.sort(key=lambda x:(-x['genome_fraction_percent'],-x['mean_genome_recovery_percent'],x['method']))
          with open(root/'evaluation/MULTIMODAL_BASELINE_RESULTS.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          best=rows[0]
          summary={'status':'COMPLETE','n_successful_baselines':len(rows),'best_overall':best,'best_by_mode':{},'truth_blind_freeze_verified':True,'claim_boundary':'Public Toy baseline comparison only; not hidden CAMI challenge performance or rank.'}
          for mode in sorted({r['mode'] for r in rows}):
              summary['best_by_mode'][mode]=max((r for r in rows if r['mode']==mode),key=lambda x:x['genome_fraction_percent'])
          (root/'evaluation/MULTIMODAL_BASELINE_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n');print(json.dumps(summary,indent=2))
          PY

      - name: Attempt official-style MetaQUAST sensitivity audit
        shell: micromamba-shell {0}
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT=multimodal_baselines
          python - "$ROOT" <<'PY'
          import csv,sys
          from pathlib import Path
          root=Path(sys.argv[1]); refs=[r['reference_path'] for r in csv.DictReader(open(root/'truth/genome_reference_manifest.tsv'),delimiter='\t') if int(r['truth_bp'])>=50000]
          Path('/tmp/meta_refs').write_text(','.join(refs)); print({'references':len(refs)})
          PY
          ASMS=(); LABELS=()
          while IFS=$'\t' read -r method mode scope fasta; do
            test "$method" = method && continue; ASMS+=("$fasta"); LABELS+=("$method")
          done < "$ROOT/truth_blind/METHOD_PATHS.tsv"
          labels=$(IFS=,; echo "${LABELS[*]}")
          metaquast.py "${ASMS[@]}" --labels "$labels" -r "$(cat /tmp/meta_refs)" \
            --min-contig 1000 --threads 4 --max-ref-number 10000 -o "$ROOT/metaquast" > "$ROOT/metaquast_console.log" 2>&1

      - name: Compact evidence and remove retrievable public raw files
        if: always()
        shell: micromamba-shell {0}
        run: |
          ROOT=multimodal_baselines
          rm -rf "$ROOT/reads" "$ROOT/truth_download" "$ROOT/truth/references"
          rm -f "$ROOT/truth/combined_truth.fasta"
          find "$ROOT" -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS_ALL.txt" || true
          du -ah "$ROOT" | sort -h > "$ROOT/FILE_SIZES.txt" || true

      - name: Upload compact multimodal baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_MULTIMODAL_BASELINES_V1_20260820
          path: multimodal_baselines
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
