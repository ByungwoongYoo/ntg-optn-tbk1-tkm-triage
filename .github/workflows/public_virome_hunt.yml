name: Public-sequence RNA virome hunt

on:
  push:
    branches:
      - public-virome-hunt-20260818
    paths:
      - 'virus_hunt/**'
      - '.github/workflows/public_virome_hunt.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PALM_ANNOT_COMMIT: 75504eb3c9bfb9aa1d6c6d1c0ac11e05880f73f2
  PALMDB_SOTU_URL: https://s3.amazonaws.com/palm.db/2023-04-24/final/sotus.palmprint.faa

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select recent medicinal-plant RNA-seq runs
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          cd virus_hunt
          python3 select_runs.py > matrix.stdout.json
          cp matrix.json ../matrix.json
          cp selected_runs.tsv ../selected_runs.tsv
          cp selection_audit.json ../selection_audit.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          cat selected_runs.tsv
      - name: Upload selection audit
        uses: actions/upload-artifact@v4
        with:
          name: selection-metadata
          path: |
            matrix.json
            selected_runs.tsv
            selection_audit.json
          retention-days: 30

  prepare_tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch pinned palm_annot and PALMdb sOTUs
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/rcedgar/palm_annot.git toolkit/palm_annot
          cd toolkit/palm_annot
          git checkout "$PALM_ANNOT_COMMIT" || git checkout master
          chmod +x bin/* py/*
          # Use the repository's explicitly bug-fixed PalmScan binary.
          cp -f bin/palmscan2_minscore_bugfixed bin/palmscan2
          cd ../..
          curl -fL --retry 5 --retry-delay 5 "$PALMDB_SOTU_URL" -o toolkit/sotus.palmprint.faa
          toolkit/palm_annot/bin/diamond makedb \
            --in toolkit/sotus.palmprint.faa \
            --db toolkit/palmdb_sotu
          toolkit/palm_annot/bin/diamond version
          toolkit/palm_annot/bin/palmscan2 -version || true
          sha256sum toolkit/sotus.palmprint.faa toolkit/palmdb_sotu.dmnd > toolkit/TOOLKIT_SHA256SUMS.txt
          git -C toolkit/palm_annot rev-parse HEAD > toolkit/PALM_ANNOT_COMMIT.txt
      - name: Upload pinned toolkit
        uses: actions/upload-artifact@v4
        with:
          name: virome-toolkit
          path: toolkit
          retention-days: 30
          compression-level: 1

  scan:
    needs: [discover, prepare_tools]
    if: ${{ needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ACCESSION: ${{ matrix.accession }}
      TARGET_LABEL: ${{ matrix.label }}
      BIOPROJECT: ${{ matrix.bioproject }}
      ORGANISM: ${{ matrix.organism }}
      RELEASE_DATE: ${{ matrix.release_date }}
      EXPECTED_SIZE_MB: ${{ matrix.size_mb }}
      SELECTION_REASON: ${{ matrix.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: virome-toolkit
          path: toolkit
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          chmod +x toolkit/palm_annot/bin/* toolkit/palm_annot/py/*
          echo "$PWD/toolkit/palm_annot/bin" >> "$GITHUB_PATH"
          echo "$PWD/toolkit/palm_annot/py" >> "$GITHUB_PATH"
          mkdir -p "scan_${ACCESSION}"
          cat > "scan_${ACCESSION}/metadata.json" <<EOF
          {
            "accession": "${ACCESSION}",
            "target_label": "${TARGET_LABEL}",
            "bioproject": "${BIOPROJECT}",
            "organism": "${ORGANISM}",
            "release_date": "${RELEASE_DATE}",
            "expected_size_mb": "${EXPECTED_SIZE_MB}",
            "selection_reason": "${SELECTION_REASON}",
            "logan_object": "s3://logan-pub/c/${ACCESSION}/${ACCESSION}.contigs.fa.zst"
          }
          EOF
      - name: Download and filter Logan contigs
        id: contigs
        shell: bash
        run: |
          set -euo pipefail
          OUT="scan_${ACCESSION}"
          URL="https://s3.amazonaws.com/logan-pub/c/${ACCESSION}/${ACCESSION}.contigs.fa.zst"
          echo "Downloading $URL"
          if ! curl -fL --retry 4 --retry-delay 10 --connect-timeout 30 \
              "$URL" -o "$OUT/${ACCESSION}.contigs.fa.zst"; then
            echo '{"status":"logan_object_unavailable"}' > "$OUT/download_status.json"
            touch "$OUT/filtered_contigs.fa" "$OUT/palm.fev" "$OUT/rdrp.faa" "$OUT/fullnt.fna" "$OUT/palmdb_hits.tsv"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          stat -c '{"compressed_bytes":%s}' "$OUT/${ACCESSION}.contigs.fa.zst" > "$OUT/download_status.json"
          zstd -t "$OUT/${ACCESSION}.contigs.fa.zst"
          zstdcat "$OUT/${ACCESSION}.contigs.fa.zst" \
            | python3 virus_hunt/filter_fasta.py --min-len 600 --max-len 100000 \
                > "$OUT/filtered_contigs.fa" \
                2> "$OUT/filter_summary.json"
          sha256sum "$OUT/${ACCESSION}.contigs.fa.zst" > "$OUT/source_object_sha256.txt"
          rm -f "$OUT/${ACCESSION}.contigs.fa.zst"
          ls -lh "$OUT/filtered_contigs.fa"
          df -h .
      - name: Detect high-confidence RdRP palm domains
        if: ${{ steps.contigs.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="scan_${ACCESSION}"
          if [[ ! -s "$OUT/filtered_contigs.fa" ]]; then
            touch "$OUT/palm.fev" "$OUT/rdrp.faa" "$OUT/fullnt.fna"
            exit 0
          fi
          # palm_annot integrates PSSM, HMM and DIAMOND motif evidence.
          timeout 180m python3 toolkit/palm_annot/py/palm_annot.py \
            --input "$OUT/filtered_contigs.fa" \
            --seqtype nt \
            --fev "$OUT/palm.fev" \
            --rdrp "$OUT/rdrp.faa" \
            --fullnt "$OUT/fullnt.fna" \
            --minscore 75 \
            --minpssmscore 20 \
            --threads 4 \
            --tmpdir "$RUNNER_TEMP" \
            2>&1 | tee "$OUT/palm_annot.log"
          [[ -f "$OUT/palm.fev" ]] || touch "$OUT/palm.fev"
          [[ -f "$OUT/rdrp.faa" ]] || touch "$OUT/rdrp.faa"
          [[ -f "$OUT/fullnt.fna" ]] || touch "$OUT/fullnt.fna"
      - name: Compare candidates with 2023 PALMdb sOTUs
        shell: bash
        run: |
          set -euo pipefail
          OUT="scan_${ACCESSION}"
          touch "$OUT/palmdb_hits.tsv"
          if [[ -s "$OUT/rdrp.faa" ]]; then
            toolkit/palm_annot/bin/diamond blastp \
              --query "$OUT/rdrp.faa" \
              --db toolkit/palmdb_sotu.dmnd \
              --out "$OUT/palmdb_hits.tsv" \
              --outfmt 6 qseqid sseqid pident length qlen slen evalue bitscore qcovhsp scovhsp qstart qend \
              --max-target-seqs 10 \
              --sensitive \
              --threads 4 \
              --evalue 1e-3 || true
          fi
      - name: Build accession-level audit report
        shell: bash
        run: |
          set -euo pipefail
          OUT="scan_${ACCESSION}"
          [[ -f "$OUT/palm.fev" ]] || touch "$OUT/palm.fev"
          [[ -f "$OUT/rdrp.faa" ]] || touch "$OUT/rdrp.faa"
          [[ -f "$OUT/fullnt.fna" ]] || touch "$OUT/fullnt.fna"
          [[ -f "$OUT/palmdb_hits.tsv" ]] || touch "$OUT/palmdb_hits.tsv"
          python3 virus_hunt/candidate_report.py \
            --accession "$ACCESSION" \
            --label "$TARGET_LABEL" \
            --bioproject "$BIOPROJECT" \
            --organism "$ORGANISM" \
            --fev "$OUT/palm.fev" \
            --rdrp "$OUT/rdrp.faa" \
            --fullnt "$OUT/fullnt.fna" \
            --diamond "$OUT/palmdb_hits.tsv" \
            --output "$OUT/candidate_summary.tsv" \
            --json "$OUT/summary.json" \
            --markdown "$OUT/REPORT.md"
          rm -f "$OUT/filtered_contigs.fa"
          find "$OUT" -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          cat "$OUT/REPORT.md"
      - name: Upload accession result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.accession }}
          path: scan_${{ matrix.accession }}
          retention-days: 30
          compression-level: 6

  aggregate:
    needs: [discover, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: selection-metadata
          path: selection
      - name: Aggregate, rank and hash
        shell: bash
        run: |
          set -euo pipefail
          python3 virus_hunt/aggregate_reports.py | tee aggregate_console.txt
          cp -r selection aggregate/selection
          cp aggregate_console.txt aggregate/
          find aggregate -type f -print0 | sort -z | xargs -0 sha256sum > aggregate/OUTER_SHA256SUMS.txt
      - name: Upload first-pass evidence package
        uses: actions/upload-artifact@v4
        with:
          name: PUBLIC_VIROME_HUNT_FIRST_PASS_20260818
          path: aggregate
          retention-days: 30
          compression-level: 9
