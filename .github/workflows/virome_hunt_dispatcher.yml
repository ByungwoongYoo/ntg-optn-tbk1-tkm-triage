name: Dispatch public virome hunt from PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'virus_hunt/RUN_REQUEST.md'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch full virome hunt on the PR branch
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching public_virome_hunt.yml at ref ${HEAD_REF} (${HEAD_SHA})"
          gh workflow run public_virome_hunt.yml --repo "$REPO" --ref "$HEAD_REF"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --repo "$REPO" \
              --workflow public_virome_hunt.yml \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId" \
              | head -n1)
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not resolve dispatched workflow run ID" >&2
            exit 1
          fi
          echo "$run_id" | tee dispatched_run_id.txt
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Wait for the full workflow
        shell: bash
        run: |
          set -o pipefail
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 20 \
            2>&1 | tee dispatched_run_watch.log

      - name: Download final evidence artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dispatched_results
          if [[ -n "${RUN_ID:-}" ]]; then
            gh run view "$RUN_ID" --repo "$REPO" --json databaseId,status,conclusion,headSha,event,url \
              > dispatched_results/dispatched_run.json || true
            gh run download "$RUN_ID" --repo "$REPO" \
              --name PUBLIC_VIROME_HUNT_FIRST_PASS_20260818 \
              --dir dispatched_results/final_evidence || true
            gh run view "$RUN_ID" --repo "$REPO" --log-failed \
              > dispatched_results/failed_logs.txt 2>&1 || true
          fi
          cp dispatched_run_id.txt dispatched_results/ 2>/dev/null || true
          cp dispatched_run_watch.log dispatched_results/ 2>/dev/null || true
          find dispatched_results -type f -print0 | sort -z | xargs -0 sha256sum \
            > dispatched_results/SHA256SUMS.txt

      - name: Upload observable result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DISPATCHED_VIROME_RESULTS
          path: dispatched_results
          retention-days: 30
          compression-level: 9
