name: Matched deep-residual BioProject-held-out K. pneumoniae colistin unitig GWAS

on:
  pull_request:
    branches: [amr-kp-colistin-targeted-portal-gwas-20260819]
    paths:
      - '.github/workflows/amr-kp-colistin-matched-deep-residual-unitig-gwas.yml'
      - 'amr_discovery/select_stable_unitigs.py'
      - 'amr_discovery/evaluate_portal_unitig_replication.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  UPSTREAM_RUN_ID: '32216116031'
  UPSTREAM_ARTIFACT: 'KP_COLISTIN_DEEP_RESIDUAL_MATCHED_TARGETED_GWAS_20260819'

jobs:
  matched-deep-residual-unitig:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen matched cohort and BioProject split
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.UPSTREAM_ARTIFACT }}
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: matched-unitig
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11 pandas=2.3.1 scipy biopython
            unitig-caller pyseer mash ncbi-datasets-cli tabulate
          cache-downloads: true
          post-cleanup: all

      - name: Verify and freeze cohort without viewing genomic candidates
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p matched_unitig/provenance
          cp upstream/gwas_inputs/gwas_sample_manifest.csv matched_unitig/gwas_sample_manifest.csv
          cp upstream/matching/MATCH_SUMMARY.json matched_unitig/MATCH_SUMMARY.json
          cp upstream/matching/MATCH_PAIRS.csv matched_unitig/MATCH_PAIRS.csv
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import pandas as pd
          m=pd.read_csv('matched_unitig/gwas_sample_manifest.csv',dtype={'assembly_ID':str,'BioProject':str})
          assert m.assembly_ID.is_unique
          assert len(m)==436
          assert m.phenotype.value_counts().to_dict()=={'R':218,'S':218}
          assert m.split.value_counts().to_dict()=={'discovery':302,'validation':134}
          assert m.loc[m.split.eq('discovery'),'phenotype'].value_counts().to_dict()=={'R':153,'S':149}
          assert m.loc[m.split.eq('validation'),'phenotype'].value_counts().to_dict()=={'S':69,'R':65}
          assert set(m.loc[m.split.eq('discovery'),'BioProject']).isdisjoint(set(m.loc[m.split.eq('validation'),'BioProject']))
          if m.has_sequence_known_colistin_evidence.fillna(False).astype(bool).any():
              raise SystemExit('Known Kleborate mechanism present in matched residual cohort')
          for name,sub in [('discovery',m[m.split.eq('discovery')]),('validation',m[m.split.eq('validation')]),('all',m)]:
              Path(f'matched_unitig/{name}_accessions.txt').write_text('\n'.join(sub.assembly_ID.astype(str))+'\n')
              y=sub[['assembly_ID','phenotype']].copy(); y.phenotype=y.phenotype.eq('R').astype(int); y.columns=['samples','phenotype']; y.to_csv(f'matched_unitig/{name}_phenotypes.tsv',sep='\t',index=False)
          summary={
            'n_all':len(m),'n_discovery':int((m.split=='discovery').sum()),'n_validation':int((m.split=='validation').sum()),
            'all_counts':m.phenotype.value_counts().to_dict(),
            'discovery_counts':m[m.split.eq('discovery')].phenotype.value_counts().to_dict(),
            'validation_counts':m[m.split.eq('validation')].phenotype.value_counts().to_dict(),
            'n_bioprojects':m.BioProject.nunique(),'n_discovery_bioprojects':m[m.split.eq('discovery')].BioProject.nunique(),'n_validation_bioprojects':m[m.split.eq('validation')].BioProject.nunique(),
            'bioproject_disjoint':True,
            'known_mechanism_filter':'No mcr-family call and no Kleborate-detected MgrB/PmrB inactivation',
            'selection_boundary':'The matched cohort and BioProject split were frozen before whole-genome unitig construction. Validation BioProjects remain untouched until candidate unitigs are selected.'}
          Path('matched_unitig/COHORT_FREEZE.json').write_text(json.dumps(summary,indent=2)+'\n')
          for p in [Path('upstream/matching/MATCH_SUMMARY.json'),Path('upstream/gwas_inputs/GWAS_INPUT_SUMMARY.json')]:
              Path('matched_unitig/provenance'/Path(p).name) if False else None
          print(json.dumps(summary,indent=2))
          PY
          cp upstream/gwas_inputs/GWAS_INPUT_SUMMARY.json matched_unitig/provenance/UPSTREAM_GWAS_INPUT_SUMMARY.json
          git rev-parse HEAD > matched_unitig/provenance/GIT_HEAD.txt
          printf 'upstream_run=%s\nupstream_artifact=%s\n' "$UPSTREAM_RUN_ID" "$UPSTREAM_ARTIFACT" > matched_unitig/provenance/UPSTREAM.txt
          uname -a > matched_unitig/provenance/UNAME.txt
          python --version > matched_unitig/provenance/PYTHON_VERSION.txt
          unitig-caller --version > matched_unitig/provenance/UNITIG_CALLER_VERSION.txt
          pyseer --version > matched_unitig/provenance/PYSEER_VERSION.txt
          mash --version > matched_unitig/provenance/MASH_VERSION.txt
          datasets version > matched_unitig/provenance/DATASETS_VERSION.txt
          micromamba list > matched_unitig/provenance/MICROMAMBA_LIST.txt

      - name: Download exact public assemblies
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p download assemblies
          ok=0
          for attempt in 1 2 3; do
            rm -f download/genomes.zip
            datasets download genome accession --inputfile matched_unitig/all_accessions.txt --include genome --filename download/genomes.zip --no-progressbar \
              2>&1 | tee "matched_unitig/provenance/DOWNLOAD_${attempt}.log" && unzip -tq download/genomes.zip && { ok=1; break; }
            sleep 20
          done
          [[ "$ok" == 1 ]]
          sha256sum download/genomes.zip > matched_unitig/provenance/GENOME_ZIP_SHA256.txt
          unzip -q download/genomes.zip -d download/package
          cp download/package/ncbi_dataset/data/assembly_data_report.jsonl matched_unitig/assembly_data_report.jsonl
          find download/package/ncbi_dataset/data -mindepth 2 -maxdepth 2 -type f -name '*.fna' -print0 | while IFS= read -r -d '' f; do
            acc=$(basename "$(dirname "$f")"); ln -s "$PWD/$f" "assemblies/${acc}.fna"
          done
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          m=pd.read_csv('matched_unitig/gwas_sample_manifest.csv',dtype={'assembly_ID':str})
          paths={p.stem:p for p in Path('assemblies').glob('*.fna')}
          def get(acc):
              if acc in paths:return str(paths[acc])
              base=acc.split('.')[0]; hits=[p for k,p in paths.items() if k.split('.')[0]==base]
              return str(hits[0]) if len(hits)==1 else None
          m['assembly_path_unitig']=m.assembly_ID.map(get)
          if m.assembly_path_unitig.isna().any(): raise SystemExit(m[m.assembly_path_unitig.isna()].assembly_ID.tolist()[:20])
          m.to_csv('matched_unitig/gwas_sample_manifest.csv',index=False)
          for name,sub in [('discovery',m[m.split.eq('discovery')]),('validation',m[m.split.eq('validation')]),('all',m)]:
              Path(f'matched_unitig/{name}_refs.txt').write_text('\n'.join(sub.assembly_path_unitig.astype(str))+'\n')
              got=[Path(v).stem for v in sub.assembly_path_unitig]
              want=sub.assembly_ID.astype(str).tolist()
              if got!=want: raise SystemExit(f'{name} path/accession mismatch: {list(zip(got[:3],want[:3]))}')
          PY
          rm -f download/genomes.zip

      - name: Build discovery-only unitigs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p matched_unitig/discovery_unitigs
          unitig-caller --call --refs matched_unitig/discovery_refs.txt --out matched_unitig/discovery_unitigs/discovery --pyseer --threads 4 \
            2>&1 | tee matched_unitig/discovery_unitigs/unitig_caller.log
          test -s matched_unitig/discovery_unitigs/discovery.pyseer
          wc -l < matched_unitig/discovery_unitigs/discovery.pyseer > matched_unitig/discovery_unitigs/N_UNITIG_TESTS.txt

      - name: Build exact-accession Mash matrices
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cat > /tmp/normalize_mash.py <<'PY'
          import re,sys
          from pathlib import Path
          import pandas as pd
          raw,refsfile,out=sys.argv[1:]
          refs=[Path(v.strip()).stem for v in open(refsfile) if v.strip()]
          bybase={r.split('.')[0]:r for r in refs}
          if len(bybase)!=len(refs): raise SystemExit('Non-unique accession bases')
          pat=re.compile(r'(GC[AF]_\d+(?:\.\d+)?)')
          def restore(v):
              m=pat.search(str(v))
              if not m: raise SystemExit(f'No assembly accession in Mash ID {v!r}')
              token=m.group(1)
              return token if token in refs else bybase.get(token.split('.')[0],token)
          x=pd.read_csv(raw,sep='\t',index_col=0)
          x.index=[restore(v) for v in x.index]; x.columns=[restore(v) for v in x.columns]
          if x.index.duplicated().any() or pd.Index(x.columns).duplicated().any(): raise SystemExit('Duplicate normalized Mash IDs')
          if set(x.index)!=set(refs): raise SystemExit(f'Mash mismatch missing={set(refs)-set(x.index)} extra={set(x.index)-set(refs)}')
          x.loc[refs,refs].to_csv(out,sep='\t')
          PY
          mkdir -p matched_unitig/structure
          for cohort in discovery all; do
            mash sketch -p 4 -s 10000 -l "matched_unitig/${cohort}_refs.txt" -o "matched_unitig/structure/${cohort}"
            mash dist "matched_unitig/structure/${cohort}.msh" "matched_unitig/structure/${cohort}.msh" | square_mash > "matched_unitig/structure/${cohort}_raw.tsv"
            python /tmp/normalize_mash.py "matched_unitig/structure/${cohort}_raw.tsv" "matched_unitig/${cohort}_refs.txt" "matched_unitig/structure/${cohort}_mash.tsv"
            rm -f "matched_unitig/structure/${cohort}.msh" "matched_unitig/structure/${cohort}_raw.tsv"
          done

      - name: Run discovery population-structure models and freeze candidates
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p matched_unitig/pyseer_discovery
          for dim in 10 20 30; do
            pyseer --phenotypes matched_unitig/discovery_phenotypes.tsv --kmers matched_unitig/discovery_unitigs/discovery.pyseer --uncompressed \
              --distances matched_unitig/structure/discovery_mash.tsv --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 0.01 --lrt-pvalue 0.01 --cpu 4 --print-samples --output-patterns "matched_unitig/pyseer_discovery/dim${dim}.patterns" \
              > "matched_unitig/pyseer_discovery/dim${dim}.tsv" 2> "matched_unitig/pyseer_discovery/dim${dim}.log"
          done
          n=$(cat matched_unitig/discovery_unitigs/N_UNITIG_TESTS.txt)
          python amr_discovery/select_stable_unitigs.py \
            --pyseer matched_unitig/pyseer_discovery/dim10.tsv matched_unitig/pyseer_discovery/dim20.tsv matched_unitig/pyseer_discovery/dim30.tsv \
            --n-tests "$n" --p-screen 1e-4 --max-candidates 5000 --out matched_unitig/selection \
            2>&1 | tee matched_unitig/selection_console.log
          grep -c '^>' matched_unitig/selection/selected_unitigs.fasta > matched_unitig/selection/SELECTED_COUNT.txt || true

      - name: Query frozen candidates in untouched validation and whole cohort
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          n=$(cat matched_unitig/selection/SELECTED_COUNT.txt || echo 0)
          if [[ "$n" == 0 ]]; then touch matched_unitig/NO_UNITIG_SELECTED; exit 0; fi
          mkdir -p matched_unitig/calls matched_unitig/pyseer_all
          unitig-caller --query --refs matched_unitig/validation_refs.txt --unitigs matched_unitig/selection/selected_unitigs.fasta --out matched_unitig/calls/validation --rtab --threads 4
          unitig-caller --query --refs matched_unitig/all_refs.txt --unitigs matched_unitig/selection/selected_unitigs.fasta --out matched_unitig/calls/all --rtab --threads 4
          test -s matched_unitig/calls/validation.rtab
          test -s matched_unitig/calls/all.rtab
          for dim in 10 20 30; do
            pyseer --phenotypes matched_unitig/all_phenotypes.tsv --pres matched_unitig/calls/all.rtab \
              --distances matched_unitig/structure/all_mash.tsv --max-dimensions "$dim" --min-af 0.01 --max-af 0.99 \
              --filter-pvalue 1 --print-samples --output-patterns "matched_unitig/pyseer_all/dim${dim}.patterns" \
              > "matched_unitig/pyseer_all/dim${dim}.tsv" 2> "matched_unitig/pyseer_all/dim${dim}.log"
          done

      - name: Apply held-out, BioProject, country, and adjusted-model gates
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p matched_unitig/final_evaluation
          if [[ -f matched_unitig/NO_UNITIG_SELECTED ]]; then
            printf '{"status":"NO_DISCOVERY_UNITIG","n_strict_statistically_replicated":0}\n' > matched_unitig/final_evaluation/UNITIG_REPLICATION_SUMMARY.json
            exit 0
          fi
          python amr_discovery/evaluate_portal_unitig_replication.py \
            --selection matched_unitig/selection/SELECTED_DISCOVERY_UNITIGS.csv \
            --manifest matched_unitig/gwas_sample_manifest.csv \
            --validation-rtab matched_unitig/calls/validation.rtab \
            --all-rtab matched_unitig/calls/all.rtab \
            --whole-pyseer matched_unitig/pyseer_all/dim10.tsv matched_unitig/pyseer_all/dim20.tsv matched_unitig/pyseer_all/dim30.tsv \
            --out matched_unitig/final_evaluation 2>&1 | tee matched_unitig/evaluation_console.log

      - name: Remove public genome bytes and finalize evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          rm -rf assemblies download
          find matched_unitig -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > matched_unitig/SHA256SUMS_ALL.txt || true
          du -ah matched_unitig | sort -h | tail -250 > matched_unitig/FILE_SIZES.txt || true

      - name: Upload matched deep-residual unitig evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KP_COLISTIN_MATCHED_DEEP_RESIDUAL_UNITIG_GWAS_20260819
          path: matched_unitig
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
