name: Ulrich u4 Lean self-report 20260818
on:
  workflow_dispatch:
  push:
    branches: [u4-resolution-20260818]
    paths:
      - 'u4_resolution/lean/**'
      - '.github/workflows/u4-lean-self-report-20260818.yml'

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: u4-resolution-20260818
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run Lean and capture status
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p u4_resolution/lean_check
          lean --version > u4_resolution/lean_check/LEAN_VERSION.txt 2>&1
          (cd u4_resolution/lean && lean U4Core.lean) > u4_resolution/lean_check/U4Core_OUTPUT.txt 2>&1
          rc_core=$?
          (cd u4_resolution/lean && lean U4Formal.lean) > u4_resolution/lean_check/U4Formal_OUTPUT.txt 2>&1
          rc_formal=$?
          echo "$rc_core" > u4_resolution/lean_check/U4Core_EXIT_CODE.txt
          echo "$rc_formal" > u4_resolution/lean_check/U4Formal_EXIT_CODE.txt
          rc=0
          if [ "$rc_core" -ne 0 ] || [ "$rc_formal" -ne 0 ]; then rc=1; fi
          echo "$rc" > u4_resolution/lean_check/EXIT_CODE.txt
          if [ "$rc" -eq 0 ]; then echo VERIFIED > u4_resolution/lean_check/STATUS.txt; else echo FAILED > u4_resolution/lean_check/STATUS.txt; fi
          sha256sum u4_resolution/lean/U4Core.lean u4_resolution/lean/U4Formal.lean u4_resolution/lean_check/*.txt > u4_resolution/lean_check/SHA256SUMS.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit machine check record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f u4_resolution/lean_check
          git commit -m 'Record Lean check result for u4 proof' || true
          git push origin HEAD:u4-resolution-20260818
      - name: Fail workflow if Lean failed
        if: steps.check.outputs.rc != '0'
        run: exit 1
