name: B2 Z100 adaptive proof tools smoke v3

on:
  push:
    branches: [b2-z100-final-proof-audit-20260818]
    paths:
      - '.github/workflows/b2-z100-adaptive-tools-smoke-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and cross-check generators
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            crossdomain/b2_z100_global_proof_cnf.py \
            crossdomain/b2_z100_prefix_proof_cnf_v3.py \
            crossdomain/b2_z100_split_proof_batch_v3.py \
            crossdomain/b2_z100_verify_cadical_model.py
          mkdir -p artifact
          python crossdomain/b2_z100_global_proof_cnf.py \
            --third 2 --fourth 30 \
            --output artifact/old.cnf --metadata artifact/old.json >/dev/null
          python crossdomain/b2_z100_prefix_proof_cnf_v3.py \
            --prefix-json '[0,1,2,30]' \
            --output artifact/new.cnf --metadata artifact/new.json >/dev/null
          cmp artifact/old.cnf artifact/new.cnf
          python crossdomain/b2_z100_split_proof_batch_v3.py \
            --prefix-json '[0,1,2]' \
            --generator crossdomain/b2_z100_prefix_proof_cnf_v3.py \
            --model-checker crossdomain/b2_z100_verify_cadical_model.py \
            --out artifact/plan-t2 --plan-only > artifact/plan-t2.log
          python crossdomain/b2_z100_split_proof_batch_v3.py \
            --prefix-json '[0,1,45]' \
            --generator crossdomain/b2_z100_prefix_proof_cnf_v3.py \
            --model-checker crossdomain/b2_z100_verify_cadical_model.py \
            --out artifact/plan-t45 --plan-only > artifact/plan-t45.log
          python - <<'PY'
          import json
          a=json.load(open('artifact/plan-t2/SPLIT_PLAN.json'))
          b=json.load(open('artifact/plan-t45/SPLIT_PLAN.json'))
          assert a['expected_values']==list(range(3,90)),a
          assert a['expected_child_count']==87,a
          assert b['expected_values']==[46],b
          assert b['expected_child_count']==1,b
          print('ADAPTIVE_TOOLS_SMOKE_PASS')
          PY
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2-z100-adaptive-tools-smoke-v3
          path: artifact
          retention-days: 90
          if-no-files-found: error
