name: Observe dispatched public virome hunt

on:
  pull_request:
    branches: [main]
    paths:
      - 'virus_hunt/OBSERVE_REQUEST.md'

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_BRANCH: run-public-virome-hunt-20260818
    steps:
      - name: Locate latest dispatched run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observation
          gh run list \
            --repo "$REPO" \
            --workflow public_virome_hunt.yml \
            --branch "$TARGET_BRANCH" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url \
            > observation/runs.json
          run_id=$(jq -r '.[0].databaseId // empty' observation/runs.json)
          if [[ -z "$run_id" ]]; then
            echo 'No matching dispatched workflow run was found.' > observation/status.txt
            exit 1
          fi
          echo "$run_id" > observation/run_id.txt
          gh run view "$run_id" --repo "$REPO" \
            --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url,jobs \
            > observation/run.json
          gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
            > observation/artifacts.json || true
          jq '{databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url,jobs:[.jobs[]|{name,status,conclusion,startedAt,completedAt}]}' \
            observation/run.json > observation/status.json
          cat observation/status.json
      - name: Hash observation bundle
        if: always()
        shell: bash
        run: |
          find observation -type f -print0 | sort -z | xargs -0 sha256sum \
            > observation/SHA256SUMS.txt || true
      - name: Upload observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIROME_RUN_OBSERVATION
          path: observation
          retention-days: 7
