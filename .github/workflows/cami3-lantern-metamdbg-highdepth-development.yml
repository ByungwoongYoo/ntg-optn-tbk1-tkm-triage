name: LANTERN isolated high-depth metaMDBG development

on:
  pull_request:
    branches: [cami3-lantern-20260819]
    paths:
      - '.github/workflows/cami3-lantern-metamdbg-highdepth-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SEED: '20260819'

jobs:
  highdepth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: f25
            fraction: '0.25'
          - label: f50
            fraction: '0.50'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: metamdbg-highdepth
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            metamdbg=1.4
            minimap2=2.31
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all
      - name: Stream deterministic higher-depth long reads
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; fraction='${{ matrix.fraction }}'
          root="metamdbg_highdepth_${label}"
          mkdir -p "$root"/{reads,assembly,evaluation,truth_download,truth,provenance,logs,failure_audit}
          for s in 0 1; do
            url="https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy-long/sample_${s}_reads.tar.gz"
            python lantern_cami3/scripts/stream_downsample_cami_tar.py \
              --url "$url" --sample-id "S${s}" --mode long \
              --fraction "$fraction" --seed "$SEED" --min-kept 5000 --out-dir "$root/reads" \
              > "$root/logs/DOWNSAMPLE_S${s}.log" 2>&1
          done
          gzip -t "$root"/reads/S0_long.fastq.gz "$root"/reads/S1_long.fastq.gz
          seqkit stats -T "$root"/reads/*.fastq.gz > "$root/provenance/READ_STATS.tsv"
          sha256sum "$root"/reads/*.fastq.gz "$root"/reads/*_downsample.json > "$root/provenance/READ_SHA256.txt"
          git rev-parse HEAD > "$root/provenance/GIT_HEAD.txt"
          uname -a > "$root/provenance/UNAME.txt"
          micromamba list > "$root/provenance/MICROMAMBA_LIST.txt"
          printf 'label=%s\nfraction=%s\nseed=%s\ngold_accessed=false\n' "$label" "$fraction" "$SEED" > "$root/provenance/FROZEN_INPUTS.txt"
          df -h > "$root/provenance/DISK_AFTER_READS.txt"
      - name: Assemble with metaMDBG/nanoMDBG and freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; root="metamdbg_highdepth_${label}"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=120s 300m \
            metaMDBG asm --out-dir "$root/assembly/out" \
            --in-ont "$root/reads/S0_long.fastq.gz" "$root/reads/S1_long.fastq.gz" --threads 4 \
            > "$root/logs/METAMDBG.log" 2>&1
          rc=$?
          set -e
          printf 'exit_code=%s\n' "$rc" > "$root/failure_audit/METAMDBG.status"
          contigs=$(find "$root/assembly/out" -maxdepth 2 -type f \( -name 'contigs.fasta.gz' -o -name 'contigs.fasta' -o -name 'assembly.fasta' \) -print -quit)
          test -n "$contigs"
          if [[ "$contigs" == *.gz ]]; then gzip -cd "$contigs" > "$root/assembly/final_assembly.fasta"; else cp "$contigs" "$root/assembly/final_assembly.fasta"; fi
          test -s "$root/assembly/final_assembly.fasta"
          python lantern_cami3/scripts/verify_cami_assembly.py "$root/assembly/final_assembly.fasta" --out "$root/assembly/VALIDATION.json"
          seqkit stats -T "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_STATS.tsv"
          sha256sum "$root/assembly/final_assembly.fasta" > "$root/assembly/ASSEMBLY_SHA256.txt"
          python - "$root" "$label" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          root=Path(sys.argv[1]); label=sys.argv[2]; p=root/'assembly/final_assembly.fasta'
          x={'label':label,'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'assembly_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'assembly_bytes':p.stat().st_size,'truth_accessed':False,'boundary':'Higher-depth long-read assembly frozen before Toy gold access.'}
          (root/'provenance/TRUTH_BLIND_FREEZE.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Evaluate after freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'; root="metamdbg_highdepth_${label}"
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "$root/truth_download/sample${s}_gsa.tar.gz"
          done
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=$root/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=$root/truth_download/sample1_gsa.tar.gz" --out "$root/truth" \
            > "$root/logs/EXTRACT_TRUTH.log" 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 "$root/truth/combined_truth.fasta" "$root/assembly/final_assembly.fasta" \
            > "$root/evaluation/assembly_to_truth.paf" 2> "$root/logs/MINIMAP2.log"
          python lantern_cami3/scripts/evaluate_gold_coverage.py \
            --paf "$root/evaluation/assembly_to_truth.paf" \
            --truth-mapping "$root/truth/truth_mapping.tsv" \
            --assembly-fasta "$root/assembly/final_assembly.fasta" \
            --min-identity 0.90 --min-alignment 500 --out "$root/evaluation" \
            > "$root/logs/EVALUATE.log" 2>&1
          test -s "$root/evaluation/GOLD_COVERAGE_SUMMARY.json"
      - name: Compact artifact
        if: always()
        shell: micromamba-shell {0}
        run: |
          label='${{ matrix.label }}'; root="metamdbg_highdepth_${label}"
          rm -rf "$root/reads" "$root/assembly/out" "$root/truth_download" "$root/truth/references"
          rm -f "$root/truth/combined_truth.fasta" "$root/evaluation/assembly_to_truth.paf"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt" || true
          du -ah "$root" | sort -h > "$root/FILE_SIZES.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_METAMDBG_HIGHDEPTH_${{ matrix.label }}_ISOLATED_20260820
          path: metamdbg_highdepth_${{ matrix.label }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
