name: Dispatch isolated LANTERN v7 finalizer v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-v7-finalizer-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch only corrected finalizer v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run lantern-v7-holdout-18-19-finalize-v2.yml --repo "$REPO" --ref "$REF"
          sleep 10
          gh run list --repo "$REPO" --workflow lantern-v7-holdout-18-19-finalize-v2.yml --branch "$REF" --limit 3 --json databaseId,status,conclusion,url,headSha,createdAt
