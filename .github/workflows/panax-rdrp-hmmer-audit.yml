name: Independent HMMER audit of Panax RdRP candidates

on:
  push:
    branches: [panax-rdrp-validation-20260818]
    paths:
      - '.github/workflows/panax-rdrp-hmmer-audit.yml'
      - 'virus_hunt/hmmer_audit/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panax-rdrp-hmmer-audit-20260818
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: panax-rdrp-validation-20260818

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install biopython==1.85 requests==2.32.5

      - name: Query current UniProtKB and Pfam through HMMER-web API
        run: |
          set -o pipefail
          rm -rf virus_hunt/hmmer_audit/results
          mkdir -p virus_hunt/hmmer_audit/results
          python virus_hunt/hmmer_audit/run_hmmer_api.py \
            --fasta virus_hunt/validation_inputs/candidate_rdrp.faa \
            --out virus_hunt/hmmer_audit/results \
            2>&1 | tee virus_hunt/hmmer_audit/results/console.log

      - name: Record provenance and commit evidence
        if: always()
        run: |
          {
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "branch=panax-rdrp-validation-20260818"
            python --version
            python -m pip freeze
          } > virus_hunt/hmmer_audit/results/WORKFLOW_PROVENANCE.txt
          find virus_hunt/hmmer_audit/results -type f \
            ! -name SHA256SUMS_COMPLETE.txt -print0 | sort -z | xargs -0 sha256sum \
            > virus_hunt/hmmer_audit/results/SHA256SUMS_COMPLETE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f virus_hunt/hmmer_audit/results
          git commit -m "Store independent HMMER candidate audit [skip ci]" || exit 0
          git pull --rebase origin panax-rdrp-validation-20260818
          git push origin HEAD:panax-rdrp-validation-20260818

      - name: Upload immutable HMMER audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PANAX_RDRP_HMMER_AUDIT_20260818
          path: virus_hunt/hmmer_audit/results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
