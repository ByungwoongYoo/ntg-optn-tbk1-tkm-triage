name: K. pneumoniae colistin phenotype method quality audit

on:
  push:
    branches: [amr-kp-colistin-phenotype-qc-20260819]
    paths:
      - 'amr_discovery/audit_kp_colistin_phenotypes.py'
      - '.github/workflows/amr-kp-colistin-phenotype-qc.yml'
  pull_request:
    branches: [amr-stage1-census-base-20260819]
    paths:
      - 'amr_discovery/audit_kp_colistin_phenotypes.py'
      - '.github/workflows/amr-kp-colistin-phenotype-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phenotype-qc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            duckdb==1.3.2 pandas==2.3.1 pyarrow==21.0.0 \
            requests==2.32.5 tabulate==0.9.0
      - name: Record provenance
        run: |
          mkdir -p kp_colistin_phenotype_qc
          uname -a > kp_colistin_phenotype_qc/UNAME.txt
          python --version > kp_colistin_phenotype_qc/PYTHON_VERSION.txt
          python -m pip freeze | sort > kp_colistin_phenotype_qc/PIP_FREEZE.txt
          git rev-parse HEAD > kp_colistin_phenotype_qc/GIT_HEAD.txt
      - name: Audit phenotype methods and label consistency
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python amr_discovery/audit_kp_colistin_phenotypes.py \
            --out kp_colistin_phenotype_qc \
            2>&1 | tee kp_colistin_phenotype_qc/console.log
      - name: Refresh hashes
        if: always()
        run: |
          find kp_colistin_phenotype_qc -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > kp_colistin_phenotype_qc/SHA256SUMS.txt || true
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KP_COLISTIN_PHENOTYPE_QC_20260819
          path: kp_colistin_phenotype_qc
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
