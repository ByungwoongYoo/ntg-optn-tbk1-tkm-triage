name: Vesuvius small public-data probe
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/vesuvius_small_probe.py'
      - '.github/workflows/vesuvius-small-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'zarr<3' fsspec s3fs tifffile numpy imagecodecs
      - name: Read only small public S3 crops
        env: {OUT_DIR: 'artifact/vesuvius_small'}
        run: |
          mkdir -p artifact/vesuvius_small
          python crossdomain/vesuvius_small_probe.py
      - run: find artifact/vesuvius_small -type f -print0 | sort -z | xargs -0 sha256sum > artifact/vesuvius_small/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vesuvius-small-probe
          path: artifact/vesuvius_small
          retention-days: 30
          if-no-files-found: error
