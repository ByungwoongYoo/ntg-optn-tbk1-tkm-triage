name: CAMI III LANTERN v6 isolated extension-union development

on:
  pull_request:
    branches: [cami3-lantern-20260819]
    paths:
      - '.github/workflows/cami3-lantern-v6-extension-development.yml'
      - 'lantern_v6/prepare_extension_candidates.py'
      - 'lantern_v6/extension_union.py'
      - 'lantern_v6/select_extension_winner.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '32312941523'
  V4_RUN_ID: '32332720793'
  V4_ARTIFACT: 'LANTERN_CAMI3_HYBRID_V4_DEVELOPMENT_20260820'
  SEED: '20260819'

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable truth-blind source-assembly artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANTERN_CAMI3_MULTIMODAL_*_20260820
          path: source_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lantern-v6-extension
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            minimap2=2.31
            mash=2.3
            seqkit=2.13.0
          cache-downloads: true
          post-cleanup: all

      - name: Isolate source assemblies and remove bundled evaluation bytes
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p v6_extension_dev/{inputs,candidates,alignments,variants,evaluation,truth_download,truth,pseudo,abundance,decision,provenance,logs,failure_audit}
          hybrid=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_metaspades_hybrid_pair_20260820 -type f -path '*/assembly/out/contigs.fasta' -print -quit)
          short=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_metaspades_short_pair_20260820 -type f -path '*/assembly/out/contigs.fasta' -print -quit)
          megahit=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_megahit_short_pair_20260820 -type f -path '*/assembly/out/final.contigs.fa' -print -quit)
          flye=$(find source_artifacts/LANTERN_CAMI3_MULTIMODAL_flye_long_pair_20260820 -type f -path '*/assembly/out/assembly.fasta' -print -quit)
          for f in "$hybrid" "$short" "$megahit" "$flye"; do test -s "$f"; done
          cp "$hybrid" v6_extension_dev/inputs/metaspades_hybrid_pair.fasta
          cp "$short" v6_extension_dev/inputs/metaspades_short_pair.fasta
          cp "$megahit" v6_extension_dev/inputs/megahit_short_pair.fasta
          cp "$flye" v6_extension_dev/inputs/flye_long_pair.fasta
          sha256sum v6_extension_dev/inputs/*.fasta > v6_extension_dev/provenance/SOURCE_ASSEMBLY_SHA256.txt
          seqkit stats -T v6_extension_dev/inputs/*.fasta > v6_extension_dev/provenance/SOURCE_ASSEMBLY_STATS.tsv
          rm -rf source_artifacts
          git rev-parse HEAD > v6_extension_dev/provenance/GIT_HEAD.txt
          uname -a > v6_extension_dev/provenance/UNAME.txt
          python --version > v6_extension_dev/provenance/PYTHON_VERSION.txt
          minimap2 --version > v6_extension_dev/provenance/MINIMAP2_VERSION.txt
          mash --version > v6_extension_dev/provenance/MASH_VERSION.txt
          micromamba list > v6_extension_dev/provenance/MICROMAMBA_LIST.txt
          printf 'source_run=%s\ndevelopment_samples=0,1\ngold_accessed=false\n' "$SOURCE_RUN_ID" > v6_extension_dev/provenance/CONSTRUCTION_BOUNDARY.txt

      - name: Prepare exact-deduplicated auxiliary candidates without truth
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python lantern_v6/prepare_extension_candidates.py \
            --source "metaspades_short=v6_extension_dev/inputs/metaspades_short_pair.fasta" \
            --source "megahit_short=v6_extension_dev/inputs/megahit_short_pair.fasta" \
            --source "flye_long=v6_extension_dev/inputs/flye_long_pair.fasta" \
            --min-length 500 --max-n-fraction 0.05 --out v6_extension_dev/candidates \
            > v6_extension_dev/logs/PREPARE_CANDIDATES.log 2>&1
          minimap2 -x asm5 -c -N 100 -t 4 \
            v6_extension_dev/inputs/metaspades_hybrid_pair.fasta \
            v6_extension_dev/candidates/extension_candidates.fasta \
            > v6_extension_dev/alignments/candidate_to_backbone.paf \
            2> v6_extension_dev/logs/CANDIDATE_TO_BACKBONE.log
          test -s v6_extension_dev/alignments/candidate_to_backbone.paf

      - name: Construct frozen extension grid before gold
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cat > /tmp/variants.tsv <<'EOF'
          whole_500_s1	whole	500	500	0.50	0.95	1	false
          whole_1000_s1	whole	1000	500	0.50	0.95	1	false
          terminal_500_s1	terminal	500	500	0.50	0.95	1	true
          terminal_750_s1	terminal	500	750	0.50	0.95	1	true
          hybrid_500_s1	hybrid	500	500	0.50	0.95	1	true
          hybrid_750_s1	hybrid	500	750	0.50	0.95	1	true
          hybrid_500_s2	hybrid	500	500	0.50	0.95	2	true
          hybrid_500_loose	hybrid	500	500	0.70	0.98	1	true
          EOF
          while IFS=$'\t' read -r name mode minlen minterm wholemax contain minsources single; do
            dir="v6_extension_dev/variants/$name"
            extra=()
            [[ "$single" == true ]] && extra+=(--single-target-terminal)
            python lantern_v6/extension_union.py \
              --backbone v6_extension_dev/inputs/metaspades_hybrid_pair.fasta \
              --candidates v6_extension_dev/candidates/extension_candidates.fasta \
              --metadata v6_extension_dev/candidates/extension_candidate_metadata.tsv \
              --candidate-to-backbone-paf v6_extension_dev/alignments/candidate_to_backbone.paf \
              --mode "$mode" --min-candidate-length "$minlen" --min-terminal-bp "$minterm" \
              --alignment-identity 0.97 --alignment-min-bp 500 \
              --whole-max-aligned-fraction "$wholemax" --containment-fraction "$contain" \
              --min-source-count "$minsources" "${extra[@]}" --out "$dir" \
              > "v6_extension_dev/logs/CONSTRUCT_${name}.log" 2>&1
            python lantern_cami3/scripts/verify_cami_assembly.py \
              "$dir/LANTERN_V6_EXTENSION_UNION.fasta" --out "$dir/VALIDATION.json"
          done < /tmp/variants.tsv
          cp /tmp/variants.tsv v6_extension_dev/provenance/PREDECLARED_VARIANT_GRID.tsv
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          root=Path('v6_extension_dev')
          files=[]
          for p in sorted((root/'variants').rglob('LANTERN_V6_EXTENSION_UNION.fasta')):
              files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          freeze={
            'status':'ALL_EXTENSION_VARIANTS_FROZEN_BEFORE_GOLD',
            'development_samples':[0,1],
            'freeze_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'variant_count':len(files),
            'variants':files,
            'candidate_fasta_sha256':hashlib.sha256((root/'candidates/extension_candidates.fasta').read_bytes()).hexdigest(),
            'candidate_to_backbone_paf_sha256':hashlib.sha256((root/'alignments/candidate_to_backbone.paf').read_bytes()).hexdigest(),
            'truth_accessed':False,
            'boundary':'All source extraction, exact deduplication, backbone alignment, extension rules, full assemblies, and hashes were completed before public Toy gold access.'
          }
          (root/'provenance/TRUTH_BLIND_EXTENSION_FREEZE.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
          if len(files)!=8: raise SystemExit('unexpected frozen variant count')
          PY

      - name: Open public Toy development gold after freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          test -s v6_extension_dev/provenance/TRUTH_BLIND_EXTENSION_FREEZE.json
          for s in 0 1; do
            curl -fsSL --retry 8 --retry-all-errors \
              "https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/sample_${s}_gsa.tar.gz" \
              -o "v6_extension_dev/truth_download/sample${s}_gsa.tar.gz"
          done
          sha256sum v6_extension_dev/truth_download/*.tar.gz > v6_extension_dev/provenance/GSA_SHA256SUMS.txt
          python lantern_cami3/scripts/extract_gsa_truth.py \
            --gsa-tar "sample0=v6_extension_dev/truth_download/sample0_gsa.tar.gz" \
            --gsa-tar "sample1=v6_extension_dev/truth_download/sample1_gsa.tar.gz" \
            --out v6_extension_dev/truth > v6_extension_dev/logs/EXTRACT_TRUTH.log 2>&1

      - name: Evaluate baselines and frozen variants
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cat > /tmp/methods.tsv <<'EOF'
          metaspades_hybrid_pair	v6_extension_dev/inputs/metaspades_hybrid_pair.fasta	baseline
          metaspades_short_pair	v6_extension_dev/inputs/metaspades_short_pair.fasta	baseline
          megahit_short_pair	v6_extension_dev/inputs/megahit_short_pair.fasta	baseline
          flye_long_pair	v6_extension_dev/inputs/flye_long_pair.fasta	baseline
          EOF
          for dir in v6_extension_dev/variants/*; do
            name=$(basename "$dir")
            printf '%s\t%s\tvariant\n' "$name" "$dir/LANTERN_V6_EXTENSION_UNION.fasta" >> /tmp/methods.tsv
          done
          while IFS=$'\t' read -r name fasta role; do
            dir="v6_extension_dev/evaluation/$name"; mkdir -p "$dir"
            minimap2 -x asm5 -c -N 100 -t 4 v6_extension_dev/truth/combined_truth.fasta "$fasta" \
              > "$dir/assembly_to_truth.paf" 2> "$dir/minimap2.log"
            python lantern_cami3/scripts/evaluate_gold_coverage.py \
              --paf "$dir/assembly_to_truth.paf" \
              --truth-mapping v6_extension_dev/truth/truth_mapping.tsv \
              --assembly-fasta "$fasta" --min-identity 0.90 --min-alignment 500 --out "$dir" \
              > "$dir/evaluate.log" 2>&1
            test -s "$dir/GOLD_COVERAGE_SUMMARY.json"
          done < /tmp/methods.tsv
          cp /tmp/methods.tsv v6_extension_dev/provenance/EVALUATED_METHODS.tsv

      - name: Build pseudo-novel and abundance audits after freeze
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          awk -F '\t' 'NR>1 && $3>=50000 {print $2}' v6_extension_dev/truth/genome_reference_manifest.tsv \
            > v6_extension_dev/pseudo/mash_reference_files.txt
          test $(wc -l < v6_extension_dev/pseudo/mash_reference_files.txt) -ge 2
          mash sketch -k 21 -s 1000 -l v6_extension_dev/pseudo/mash_reference_files.txt \
            -o v6_extension_dev/pseudo/truth_genomes > v6_extension_dev/logs/MASH_SKETCH.log 2>&1
          mash dist v6_extension_dev/pseudo/truth_genomes.msh v6_extension_dev/pseudo/truth_genomes.msh \
            > v6_extension_dev/pseudo/truth_genome_distances.tsv
          recovery_args=()
          for dir in v6_extension_dev/evaluation/*; do
            recovery_args+=(--recovery "$(basename "$dir")=$dir/per_genome_recovery.tsv")
          done
          python lantern_cami3/scripts/build_pseudo_novel_audit.py \
            --manifest v6_extension_dev/truth/genome_reference_manifest.tsv \
            --mash v6_extension_dev/pseudo/truth_genome_distances.tsv \
            "${recovery_args[@]}" --min-truth-bp 50000 --out v6_extension_dev/pseudo/results \
            > v6_extension_dev/logs/PSEUDO_NOVEL.log 2>&1

          # Abundance files are evaluation metadata. They are obtained only after the extension freeze.
          mkdir -p v4_eval_metadata
          gh run download "$V4_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$V4_ARTIFACT" -D v4_eval_metadata
          a0=$(find v4_eval_metadata -type f -name 'sample0_abundance.tsv' -print -quit)
          a1=$(find v4_eval_metadata -type f -name 'sample1_abundance.tsv' -print -quit)
          test -s "$a0"; test -s "$a1"
          python lantern_cami3/scripts/summarize_abundance_recovery.py \
            --abundance "$a0" --abundance "$a1" "${recovery_args[@]}" \
            --low-percent 0.01 --high-percent 0.1 --out v6_extension_dev/abundance/results \
            > v6_extension_dev/logs/ABUNDANCE.log 2>&1
          rm -rf v4_eval_metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select and freeze one extension rule for untouched validation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cat > v6_extension_dev/provenance/STRICT_GATES.json <<'EOF'
          {
            "genome_fraction_gain_minimum_percentage_points": 0.5,
            "mean_genome_recovery_gain_minimum_percentage_points": 1.0,
            "low_abundance_gain_minimum_percentage_points": 2.0,
            "relative_cross_binid_chimera_increase_maximum": 0.10,
            "longitudinal_ablation_drop_minimum_percentage_points": 0.5
          }
          EOF
          baseline_args=()
          for name in metaspades_hybrid_pair metaspades_short_pair megahit_short_pair flye_long_pair; do
            baseline_args+=(--baseline "$name=v6_extension_dev/evaluation/$name")
          done
          variant_args=(); summary_args=()
          for dir in v6_extension_dev/variants/*; do
            name=$(basename "$dir")
            variant_args+=(--variant "$name=v6_extension_dev/evaluation/$name")
            summary_args+=(--variant-summary "$name=$dir/EXTENSION_SUMMARY.json")
          done
          python lantern_v6/select_extension_winner.py \
            "${baseline_args[@]}" "${variant_args[@]}" "${summary_args[@]}" \
            --abundance-summary v6_extension_dev/abundance/results/ABUNDANCE_STRATIFIED_SUMMARY.tsv \
            --pseudo-summary v6_extension_dev/pseudo/results/PSEUDO_NOVEL_RECOVERY_SUMMARY.tsv \
            --gates v6_extension_dev/provenance/STRICT_GATES.json --out v6_extension_dev/decision \
            > v6_extension_dev/logs/SELECT_WINNER.log 2>&1
          test -s v6_extension_dev/decision/FROZEN_EXTENSION_WINNER.json

      - name: Independent audit and compact evidence
        if: always()
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('v6_extension_dev'); errors=[]
          freeze=root/'provenance/TRUTH_BLIND_EXTENSION_FREEZE.json'
          decision=root/'decision/FROZEN_EXTENSION_WINNER.json'
          if not freeze.is_file(): errors.append('missing construction freeze')
          if not decision.is_file(): errors.append('missing development decision')
          if decision.is_file():
              d=json.loads(decision.read_text())
              winner=d.get('winner')
              if not (root/'variants'/str(winner)/'EXTENSION_SUMMARY.json').is_file(): errors.append('winner summary missing')
              if not (root/'evaluation'/str(winner)/'GOLD_COVERAGE_SUMMARY.json').is_file(): errors.append('winner evaluation missing')
          audit={'status':'PASS' if not errors else 'FAIL','errors':errors,'boundary':'Public Toy development only; no holdout or active CAMI challenge result.'}
          (root/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n')
          if errors: raise SystemExit(errors)
          PY
          rm -rf v6_extension_dev/inputs v6_extension_dev/truth_download v6_extension_dev/truth/references
          rm -f v6_extension_dev/truth/combined_truth.fasta v6_extension_dev/pseudo/truth_genomes.msh
          rm -f v6_extension_dev/evaluation/*/assembly_to_truth.paf
          rm -f v6_extension_dev/alignments/candidate_to_backbone.paf
          rm -f v6_extension_dev/variants/*/LANTERN_V6_EXTENSION_UNION.fasta
          rm -f v6_extension_dev/candidates/extension_candidates.fasta
          find v6_extension_dev -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > v6_extension_dev/SHA256SUMS.txt || true
          du -ah v6_extension_dev | sort -h > v6_extension_dev/FILE_SIZES.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANTERN_CAMI3_V6_EXTENSION_DEVELOPMENT_20260820
          path: v6_extension_dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
