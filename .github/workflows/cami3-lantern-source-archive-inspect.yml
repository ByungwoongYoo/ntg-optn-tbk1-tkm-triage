name: CAMI III LANTERN Toy source archive inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cami3-lantern-source-archive-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source-genome archive members without materializing archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_inspect
          url='https://s3.bi.denbi.de/swift/v1/cami/cami3_toydata/human-gut-toy/source_genomes.tar.gz'
          set +o pipefail
          curl -fsSL --retry 6 --retry-all-errors "$url" | tar -tzf - | head -400 > source_inspect/source_members_head.txt
          rc=$?
          set -o pipefail
          echo "pipeline_exit=$rc" >> source_inspect/source_members_head.txt
          cat source_inspect/source_members_head.txt
          git rev-parse HEAD > source_inspect/GIT_HEAD.txt
          find source_inspect -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > source_inspect/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LANTERN_CAMI3_TOY_SOURCE_ARCHIVE_INSPECTION_20260819
          path: source_inspect
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
