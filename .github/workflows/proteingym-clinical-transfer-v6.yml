name: ProteinGym corrected DMS-to-clinical transfer v6
on:
  workflow_dispatch:
  push:
    branches: [bio-open-problem-smoke-20260817]
    paths:
      - 'bio_open_problem/proteingym_clinical_transfer_v6.py'
      - '.github/workflows/proteingym-clinical-transfer-v6.yml'
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn
      - name: Download official ProteinGym resources
        run: |
          mkdir -p pg_data_v6 artifact/proteingym_clinical_transfer_v6
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data_v6/zero_shot_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_substitutions_scores.zip
          curl -L --fail --retry 8 --retry-delay 5 -o pg_data_v6/zero_shot_clinical_substitutions_scores.zip \
            https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/zero_shot_clinical_substitutions_scores.zip
          curl -L --fail --retry 8 -o pg_data_v6/DMS_substitutions.csv \
            https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
          sha256sum pg_data_v6/* > artifact/resource_sha256_v6.txt
      - name: Run corrected frozen transfer
        run: |
          PYTHONPATH=bio_open_problem python bio_open_problem/proteingym_clinical_transfer_v6.py \
            --dms-score-zip pg_data_v6/zero_shot_substitutions_scores.zip \
            --dms-reference pg_data_v6/DMS_substitutions.csv \
            --clinical-score-zip pg_data_v6/zero_shot_clinical_substitutions_scores.zip \
            --out-dir artifact/proteingym_clinical_transfer_v6
      - name: Package
        run: |
          cp bio_open_problem/proteingym_clinical_transfer_v6.py bio_open_problem/proteingym_wide_v2.py artifact/
          tar -czf artifact/proteingym_clinical_transfer_v6_results.tar.gz \
            artifact/proteingym_clinical_transfer_v6 artifact/resource_sha256_v6.txt \
            artifact/proteingym_clinical_transfer_v6.py artifact/proteingym_wide_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: proteingym-clinical-transfer-v6
          path: |
            artifact/proteingym_clinical_transfer_v6
            artifact/resource_sha256_v6.txt
            artifact/proteingym_clinical_transfer_v6.py
            artifact/proteingym_wide_v2.py
            artifact/proteingym_clinical_transfer_v6_results.tar.gz
          retention-days: 30
          if-no-files-found: error
