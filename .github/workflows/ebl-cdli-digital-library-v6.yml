name: eBL CDLI digital-library image fetch v6

on:
  workflow_dispatch:
  push:
    branches: ["crossdomain-open-problem-tournament-20260817-doit"]
    paths:
      - "crossdomain/ebl_cdli_digital_library_v6.py"
      - ".github/workflows/ebl-cdli-digital-library-v6.yml"

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download v4 asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data artifact/ebl_cdli_v6
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -o data/v4.zip https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9276552840/zip
          unzip -q data/v4.zip -d data/v4
          test -s data/v4/candidate_asset_metadata.json
      - name: Fetch documented CDLI web images
        run: |
          python crossdomain/ebl_cdli_digital_library_v6.py \
            --asset-metadata data/v4/candidate_asset_metadata.json \
            --out-dir artifact/ebl_cdli_v6 --top 3
      - name: Hash outputs
        run: |
          cp crossdomain/ebl_cdli_digital_library_v6.py artifact/ebl_cdli_v6/
          find artifact/ebl_cdli_v6 -type f -print0 | sort -z | xargs -0 sha256sum > artifact/ebl_cdli_v6/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ebl-cdli-images-v6
          path: artifact/ebl_cdli_v6
          retention-days: 30
