name: NEO-GUARD34 NEAT audit

on:
  push:
    branches:
      - neo-guard34-audit-20260821
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn

      - name: Clone and pin NEAT
        run: |
          git clone https://github.com/griffithlab/NEAT.git external/NEAT
          git -C external/NEAT checkout c1df534d90b08ee5d6e054d0797088067cbc4cd1
          test "$(git -C external/NEAT rev-parse HEAD)" = "c1df534d90b08ee5d6e054d0797088067cbc4cd1"

      - name: Run independent audit
        run: |
          python neo_guard34_audit/neo_guard34_neat_audit.py \
            --neat-dir external/NEAT \
            --out-dir neo_guard34_results

      - name: Capture environment
        run: |
          python --version > neo_guard34_results/python_version.txt
          python -m pip freeze > neo_guard34_results/pip_freeze.txt
          git -C external/NEAT rev-parse HEAD > neo_guard34_results/neat_commit.txt
          git rev-parse HEAD > neo_guard34_results/audit_commit.txt
          sha256sum neo_guard34_results/* > neo_guard34_results/ALL_OUTPUT_SHA256SUMS.txt

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-guard34-neat-audit
          path: neo_guard34_results/
          retention-days: 30
          if-no-files-found: error
