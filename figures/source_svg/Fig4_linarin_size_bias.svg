<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a2230">Figure 4.</text>
  <text x="120" y="42" font-size="18" fill="#1a2230">Linarin is a glycoside size-bias case, not a candidate</text>
  <text x="40" y="64" font-size="12.5" fill="#5a6472" font-style="italic">The glycoside (Linarin) gains raw score over its aglycone (Acacetin) but loses on ligand efficiency and reproducibility.</text>

  <!-- legend -->
  <rect x="600" y="86" width="13" height="13" fill="#8a6d3b"/><text x="620" y="97" font-size="12" fill="#2b3442">Linarin (glycoside, 42 HA)</text>
  <rect x="760" y="86" width="13" height="13" fill="#b9c2d0"/><text x="780" y="97" font-size="12" fill="#2b3442">Acacetin (aglycone, 21 HA)</text>

  <!-- Panel A: raw score (more negative = "better" by naive reading) -->
  <text x="120" y="135" font-size="13.5" font-weight="700" fill="#1a2230" text-anchor="middle">Raw docking score</text>
  <text x="120" y="152" font-size="10.5" fill="#7a8290" text-anchor="middle">(kcal/mol; more negative looks better)</text>
  <g>
    <line x1="55" y1="160" x2="55" y2="370" stroke="#9aa3b2"/>
    <line x1="55" y1="370" x2="195" y2="370" stroke="#9aa3b2"/>
    <!-- scale: 0 at 160, -7 at 370 -> 30 px per unit -->
    <rect x="75" y="370" width="34" height="-174.6" transform="translate(0,0)" fill="#8a6d3b"/>
    <rect x="140" y="370" width="34" height="-166.8" fill="#b9c2d0"/>
    <text x="92" y="188" font-size="11.5" font-weight="700" fill="#8a6d3b" text-anchor="middle">−5.82</text>
    <text x="157" y="196" font-size="11.5" font-weight="700" fill="#5a6472" text-anchor="middle">−5.56</text>
    <text x="92" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Linarin</text>
    <text x="157" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Acacetin</text>
  </g>
  <text x="120" y="412" font-size="11" fill="#8a5a12" text-anchor="middle" font-weight="700">↑ glycoside "wins" by raw score</text>

  <!-- Panel B: ligand efficiency -->
  <text x="360" y="135" font-size="13.5" font-weight="700" fill="#1a2230" text-anchor="middle">Ligand efficiency</text>
  <text x="360" y="152" font-size="10.5" fill="#7a8290" text-anchor="middle">(score per heavy atom; size-normalized)</text>
  <g>
    <line x1="295" y1="160" x2="295" y2="370" stroke="#9aa3b2"/>
    <line x1="295" y1="370" x2="435" y2="370" stroke="#9aa3b2"/>
    <!-- scale: -0.30 at 370... 0 at 160 -> map magnitude *700 -->
    <rect x="315" y="370" width="34" height="-96.6" fill="#8a6d3b"/>
    <rect x="380" y="370" width="34" height="-185.5" fill="#b9c2d0"/>
    <text x="332" y="263" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">−0.138</text>
    <text x="397" y="174" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">−0.265</text>
    <text x="332" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Linarin</text>
    <text x="397" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Acacetin</text>
  </g>
  <text x="360" y="412" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">↓ glycoside loses per-atom (~½)</text>

  <!-- Panel C: pose reproducibility -->
  <text x="600" y="135" font-size="13.5" font-weight="700" fill="#1a2230" text-anchor="middle">Pose reproducibility</text>
  <text x="600" y="152" font-size="10.5" fill="#7a8290" text-anchor="middle">(low-RMSD system fraction)</text>
  <g>
    <line x1="535" y1="160" x2="535" y2="370" stroke="#9aa3b2"/>
    <line x1="535" y1="370" x2="675" y2="370" stroke="#9aa3b2"/>
    <!-- scale: 100% at 170 -> 2 px per % -->
    <rect x="555" y="370" width="34" height="0" fill="#8a6d3b"/>
    <line x1="555" y1="370" x2="589" y2="370" stroke="#c0392b" stroke-width="2.5"/>
    <rect x="620" y="370" width="34" height="-100" fill="#b9c2d0"/>
    <text x="572" y="362" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">0%</text>
    <text x="637" y="262" font-size="11.5" font-weight="700" fill="#5a6472" text-anchor="middle">50%</text>
    <text x="572" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Linarin</text>
    <text x="637" y="388" font-size="11" fill="#2b3442" text-anchor="middle">Acacetin</text>
  </g>
  <text x="600" y="412" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">↓ glycoside never reproducible</text>

  <!-- takeaway -->
  <rect x="55" y="440" width="790" height="58" rx="6" fill="#fbf3e8" stroke="#e0c79a"/>
  <text x="71" y="461" font-size="12.5" font-weight="700" fill="#8a5a12">Interpretation</text>
  <text x="71" y="480" font-size="11.5" fill="#5d4a2a">Linarin's raw-score lead is driven by its sugar moiety (42 vs 21 heavy atoms), not by efficient or reproducible interface engagement. It additionally</text>
  <text x="71" y="495" font-size="11.5" fill="#5d4a2a">violates three Lipinski criteria (MW 593, logP −0.8, 7 HBD). Reported as a methodological size-bias case — a demonstration of why raw score must not be followed alone.</text>
</svg>
