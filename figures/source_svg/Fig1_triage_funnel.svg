<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a2230">Figure 1.</text>
  <text x="120" y="42" font-size="18" fill="#1a2230">In silico triage funnel for OPTN–TBK1 interface-region candidate prioritization</text>
  <text x="40" y="64" font-size="12.5" fill="#5a6472" font-style="italic">Hypothesis-generating; no therapeutic, PPI-disruption, or E50K-selectivity claims. Each stage removes a specific artifact.</text>

  <!-- funnel stages -->
  <!-- stage 1 -->
  <polygon points="120,95 780,95 720,150 180,150" fill="#2e5496"/>
  <text x="450" y="120" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Stage 1 · Exploratory docking (CPU-Vina / CB-Dock2)</text>
  <text x="450" y="140" font-size="12" fill="#dce6f5" text-anchor="middle">Initial panel · raw-score view → Linarin appears as raw-score leader</text>
  <text x="812" y="128" font-size="11.5" fill="#2e5496" text-anchor="start" font-style="italic">raw score only</text>

  <!-- stage 2 -->
  <polygon points="180,160 720,160 672,215 228,215" fill="#3a6bb0"/>
  <text x="450" y="185" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Stage 2 · GPU re-validation (Uni-Dock, Vina scoring)</text>
  <text x="450" y="205" font-size="12" fill="#e3ecf8" text-anchor="middle">Ranking shifts; Linarin signal weakens</text>
  <text x="812" y="193" font-size="11.5" fill="#3a6bb0" text-anchor="start" font-style="italic">engine effect</text>

  <!-- stage 3 -->
  <polygon points="228,225 672,225 624,280 276,280" fill="#4f86c6"/>
  <text x="450" y="250" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Stage 3 · Controlled grid (identical WT/E50K center)</text>
  <text x="450" y="270" font-size="12" fill="#eaf1fa" text-anchor="middle">Blind-center grids differ by ~11.9 Å (AC) → not a valid WT/E50K comparison</text>
  <text x="812" y="258" font-size="11.5" fill="#4f86c6" text-anchor="start" font-style="italic">grid artifact</text>

  <!-- stage 4 -->
  <polygon points="276,290 624,290 576,345 324,345" fill="#6fa3d6"/>
  <text x="450" y="315" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Stage 4 · Pose reproducibility + contact + ligand efficiency</text>
  <text x="450" y="335" font-size="12" fill="#1a2230" text-anchor="middle">Linarin 0% repro, LE −0.14 (size-bias); quinones low repro (25–50%)</text>
  <text x="812" y="323" font-size="11.5" fill="#6fa3d6" text-anchor="start" font-style="italic">size / scaffold bias</text>

  <!-- stage 5 -->
  <polygon points="324,355 576,355 528,410 372,410" fill="#9bc0e2"/>
  <text x="450" y="380" font-size="14" font-weight="700" fill="#1a2230" text-anchor="middle">Stage 5 · Manual structural inspection</text>
  <text x="450" y="399" font-size="11.5" fill="#1a2230" text-anchor="middle">interface-adjacent / surface-associated, not cleft-buried</text>
  <text x="812" y="388" font-size="11.5" fill="#7da7cf" text-anchor="start" font-style="italic">burial check</text>

  <!-- outcome box -->
  <rect x="372" y="430" width="156" height="46" rx="6" fill="#1f3864"/>
  <text x="450" y="450" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Prioritized outcome</text>
  <text x="450" y="468" font-size="11.5" fill="#cdd9ec" text-anchor="middle">Coptisine (interface-adjacent)</text>

  <!-- side legend: roles -->
  <text x="40" y="515" font-size="13" font-weight="700" fill="#1a2230">Final roles</text>
  <g font-size="11.5" fill="#2b3442">
    <rect x="40" y="525" width="12" height="12" fill="#1f3864"/><text x="60" y="535">Coptisine — main interface-adjacent candidate (repro 75%, LE −0.27, Lipinski 0, PAINS-clean)</text>
    <rect x="40" y="545" width="12" height="12" fill="#c0651f"/><text x="60" y="555">Cryptotanshinone / Tanshinone IIA — exploratory scaffolds (PAINS-flagged quinone; repro 25–50%)</text>
    <rect x="40" y="565" width="12" height="12" fill="#7a7f88"/><text x="60" y="575">Tanshinone I — conditional/supplementary (grid-dependent)</text>
    <rect x="40" y="585" width="12" height="12" fill="#8a6d3b"/><text x="60" y="595">Linarin — glycoside size-bias methodological case · Acacetin — aglycone control</text>
    <rect x="40" y="605" width="12" height="12" fill="#9aa0a8"/><text x="60" y="615">Berberine — protoberberine reference · Quercetin — PAINS control · Amlexanox — ATP-site control</text>
  </g>
  <text x="40" y="645" font-size="10.5" fill="#8a929c" font-style="italic">PDB 5EOF (WT OPTN(26–103)/TBK1 CTD) and 5EOA (E50K) used as scaffolds. Full-length AlphaFold-Multimer ipTM ≈ 0.19–0.21 (not used).</text>
</svg>
