name: B2 Z100 gap1 hard third branches exact u-split v8
on:
  workflow_dispatch:
  push:
    branches: [crossdomain-open-problem-tournament-20260817]
    paths:
      - 'crossdomain/b2_gap1_u_split_v8.cpp'
      - '.github/workflows/b2-gap1-u-split-v8-20260817.yml'

jobs:
  exact:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        third: [2,3,4,5,6,7,8,9,10]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact split solver
        run: g++ -std=c++20 -O3 -march=native -pthread -DNDEBUG crossdomain/b2_gap1_u_split_v8.cpp -o b2split
      - name: Exhaust all fourth-element branches
        run: |
          t=${{ matrix.third }}; d=artifact/b2_gap1_t${t}_v8; mkdir -p "$d"
          set +e
          ./b2split "$t" 3150 "$(nproc)" "$d/RESULT.json" "$d/BRANCHES.tsv" > "$d/solver.stdout.log" 2> "$d/solver.stderr.log"
          rc=$?
          set -e
          echo "$rc" > "$d/solver_exit_code.txt"
          test "$rc" -eq 0 -o "$rc" -eq 10 -o "$rc" -eq 124
          cp crossdomain/b2_gap1_u_split_v8.cpp "$d/"
          sha256sum b2split > "$d/BINARY_SHA256.txt"
      - name: Independently audit coverage, witness, and regression control
        env:
          THIRD: ${{ matrix.third }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=int(os.environ['THIRD']);d=Path(f'artifact/b2_gap1_t{t}_v8')
          r=json.loads((d/'RESULT.json').read_text())
          expected=list(range(t+1,92-t))
          observed=[x['fourth'] for x in r['branches']]
          assert r['third']==t
          assert r['expected_fourth_branches']==91-2*t==len(expected)
          assert r['observed_fourth_branches']==len(expected)
          assert observed==expected
          verified=False; detail={}
          if r['witness_found']:
              A=r['witness']; assert len(A)==14 and len(set(A))==14
              counts={d:0 for d in range(1,100)}
              for a in A:
                  for b in A:
                      if a!=b: counts[(a-b)%100]+=1
              verified=max(counts.values())<=2
              assert verified and r['witness_verified']
              detail={'witness':A,'max_ordered_difference_multiplicity':max(counts.values()),'difference_counts':counts}
          if t==10:
              assert r['completed_exhaustively'] and not r['witness_found']
              assert r['aggregate_nodes_including_third_root']==537251446, r['aggregate_nodes_including_third_root']
              detail['regression_control']='PASS: aggregate node count exactly matches the prior monolithic v7 branch t=10'
          status='VERIFIED_WITNESS' if verified else ('EXHAUSTED_NO_WITNESS' if r['completed_exhaustively'] else 'INCOMPLETE_TIMEOUT')
          audit={'third':t,'status':status,'coverage_ok':True,'independent_witness_verifier':verified,'detail':detail}
          (d/'INDEPENDENT_AUDIT.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          (d/'STATUS.txt').write_text(status+'\n',encoding='utf-8')
          print(json.dumps(audit,indent=2))
          PY
          d=artifact/b2_gap1_t${{ matrix.third }}_v8
          find "$d" -type f -print0 | sort -z | xargs -0 sha256sum > "$d/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap1-t${{ matrix.third }}-u-split-v8
          path: artifact/b2_gap1_t${{ matrix.third }}_v8
          retention-days: 30
          if-no-files-found: error
