name: B2 Z100 gap 5 6 7 DRAT certificates
on:
  workflow_dispatch:
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        gap: [5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install python-sat
      - name: Generate exact normalized gap CNF
        env: {GAP: '${{ matrix.gap }}'}
        run: |
          g=${{ matrix.gap }}; d=artifact/gap${g}; mkdir -p "$d"
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'.')
          from crossdomain.b2_gap_sat_v4 import build
          g=int(os.environ['GAP']); d=Path(f'artifact/gap{g}')
          cnf,_,_=build(g); cnf.to_file(d/f'gap{g}.cnf')
          PY
      - name: Build pinned tools
        run: |
          git clone https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout c60730422e758ef1cebe7aeddf2dda31c996bf04
          cd /tmp/cadical && ./configure && make -j2
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C /tmp/drat-trim -j2
      - name: Solve and verify
        run: |
          g=${{ matrix.gap }}; d=artifact/gap${g}
          set +e
          timeout 3150 /tmp/cadical/build/cadical "$d/gap${g}.cnf" \
            "$d/gap${g}.drat" > "$d/cadical.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$d/cadical_exit_code.txt"
          test "$rc" -eq 20
          /tmp/drat-trim/drat-trim "$d/gap${g}.cnf" "$d/gap${g}.drat" \
            > "$d/drat_check.log" 2>&1
          grep -q 'VERIFIED' "$d/drat_check.log"
          echo VERIFIED_UNSAT > "$d/STATUS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: b2-gap${{ matrix.gap }}-drat
          path: artifact/gap${{ matrix.gap }}
