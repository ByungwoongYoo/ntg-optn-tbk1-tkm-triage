<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a2230">Figure 2.</text>
  <text x="120" y="42" font-size="18" fill="#1a2230">Blind-center grids are not spatially controlled between WT and E50K</text>
  <text x="40" y="64" font-size="12.5" fill="#5a6472" font-style="italic">Independent cavity detection placed the WT and E50K AC grids ~11.9 Å apart, confounding any blind-grid mutation comparison.</text>

  <!-- Panel A: AC blind -->
  <text x="60" y="100" font-size="14" font-weight="700" fill="#1a2230">A · AC chain pair — blind-center grids</text>
  <rect x="60" y="115" width="360" height="180" rx="6" fill="#f4f6fa" stroke="#d2d9e4"/>
  <!-- schematic protein surface -->
  <path d="M80,260 Q150,200 240,225 Q330,250 400,205" fill="none" stroke="#b9c2d0" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <text x="402" y="208" font-size="10.5" fill="#9aa3b2">interface region</text>
  <!-- WT grid box -->
  <rect x="150" y="150" width="70" height="70" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="5 3"/>
  <circle cx="185" cy="185" r="4" fill="#2e7d32"/>
  <text x="158" y="143" font-size="11.5" font-weight="700" fill="#2e7d32">WT (5EOF)</text>
  <!-- E50K grid box, offset -->
  <rect x="250" y="200" width="70" height="70" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="5 3"/>
  <circle cx="285" cy="235" r="4" fill="#c0392b"/>
  <text x="258" y="288" font-size="11.5" font-weight="700" fill="#c0392b">E50K (5EOA)</text>
  <!-- offset arrow -->
  <line x1="185" y1="185" x2="285" y2="235" stroke="#1a2230" stroke-width="1.6"/>
  <circle cx="185" cy="185" r="2.5" fill="#1a2230"/><circle cx="285" cy="235" r="2.5" fill="#1a2230"/>
  <rect x="198" y="195" width="74" height="22" rx="4" fill="#1a2230"/>
  <text x="235" y="210" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11.91 Å</text>
  <text x="70" y="285" font-size="10.5" fill="#7a8290">centers differ → different pockets compared</text>

  <!-- Panel B: AC sidechain -->
  <text x="480" y="100" font-size="14" font-weight="700" fill="#1a2230">B · AC chain pair — controlled grid</text>
  <rect x="480" y="115" width="360" height="180" rx="6" fill="#f4f6fa" stroke="#d2d9e4"/>
  <path d="M500,260 Q570,200 660,225 Q750,250 820,205" fill="none" stroke="#b9c2d0" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- identical center boxes overlapping -->
  <rect x="612" y="178" width="70" height="70" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="5 3"/>
  <rect x="616" y="182" width="70" height="70" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="2 3"/>
  <circle cx="649" cy="215" r="4" fill="#1f3864"/>
  <text x="600" y="168" font-size="11.5" font-weight="700" fill="#1f3864">res-50 side-chain avg (WT ≡ E50K)</text>
  <rect x="612" y="262" width="92" height="22" rx="4" fill="#1f3864"/>
  <text x="658" y="277" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0.00 Å apart</text>
  <text x="730" y="277" font-size="10.5" fill="#7a8290">same pocket → valid comparison</text>

  <!-- summary bar -->
  <text x="60" y="345" font-size="14" font-weight="700" fill="#1a2230">C · WT–E50K grid-center offset by definition</text>
  <g font-size="12" fill="#2b3442">
    <!-- bars -->
    <text x="60" y="378" text-anchor="start">AC blind-center</text>
    <rect x="200" y="368" width="357" height="16" fill="#c0392b"/>
    <text x="565" y="381" font-size="11.5" font-weight="700" fill="#c0392b">11.91 Å — confounded</text>

    <text x="60" y="406" text-anchor="start">BD blind-center</text>
    <rect x="200" y="396" width="34" height="16" fill="#e08a3c"/>
    <text x="242" y="409" font-size="11.5" font-weight="700" fill="#c0651f">1.12 Å</text>

    <text x="60" y="434" text-anchor="start">AC / BD side-chain</text>
    <rect x="200" y="424" width="3" height="16" fill="#2e7d32"/>
    <text x="210" y="437" font-size="11.5" font-weight="700" fill="#2e7d32">0.00 Å — controlled</text>
  </g>
  <line x1="200" y1="360" x2="200" y2="446" stroke="#9aa3b2" stroke-width="1"/>
  <text x="200" y="460" font-size="10" fill="#9aa3b2" text-anchor="middle">0</text>
  <text x="557" y="460" font-size="10" fill="#9aa3b2" text-anchor="middle">≈12 Å</text>

  <!-- takeaway -->
  <rect x="60" y="480" width="780" height="52" rx="6" fill="#fbf3e8" stroke="#e0c79a"/>
  <text x="76" y="501" font-size="12.5" font-weight="700" fill="#8a5a12">Methodological consequence</text>
  <text x="76" y="520" font-size="11.5" fill="#5d4a2a">Apparent E50K-favorable trends seen on blind-center grids (esp. AC) reflect grid placement, not mutation effect. Only the identical-center</text>
  <text x="76" y="535" font-size="11.5" fill="#5d4a2a">side-chain grid supports a controlled WT-vs-E50K comparison; under it, no mutation-state selectivity exceeds scoring-function noise.</text>
  <text x="40" y="552" font-size="9.5" fill="#9aa3b2" font-style="italic">Schematic; box positions illustrative. Offsets are exact Euclidean distances between grid-center coordinates in the superposed frame.</text>
</svg>
